<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановленный кошелек</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        body { 
            background-color: #0f0f0f; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .app-container {
            width: 390px;
            height: 844px;
            background-color: #1a1a1c;
            border-radius: 40px; /* Глубокое закругление корпуса */
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }
        /* Скрываем скроллбар */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Стилизация нижнего меню, чтобы оно плавало и было закругленным */
        .floating-nav {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background-color: rgba(30, 30, 32, 0.95);
            border-radius: 40px; /* Закругление самой панели */
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Реальная логика баланса
            const [balance, setBalance] = useState(0);
            const [isDepositModal, setIsDepositModal] = useState(false);
            const [depositAmount, setDepositAmount] = useState('');
            const [prices, setPrices] = useState({
                SOL: { price: 86.45, change: -0.12, cap: '2,74 $B' },
                ETH: { price: 2346.91, change: 1.29, cap: '7,92 $B' },
                BTC: { price: 78101.78, change: 0.55, cap: '17,24 $B' },
                BNB: { price: 631.99, change: 0.23, cap: '753,22 $M' }
            });

            // Функция для получения курсов (для Apple-style обновлений)
            const fetchPrices = async () => {
                try {
                    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT"]');
                    const data = await res.json();
                    
                    const newPrices = { ...prices };
                    data.forEach(coin => {
                        const symbol = coin.symbol.replace('USDT', '');
                        const volume = parseFloat(coin.quoteVolume);
                        let capStr = volume > 1000000000 ? (volume/1000000000).toFixed(2).replace('.', ',') + ' $B' : (volume/1000000).toFixed(2).replace('.', ',') + ' $M';
                        
                        newPrices[symbol] = {
                            price: parseFloat(coin.lastPrice),
                            change: parseFloat(coin.priceChangePercent),
                            cap: capStr
                        };
                    });
                    setPrices(newPrices);
                } catch (e) { console.error("API error", e); }
            };

            useEffect(() => {
                fetchPrices();
                const interval = setInterval(fetchPrices, 5000);
                return () => clearInterval(interval);
            }, []);

            const formatMoney = (val, dec = 2) => {
                return val.toLocaleString('ru-RU', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + ' $';
            };

            const handleDeposit = () => {
                if (depositAmount && !isNaN(depositAmount)) {
                    setBalance(parseFloat(depositAmount));
                    setDepositAmount('');
                    setIsDepositModal(false);
                }
            };

            return (
                <div className="app-container">
                    {/* --- Статус-бар (имитация) --- */}
                    <div className="flex justify-between items-center px-6 pt-1 text-sm text-gray-500 font-medium">
                        <span>9:41</span>
                        <div className="flex gap-1.5 items-center">
                            <span className="material-Icons-outlined text-sm">signal_cellular_alt</span>
                            <span className="material-icons-outlined text-sm">wifi</span>
                            <span className="material-icons-outlined text-sm">battery_full</span>
                        </div>
                    </div>

                    {/* --- Хедер --- */}
                    <div className="px-5 pt-3 flex items-center justify-between">
                        {/* Тот самый "розово-сиреневый шарик" */}
                        <div className="relative">
                            <div className="w-9 h-9 rounded-full bg-purple-500/80 border border-purple-400 flex items-center justify-center">
                                <span className="text-white font-bold text-xs">P</span>
                            </div>
                            <div className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-[#1a1a1c]"></div>
                        </div>
                        <div className="flex-1 mx-4 bg-[#262628] rounded-full flex items-center px-4 py-2.5">
                            <span className="material-icons-outlined text-gray-500 text-lg mr-2">search</span>
                            <span className="text-sm text-gray-500 flex-1">Поиск</span>
                            <span className="material-icons-outlined text-gray-500 text-lg">center_focus_weak</span>
                        </div>
                        <span className="material-icons-outlined text-gray-400 text-2xl">qr_code_2</span>
                    </div>

                    <div className="flex-1 overflow-y-auto no-scrollbar pb-36 px-5 pt-4">
                        {/* --- Селектор кошелька + Красный шарик --- */}
                        <div className="flex justify-center items-center gap-2.5 mb-8">
                            <div className="relative">
                                <div className="bg-[#262628] px-4 py-1.5 rounded-full flex items-center gap-2 text-sm font-medium cursor-pointer">
                                    Основной кошелек <span className="material-icons-outlined text-sm text-gray-500">expand_more</span>
                                </div>
                                {/* ВОТ ОН, КРАСНЫЙ ШАРИК у кошелька */}
                                <div className="absolute -top-1.5 -right-1.5 w-3 h-3 bg-red-500 rounded-full border border-[#1a1a1c]"></div>
                            </div>
                            <div className="bg-[#262628] w-9 h-9 rounded-full flex items-center justify-center cursor-pointer text-gray-400">
                                <span className="material-icons-outlined text-xl">content_copy</span>
                            </div>
                        </div>

                        {/* --- Баланс --- */}
                        <div className="text-center mb-9">
                            <h1 className="text-[44px] font-bold leading-tight">{formatMoney(balance)}</h1>
                            <p className="text-gray-500 text-sm">{formatMoney(balance, 2)} (0.00%)</p>
                        </div>

                        {/* --- 4 Кнопки действий (Точно как на скрине) --- */}
                        <div className="flex justify-between gap-2.5 mb-8 px-1">
                            {[
                                { icon: 'arrow_upward', label: 'Отпр...' },
                                { icon: 'arrow_downward', label: 'Полу...' },
                                { icon: 'sync', label: 'Обмен' }
                            ].map((btn) => (
                                <div key={btn.label} className="flex flex-col items-center gap-2">
                                    <button className="w-16 h-16 bg-[#262628] rounded-2xl flex items-center justify-center border border-[#303032] hover:bg-[#303032] transition active:scale-95">
                                        <span className="material-icons-outlined text-2xl text-white">{btn.icon}</span>
                                    </button>
                                    <span className="text-xs text-gray-300">{btn.label}</span>
                                </div>
                            ))}
                            {/* Четвертая кнопка — Зеленая Покупка */}
                            <div className="flex flex-col items-center gap-2">
                                <button className="w-16 h-16 bg-[#4ade80] rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(74,222,128,0.3)] hover:bg-[#3bcf71] transition active:scale-95">
                                    <span className="material-icons-outlined text-2xl text-black">add</span>
                                </button>
                                <span className="text-xs text-gray-300">Поку...</span>
                            </div>
                        </div>

                        {/* --- Табы (С зеленой линией) --- */}
                        <div className="flex items-center mb-6 border-b border-[#262628]">
                            <div className="text-gray-400 text-sm font-medium mr-6 pb-3 cursor-pointer">Криптовалюта</div>
                            <div className="text-white text-sm font-semibold mr-auto pb-3 border-b-2 border-[#4ade80] cursor-pointer">Избранное</div>
                            <div className="flex gap-4 pb-3 items-center">
                                <span className="material-icons-outlined text-gray-500 text-xl cursor-pointer">history</span>
                                <span className="material-icons-outlined text-gray-500 text-xl cursor-pointer">tune</span>
                            </div>
                        </div>

                        {/* --- Коины (С точными данными) --- */}
                        <div className="space-y-6">
                            {[
                                { sym: 'SOL', name: 'SOL', img: 'https://cryptologos.cc/logos/solana-sol-logo.png?v=025', color: 'bg-purple-600' },
                                { sym: 'ETH', name: 'ETH', img: 'https://cryptologos.cc/logos/ethereum-eth-logo.png?v=025', color: 'bg-blue-500' },
                                { sym: 'BTC', name: 'BTC', img: 'https://cryptologos.cc/logos/bitcoin-btc-logo.png?v=025', color: 'bg-orange-500' },
                                { sym: 'BNB', name: 'BNB', img: 'https://cryptologos.cc/logos/binance-coin-bnb-logo.png?v=025', color: 'bg-yellow-500' }
                            ].map((coin) => {
                                const data = prices[coin.sym];
                                const isPos = data.change >= 0;
                                return (
                                    <div key={coin.sym} className="flex justify-between items-center cursor-pointer">
                                        <div className="flex items-center gap-3.5">
                                            <div className={`w-11 h-11 rounded-full ${coin.color} flex items-center justify-center overflow-hidden`}>
                                                <img src={coin.img} className="w-6 h-6 object-contain" alt="" />
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-lg">{coin.name}</h3>
                                                <p className="text-[11px] text-gray-500 uppercase">{data.cap}</p>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <h3 className="font-bold text-lg">{formatMoney(data.price, data.price > 100 ? 2 : 2)}</h3>
                                            <p className={`text-xs ${isPos ? 'text-[#4ade80]' : 'text-red-500'}`}>
                                                {isPos ? '+' : ''}{data.change.toFixed(2)}%
                                            </p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        <div className="text-center mt-7">
                            <span className="text-[#4ade80] text-sm font-medium hover:underline cursor-pointer">Просмотреть токены</span>
                        </div>
                    </div>

                    {/* --- ТА САМАЯ ПЛАВАЮЩАЯ ЗАКРУГЛЕННАЯ НИЖНЯЯ ПАНЕЛЬ --- */}
                    <div className="floating-nav shadow-2xl">
                        {[
                            { icon: 'home', label: 'Главная', active: true },
                            { icon: 'trending_up', label: 'Популярные' },
                            { icon: 'swap_horiz', label: 'Торговать', special: true },
                            { icon: 'redeem', label: 'Награды' },
                            { icon: 'more_horiz', label: 'Подробнее', action: () => setIsDepositModal(true) }
                        ].map((item) => {
                            if (item.special) {
                                return (
                                    <div key="special" className="relative -top-8">
                                        <div className="w-[60px] h-[60px] bg-[#4ade80] rounded-full flex items-center justify-center border-[6px] border-[#1a1a1c] shadow-[0_0_20px_rgba(74,222,128,0.2)]">
                                            <span className="material-icons-outlined text-black text-2xl font-bold">swap_horiz</span>
                                        </div>
                                        <span className="absolute -bottom-5 w-full text-center text-[10px] text-gray-500 font-medium">Торговать</span>
                                    </div>
                                );
                            }
                            return (
                                <div key={item.label} className="flex flex-col items-center gap-1.5 cursor-pointer" onClick={item.action}>
                                    <span className={`material-icons-outlined text-2xl ${item.active ? 'text-[#4ade80]' : 'text-gray-600'}`}>{item.icon}</span>
                                    <span className={`text-[10px] ${item.active ? 'text-[#4ade80]' : 'text-gray-500'} font-medium`}>{item.label}</span>
                                </div>
                            );
                        })}
                    </div>

                    {/* --- Реальное меню пополнения (МОДАЛКА как в Apple) --- */}
                    {isDepositModal && (
                        <div className="absolute inset-0 bg-black/80 z-[200] flex items-end p-4 backdrop-blur-sm" onClick={() => setIsDepositModal(false)}>
                            <div className="w-full bg-[#202022] rounded-3xl p-6 pb-12 shadow-2xl space-y-5 transform transition-transform duration-300" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-2"></div>
                                <h2 className="text-2xl font-bold text-center">Задать баланс на Главной</h2>
                                <p className="text-gray-400 text-sm text-center">Введи сумму, которую хочешь видеть на балансе.</p>
                                <input 
                                    type="number" 
                                    autofocus
                                    className="bg-[#1a1a1c] text-white text-center text-4xl p-5 rounded-2xl w-full outline-none border border-transparent focus:border-[#4ade80]"
                                    placeholder="0.00 $"
                                    value={depositAmount}
                                    onChange={(e) => setDepositAmount(e.target.value)}
                                />
                                <div className="flex gap-4 pt-2">
                                    <button 
                                        onClick={() => setIsDepositModal(false)}
                                        className="flex-1 bg-[#262628] p-4.5 rounded-xl text-gray-400 font-semibold active:scale-95 transition">
                                        Отмена
                                    </button>
                                    <button 
                                        onClick={handleDeposit}
                                        className="flex-1 bg-[#4ade80] p-4.5 rounded-xl text-black font-bold active:scale-95 transition">
                                        Установить
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
