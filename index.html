<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trust Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1a1a1a;
            --surface-light: #252525;
            --accent-green: #38f37b;
            --text-main: #ffffff;
            --text-muted: #8e8e8e;
            --red-down: #ff4d4d;
            --font-main: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            position: relative;
            padding-bottom: 90px; /* Отступ под закрепленное меню */
        }

        /* --- Fixed Header --- */
        .header {
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 12px;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 10;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
        }

        .search-bar {
            flex-grow: 1;
            background-color: var(--surface-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
        }

        .search-bar i { color: var(--text-muted); margin-right: 8px; }
        .search-bar input {
            background: transparent; border: none; color: #fff; width: 100%; outline: none;
        }

        /* --- Wallet Info --- */
        .wallet-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .wallet-selector {
            background-color: var(--surface-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .main-balance { font-size: 44px; font-weight: 700; }
        .sub-balance { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

        /* --- Quick Actions --- */
        .actions-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 10px 0 30px;
        }

        .action-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .action-btn {
            width: 54px; height: 54px; border-radius: 18px;
            background-color: var(--surface-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
        }
        .action-btn.plus { background-color: var(--accent-green); color: #000; }
        .action-label { font-size: 12px; font-weight: 500; }

        /* --- Tabs --- */
        .tabs-row {
            display: flex;
            padding: 0 16px;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 16px;
        }
        .tab { padding: 12px 12px; color: var(--text-muted); font-weight: 600; font-size: 14px; position: relative; }
        .tab.active { color: #fff; }
        .tab.active::after {
            content: ''; position: absolute; bottom: -1px; left: 12px; right: 12px;
            height: 2px; background: var(--accent-green);
        }

        /* --- Crypto List --- */
        .crypto-list { padding: 0 16px; }
        .crypto-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0;
        }
        .crypto-left { display: flex; align-items: center; gap: 14px; }
        .coin-icon { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        .crypto-info { display: flex; flex-direction: column; }
        .coin-symbol { font-weight: 700; font-size: 16px; }
        .coin-cap { font-size: 12px; color: var(--text-muted); }
        .crypto-right { text-align: right; }
        .coin-price { font-weight: 600; font-size: 16px; }
        .coin-change { font-size: 13px; font-weight: 500; }

        /* --- Sticky Bottom Nav --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 75px;
            background-color: #0c0c0c;
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 12px;
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); text-decoration: none; width: 20%;
        }
        .nav-item.active { color: var(--accent-green); }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 10px; font-weight: 500; }
        
        .nav-center-wrap { position: relative; top: -8px; }
        .nav-center {
            width: 48px; height: 48px; background: var(--accent-green);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #000; font-size: 24px; box-shadow: 0 4px 15px rgba(56, 243, 123, 0.2);
        }

        /* --- Modal (Menu "Подробнее") --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200;
            display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--surface-color); width: 85%; max-width: 320px;
            padding: 24px; border-radius: 24px; border: 1px solid #333;
            text-align: center;
        }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content input {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #444;
            background: #000; color: #fff; font-size: 18px; margin-bottom: 20px; outline: none;
        }
        .modal-btn {
            background: var(--accent-green); color: #000; border: none;
            padding: 12px 24px; border-radius: 12px; font-weight: 700; width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <button class="icon-btn"><i class='bx bx-cog'></i></button>
            <div class="search-bar"><i class='bx bx-search'></i><input type="text" placeholder="Поиск"></div>
            <button class="icon-btn"><i class='bx bx-scan'></i></button>
        </header>

        <div class="wallet-info">
            <div class="wallet-selector">Основной кошелек <i class='bx bx-chevron-right'></i></div>
            <div class="main-balance" id="display-balance">0,00 $</div>
            <div class="sub-balance">0,00 $ (0.00%)</div>
        </div>

        <div class="actions-row">
            <div class="action-item"><div class="action-btn"><i class='bx bx-up-arrow-alt' style="transform: rotate(45deg);"></i></div><span class="action-label">Отправить</span></div>
            <div class="action-item"><div class="action-btn"><i class='bx bx-down-arrow-alt'></i></div><span class="action-label">Получить</span></div>
            <div class="action-item"><div class="action-btn"><i class='bx bx-refresh'></i></div><span class="action-label">Обмен</span></div>
            <div class="action-item"><div class="action-btn plus"><i class='bx bx-plus'></i></div><span class="action-label">Купить</span></div>
        </div>

        <div class="tabs-row">
            <div class="tab">Криптовалюта</div>
            <div class="tab active">Избранное</div>
            <div class="tab">NFT</div>
        </div>

        <div class="crypto-list" id="crypto-container">
            <p style="text-align: center; color: #8e8e8e;">Загрузка курсов...</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><i class='bx bx-home-alt nav-icon'></i><span class="nav-label">Главная</span></a>
        <a href="#" class="nav-item"><i class='bx bx-trending-up nav-icon'></i><span class="nav-label">Популярные</span></a>
        <a href="#" class="nav-item nav-center-wrap"><div class="nav-center"><i class='bx bx-transfer-alt'></i></div><span class="nav-label" style="color:var(--accent-green)">Торговать</span></a>
        <a href="#" class="nav-item"><i class='bx bx-gift nav-icon'></i><span class="nav-label">Награды</span></a>
        <a href="javascript:void(0)" class="nav-item" onclick="openMenu()"><i class='bx bx-grid-alt nav-icon'></i><span class="nav-label">Подробнее</span></a>
    </nav>

    <div id="modal-overlay" onclick="closeMenu(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Изменить баланс</h3>
            <input type="number" id="balance-input" placeholder="Введите сумму">
            <button class="modal-btn" onclick="updateBalance()">Подтвердить</button>
        </div>
    </div>

    <script>
        // Функция для открытия меню "Подробнее"
        function openMenu() {
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        // Закрыть меню
        function closeMenu(e) {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        // Обновить баланс
        function updateBalance() {
            const val = document.getElementById('balance-input').value;
            if(val !== "") {
                const formatted = new Intl.NumberFormat('ru-RU').format(val);
                document.getElementById('display-balance').innerText = formatted + " $";
                closeMenu();
            }
        }

        // Работа с API (CoinGecko)
        const coins = [
            { id: 'solana', symbol: 'SOL', icon: 'https://assets.coingecko.com/coins/images/4128/small/solana.png' },
            { id: 'ethereum', symbol: 'ETH', icon: 'https://assets.coingecko.com/coins/images/279/small/ethereum.png' },
            { id: 'bitcoin', symbol: 'BTC', icon: 'https://assets.coingecko.com/coins/images/1/small/bitcoin.png' },
            { id: 'binancecoin', symbol: 'BNB', icon: 'https://assets.coingecko.com/coins/images/825/small/bnb-icon2_2x.png' }
        ];

        async function fetchPrices() {
            try {
                const ids = coins.map(c => c.id).join(',');
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true&include_market_cap=true`);
                const data = await response.json();
                
                renderList(data);
            } catch (error) {
                console.error("Ошибка API:", error);
            }
        }

        function renderList(apiData) {
            const container = document.getElementById('crypto-container');
            container.innerHTML = '';

            coins.forEach(coin => {
                const price = apiData[coin.id].usd;
                const change = apiData[coin.id].usd_24h_change.toFixed(2);
                const mCap = (apiData[coin.id].usd_market_cap / 1e9).toFixed(2);
                const changeClass = change >= 0 ? 'change-up' : 'change-down';
                const sign = change >= 0 ? '+' : '';

                container.innerHTML += `
                    <div class="crypto-item">
                        <div class="crypto-left">
                            <img src="${coin.icon}" class="coin-icon">
                            <div class="crypto-info">
                                <span class="coin-symbol">${coin.symbol}</span>
                                <span class="coin-cap">${mCap} $B</span>
                            </div>
                        </div>
                        <div class="crypto-right">
                            <span class="coin-price">${new Intl.NumberFormat('en-US').format(price)} $</span>
                            <span class="coin-change ${changeClass}">${sign}${change}%</span>
                        </div>
                    </div>
                `;
            });
        }

        // Запуск обновления цен при загрузке и каждые 30 сек
        fetchPrices();
        setInterval(fetchPrices, 30000);
    </script>
</body>
</html>
