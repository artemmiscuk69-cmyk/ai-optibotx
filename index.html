<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OptiBotX PRO | TradingView</title>
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* для удобства на мобильных */
        }
        :root {
            --bg-color: #050510;
            --app-bg: #0b0b1a;
            --border-color: #1a1a2e;
            --text-color: white;
            --secondary-bg: #161625;
            --hover-color: #2a2a3f;
            --accent: #5b4dff;
            --accent-glow: rgba(91, 77, 255, 0.3);
            --glass-bg: rgba(20, 30, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        body.light-theme {
            --bg-color: #f0f2f5;
            --app-bg: #ffffff;
            --border-color: #ddd;
            --text-color: #222;
            --secondary-bg: #f5f5f5;
            --hover-color: #e0e0e0;
            --accent: #3f51b5;
            --accent-glow: rgba(63, 81, 181, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s, color 0.3s;
            overflow: hidden;
        }
        /* Оверлеи */
        .welcome-overlay, .register-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .welcome-overlay.visible, .register-overlay.visible { opacity: 1; visibility: visible; }
        .welcome-glass, .register-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 30px 25px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.95);
            animation: glassAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes glassAppear { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .welcome-title {
            font-size: 2rem; font-weight: 800; margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #aaccff); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-subtitle { font-size: 0.9rem; color: #aaa; margin-bottom: 25px; }
        .language-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .language-item {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 30px; padding: 12px 20px; font-size: 1.1rem; font-weight: 600;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s;
        }
        .language-item:hover { background: rgba(255,255,255,0.15); transform: scale(1.02); }
        .language-item.selected { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .language-item .flag { font-size: 1.6rem; }
        .start-btn {
            background: var(--accent); border: none; color: white; font-size: 1.2rem; font-weight: 700;
            padding: 14px; border-radius: 40px; cursor: pointer; width: 100%;
            transition: 0.3s; opacity: 0; transform: translateY(20px); pointer-events: none;
        }
        .start-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .start-btn:hover { transform: scale(1.02); box-shadow: 0 0 25px var(--accent-glow); }
        .register-glass h3 { margin-bottom: 15px; font-size: 1.5rem; background: linear-gradient(135deg, #fff, #aaccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .register-glass p { font-size: 0.85rem; margin-bottom: 20px; color: #ccc; }
        .register-input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            border-radius: 30px; color: white; font-size: 1rem; text-align: center;
            margin-bottom: 15px; outline: none;
        }
        .register-input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .action-btn {
            background: var(--accent); border: none; color: white; font-size: 1rem; font-weight: 700;
            padding: 12px; border-radius: 30px; cursor: pointer; width: 100%; transition: 0.3s;
            margin-bottom: 10px;
        }
        .action-btn.secondary { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); }
        .action-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .register-message { font-size: 0.85rem; min-height: 20px; font-weight: bold; margin-top: 5px; }
        .register-message.error { color: #ff4d4d; }
        .register-message.success { color: #00ff88; }
        /* Основное приложение */
        .app-container {
            width: 100%; max-width: 500px; height: 100vh; background: var(--app-bg);
            display: none; flex-direction: column; padding: 15px;
            position: relative; overflow-y: auto; z-index: 1;
        }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
        .logo h1 { font-size: 1.3rem; }
        .logo span { color: var(--accent); text-shadow: 0 0 5px var(--accent); }
        .sub-header { font-size: 0.7rem; color: #888; margin-top: 2px; }
        .header-buttons { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--secondary-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
        }
        /* Поиск пар */
        .selector-container { position: relative; margin-bottom: 15px; flex-shrink: 0; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8899ac; pointer-events: none; }
        #pair-search {
            width: 100%; background: var(--secondary-bg); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 10px 12px 10px 40px; font-size: 0.9rem; outline: none;
        }
        #pair-search:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .pairs-container {
            max-height: 200px; overflow-y: auto; background: var(--secondary-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
            display: none; position: absolute; width: 100%; z-index: 100;
            margin-top: 5px;
        }
        .pair-option {
            padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .pair-option:last-child { border-bottom: none; }
        .pair-option:hover { background: var(--hover-color); }
        .pair-option.selected { background: var(--accent); color: white; }
        .pair-option .pair-flag { font-size: 1.2rem; }
        .pair-option .pair-name { flex: 1; font-weight: 500; font-size: 0.9rem; }
        .pair-option .pair-type { font-size: 0.7rem; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 12px; }
        /* График */
        .chart-container {
            position: relative;
            width: 100%;
            height: 280px; /* явная высота — критично для TradingView */
            margin-bottom: 15px;
            flex-shrink: 0;
            background: var(--app-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        #tv-chart {
            width: 100%;
            height: 100%;
        }
        .otc-placeholder {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            background: var(--secondary-bg); color: var(--text-color);
            font-size: 1rem; font-weight: bold; text-align: center; flex-direction: column;
            border-radius: 16px;
        }
        .chart-controls {
            position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 10;
        }
        .chart-controls button {
            background: var(--secondary-bg); border: 1px solid var(--border-color); color: var(--text-color);
            width: 28px; height: 28px; border-radius: 14px; cursor: pointer; font-weight: bold;
        }
        .indicator-btn {
            background: var(--secondary-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; font-weight: bold;
        }
        .indicator-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .tf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
        .tf-btn {
            background: var(--secondary-bg); border: 1px solid var(--border-color); color: #aaa;
            padding: 8px 0; border-radius: 10px; font-size: 0.7rem; cursor: pointer; font-weight: 600;
            transition: all 0.2s;
        }
        .tf-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .analyze-btn {
            width: 100%; background: var(--accent); border: none; padding: 14px; border-radius: 14px;
            color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 10px;
            position: relative;
        }
        .analyze-btn.cooldown { pointer-events: none; opacity: 0.7; }
        .timer-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; pointer-events: none;
        }
        .timer-circle {
            width: 32px; height: 32px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: white;
            animation: spin 1s linear infinite;
        }
        .timer-number { position: absolute; font-size: 1rem; font-weight: bold; color: white; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-area { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.8rem; }
        .dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        .result-display {
            width: 100%; background: var(--secondary-bg); border: 1px solid var(--border-color);
            border-radius: 12px; text-align: center; font-weight: bold; padding: 10px;
            opacity: 0; visibility: hidden; transition: 0.2s; font-size: 0.9rem;
        }
        .result-display.visible { opacity: 1; visibility: visible; }
        #snow-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        @media (max-width: 450px) {
            .app-container { padding: 12px; }
            .chart-container { height: 250px; }
        }
    </style>
</head>
<body>

<!-- Приветствие -->
<div id="welcome-overlay" class="welcome-overlay visible">
    <div class="welcome-glass">
        <h1 class="welcome-title">Welcome</h1>
        <p class="welcome-subtitle">Choose your language</p>
        <div class="language-list">
            <div class="language-item" data-lang="en"><span class="flag">🇬🇧</span> English</div>
            <div class="language-item" data-lang="ru"><span class="flag">🇷🇺</span> Русский</div>
            <div class="language-item" data-lang="es"><span class="flag">🇪🇸</span> Español</div>
            <div class="language-item" data-lang="fr"><span class="flag">🇫🇷</span> Français</div>
            <div class="language-item" data-lang="de"><span class="flag">🇩🇪</span> Deutsch</div>
        </div>
        <button id="start-btn" class="start-btn">Start</button>
    </div>
</div>

<!-- Активация -->
<div id="access-overlay" class="register-overlay">
    <div class="register-glass">
        <h3 id="access-title">🔐 Access</h3>
        <p id="access-text">Enter your activation code to use the bot.</p>
        <input type="text" id="code-input" class="register-input" placeholder="Enter code">
        <button id="activate-btn" class="action-btn">Activate</button>
        <button id="get-code-btn" class="action-btn secondary">Get Code</button>
        <div id="access-message" class="register-message"></div>
    </div>
</div>

<!-- Основное приложение -->
<div class="app-container" id="main-app">
    <canvas id="snow-layer"></canvas>
    <header>
        <div class="logo"><h1>AI OptiBotX <span>PRO</span></h1><div id="sub-header" class="sub-header">Select currency pair</div></div>
        <div class="header-buttons">
            <button id="themeBtn" class="icon-btn">🌓</button>
            <button id="snowToggle" class="icon-btn">☃️</button>
            <button id="langBtn" class="icon-btn">🇬🇧 EN</button>
        </div>
    </header>

    <div class="selector-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="pair-search" placeholder="🔍 Search pair (EUR, USD, OTC...)" autocomplete="off">
        <div class="pairs-container" id="pairs-container"></div>
    </div>

    <div class="chart-container" id="chart-container">
        <div id="tv-chart"></div>
        <div class="chart-controls">
            <button id="zoomOutBtn">−</button>
            <button id="zoomInBtn">+</button>
        </div>
        <div style="position: absolute; bottom: 8px; left: 8px; z-index: 5;">
            <button id="smaBtn" class="indicator-btn">SMA 7</button>
        </div>
    </div>

    <div class="tf-grid">
        <button class="tf-btn" data-tf="1m">1m</button>
        <button class="tf-btn" data-tf="5m">5m</button>
        <button class="tf-btn" data-tf="15m">15m</button>
        <button class="tf-btn" data-tf="1h">1h</button>
    </div>

    <button id="anBtn" class="analyze-btn"><span class="btn-text">Analyze</span></button>
    <div id="status" class="status-area"><div class="dot"></div> <span id="wait-msg">Waiting...</span></div>
    <div id="result" class="result-display"></div>
</div>

<script>
    (function() {

        let curLang = 'en';

            de: { sub: "Währungspaar wählen", an: "Analysieren", wait: "Warten...", up: "KAUFEN ", down: "VERKAUFEN ", accessTitle: "🔐 Zugang", accessText: "Aktivierungscode eingeben.", codePlaceholder: "Code eingeben", btnActivate: "Aktivieren", btnGetCode: "Code holen", wrongCode: "❌ Ungültiger Code", success: "✅ Zugang gewährt!" }
        };

        // ------------------- ВСЕ ВАЛЮТНЫЕ ПАРЫ (включая OTC) -------------------
        const allPairs = [
            { name: "EUR/USD", flag: "🇪🇺🇺🇸", type: "Major" }, { name: "GBP/USD", flag: "🇬🇧🇺🇸", type: "Major" },
            { name: "USD/JPY", flag: "🇺🇸🇯🇵", type: "Major" }, { name: "AUD/USD", flag: "🇦🇺🇺🇸", type: "Major" },
            { name: "USD/CAD", flag: "🇺🇸🇨🇦", type: "Major" }, { name: "USD/CHF", flag: "🇺🇸🇨🇭", type: "Major" },

            { name: "EUR/JPY", flag: "🇪🇺🇯🇵", type: "Cross" }, { name: "GBP/JPY", flag: "🇬🇧🇯🇵", type: "Cross" },
            { name: "AUD/JPY", flag: "🇦🇺🇯🇵", type: "Cross" }, { name: "EUR/CAD", flag: "🇪🇺🇨🇦", type: "Cross" },
            { name: "AUD/CAD", flag: "🇦🇺🇨🇦", type: "Cross" }, { name: "AUD/NZD", flag: "🇦🇺🇳🇿", type: "Cross" },
            { name: "NZD/JPY", flag: "🇳🇿🇯🇵", type: "Cross" }, { name: "CAD/JPY", flag: "🇨🇦🇯🇵", type: "Cross" },

            { name: "GBP/AUD", flag: "🇬🇧🇦🇺", type: "Cross" }, { name: "EUR/CHF", flag: "🇪🇺🇨🇭", type: "Cross" },
            { name: "GBP/CHF", flag: "🇬🇧🇨🇭", type: "Cross" }, { name: "EUR/NZD", flag: "🇪🇺🇳🇿", type: "Cross" },
            { name: "GBP/NZD", flag: "🇬🇧🇳🇿", type: "Cross" }, { name: "USD/RUB", flag: "🇺🇸🇷🇺", type: "Exotic" },
            { name: "EUR/RUB", flag: "🇪🇺🇷🇺", type: "Exotic" }, { name: "USD/TRY", flag: "🇺🇸🇹🇷", type: "Exotic" },
            { name: "USD/MXN", flag: "🇺🇸🇲🇽", type: "Exotic" }, { name: "USD/ZAR", flag: "🇺🇸🇿🇦", type: "Exotic" },
            { name: "USD/BRL", flag: "🇺🇸🇧🇷", type: "Exotic" }, { name: "USD/INR", flag: "🇺🇸🇮🇳", type: "Exotic" },
            { name: "USD/IDR", flag: "🇺🇸🇮🇩", type: "Exotic" }, { name: "USD/PHP", flag: "🇺🇸🇵🇭", type: "Exotic" },
            { name: "USD/THB", flag: "🇺🇸🇹🇭", type: "Exotic" }, { name: "USD/VND", flag: "🇺🇸🇻🇳", type: "Exotic" },

            { name: "GBP/NZD OTC", flag: "🇬🇧🇳🇿", type: "OTC" }
        ];

        // ------------------- ГРАФИК TRADINGVIEW (ГАРАНТИРОВАННО РАБОТАЕТ) -------------------
        function initTradingViewChart() {
            const container = document.getElementById('tv-chart');
            if (!container) return;
            container.innerHTML = '';
            if (chart) {
                chart.remove();
                chart = null;
                candleSeries = null;
                smaSeries = null;
            }
            const chartContainer = document.getElementById('chart-container');
            const width = chartContainer.clientWidth;
            const height = chartContainer.clientHeight;
            if (width === 0 || height === 0) {
                // если контейнер ещё не отрисован, отложим инициализацию
                setTimeout(initTradingViewChart, 50);
                return;
            }
            chart = LightweightCharts.createChart(container, {
                width: width,
                height: height,
                layout: {
                    background: { color: 'transparent' },
                    textColor: document.body.classList.contains('light-theme') ? '#000' : '#FFF',
                },
                grid: {
                    vertLines: { color: document.body.classList.contains('light-theme') ? '#ddd' : '#1e1e2f' },
                    horzLines: { color: document.body.classList.contains('light-theme') ? '#ddd' : '#1e1e2f' },
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#888' },
                timeScale: { borderColor: '#888', timeVisible: true, secondsVisible: false },
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#00ff88', downColor: '#ff4d4d', borderDownColor: '#ff4d4d', borderUpColor: '#00ff88',
                wickDownColor: '#ff4d4d', wickUpColor: '#00ff88',
            });
            if (showSMA && !smaSeries) {
                smaSeries = chart.addLineSeries({ color: '#ffaa00', lineWidth: 2, title: 'SMA 7' });
            }
            // обработчик изменения размера окна
            window.addEventListener('resize', () => {
                if (chart && !isOTC) {
                    const newRect = document.getElementById('chart-container').getBoundingClientRect();
                    chart.applyOptions({ width: newRect.width, height: newRect.height });
                }
            });
        }

        function updateChartTheme() {
            if (!chart || isOTC) return;
            chart.applyOptions({
                layout: { textColor: document.body.classList.contains('light-theme') ? '#000' : '#FFF' },
                grid: {
                    vertLines: { color: document.body.classList.contains('light-theme') ? '#ddd' : '#1e1e2f' },
                    horzLines: { color: document.body.classList.contains('light-theme') ? '#ddd' : '#1e1e2f' },
                }
            });
        }

        // Генерация случайных исторических свечей
        function generateRandomCandles(count, startPrice = 100) {
            let data = [];
            let price = startPrice;
            let baseTime = Math.floor(Date.now() / 1000) - count * 60;
            for (let i = 0; i < count; i++) {
                let open = price;
                let close = open + (Math.random() - 0.5) * 12;
                let high = Math.max(open, close) + Math.random() * 5 + 2;
                let low = Math.min(open, close) - Math.random() * 5 - 2;
                data.push({
                    time: baseTime + i * 60,
                    open: +open.toFixed(4),
                    high: +high.toFixed(4),
                    low: +low.toFixed(4),
                    close: +close.toFixed(4)
                });
                price = close;
            }
            return data;
        }

        function updateCandles(newCandle) {
            if (!candleSeries || isOTC) return;
            candlesData.push(newCandle);
            if (candlesData.length > 100) candlesData.shift();
            candleSeries.setData(candlesData);
            if (showSMA && smaSeries) {
                let smaValues = [];
                let period = 7;
                for (let i = period-1; i < candlesData.length; i++) {
                    let sum = 0;
                    for (let j = i-period+1; j <= i; j++) sum += candlesData[j].close;
                    smaValues.push({ time: candlesData[i].time, value: sum/period });
                }
                smaSeries.setData(smaValues);
            }
        }

        function addNewCandle() {
            if (!candleSeries || candlesData.length === 0 || isOTC) return;
            let last = candlesData[candlesData.length-1];
            let newOpen = last.close;
            let newClose = newOpen + (Math.random() - 0.5) * 8;
            let newHigh = Math.max(newOpen, newClose) + Math.random() * 4 + 2;
            let newLow = Math.min(newOpen, newClose) - Math.random() * 4 - 2;
            let newTime = last.time + 60;
            let newCandle = {
                time: newTime,
                open: +newOpen.toFixed(4),
                high: +newHigh.toFixed(4),
                low: +newLow.toFixed(4),
                close: +newClose.toFixed(4)
            };
            updateCandles(newCandle);
        }

        function startDataInterval() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                if (!isOTC && chart && candleSeries && candlesData.length > 0) {
                    addNewCandle();
                }
            }, 3000);
        }

        // Загрузка пары (OTC или обычная)
        function loadPair(pairName) {
            currentPair = pairName;
            isOTC = pairName.toLowerCase().includes('otc');
            const chartDiv = document.getElementById('tv-chart');
            if (updateInterval) clearInterval(updateInterval);
            
            if (isOTC) {
                if (chart) {
                    chart.remove();
                    chart = null;
                    candleSeries = null;
                    smaSeries = null;
                }
                chartDiv.innerHTML = '<div class="otc-placeholder">📊 В разработке<br>OTC график появится позже</div>';
            } else {
                chartDiv.innerHTML = '';
                initTradingViewChart();
                // даём время на инициализацию
                setTimeout(() => {
                    if (candleSeries) {
                        candlesData = generateRandomCandles(30, 100);
                        candleSeries.setData(candlesData);
                        if (showSMA && smaSeries) {
                            let period = 7;
                            let smaVals = [];
                            for (let i = period-1; i < candlesData.length; i++) {
                                let sum = 0;
                                for (let j = i-period+1; j <= i; j++) sum += candlesData[j].close;
                                smaVals.push({ time: candlesData[i].time, value: sum/period });
                            }
                            smaSeries.setData(smaVals);
                        }
                        startDataInterval();
                    }
                }, 100);
            }
        }

        // ------------------- ОСТАЛЬНЫЕ ФУНКЦИИ -------------------
        function updateUILang() {
            document.getElementById('sub-header').innerText = dict[curLang].sub;
            document.querySelector('#anBtn .btn-text').innerText = dict[curLang].an;
            document.getElementById('wait-msg').innerText = dict[curLang].wait;
            document.getElementById('pair-search').placeholder = dict[curLang].sub;
            document.getElementById('access-title').innerText = dict[curLang].accessTitle;
            document.getElementById('access-text').innerText = dict[curLang].accessText;
            document.getElementById('code-input').placeholder = dict[curLang].codePlaceholder;
            document.getElementById('activate-btn').innerText = dict[curLang].btnActivate;
            document.getElementById('get-code-btn').innerText = dict[curLang].btnGetCode;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            updateChartTheme();
        }

        // Снег
        const sCanvas = document.getElementById('snow-layer');
        const sCtx = sCanvas.getContext('2d');
        let flakes = [];
        function setupSnow() {
            sCanvas.width = window.innerWidth;
            sCanvas.height = window.innerHeight;
            flakes = Array.from({length:60},()=>({ x:Math.random()*sCanvas.width, y:Math.random()*sCanvas.height, r:Math.random()*3+1, d:Math.random()*1+0.5, angle:Math.random()*360 }));
            if(snowAnimation) cancelAnimationFrame(snowAnimation);
            drawSnow();
        }
        function drawSnow() {
            if(!snowEnabled) { sCtx.clearRect(0,0,sCanvas.width,sCanvas.height); snowAnimation=requestAnimationFrame(drawSnow); return; }
            sCtx.clearRect(0,0,sCanvas.width,sCanvas.height); sCtx.fillStyle="rgba(255,255,255,0.6)";
            flakes.forEach(f=>{
                sCtx.save(); sCtx.translate(f.x,f.y); sCtx.rotate(f.angle*Math.PI/180);
                sCtx.beginPath(); sCtx.arc(0,0,f.r,0,Math.PI*2); sCtx.fill(); sCtx.restore();
                f.y+=f.d; f.x+=Math.sin(f.angle)*0.2;
                if(f.y>sCanvas.height) { f.y=-5; f.x=Math.random()*sCanvas.width; }
                if(f.x>sCanvas.width) f.x=0; if(f.x<0) f.x=sCanvas.width;
            });
            snowAnimation=requestAnimationFrame(drawSnow);
        }
        function toggleSnow() { snowEnabled = !snowEnabled; document.getElementById('snowToggle').innerText = snowEnabled ? '❄️' : '☃️'; }

        // Поиск пар
        function renderPairs(filter = '') {
            const filterLower = filter.toLowerCase();
            const filtered = allPairs.filter(p => p.name.toLowerCase().includes(filterLower) || p.type.toLowerCase().includes(filterLower));
            const container = document.getElementById('pairs-container');
            container.innerHTML = '';
            filtered.forEach(pair => {
                const div = document.createElement('div'); div.className = 'pair-option';
                if (pair.name === currentPair) div.classList.add('selected');
                div.innerHTML = `<span class="pair-flag">${pair.flag}</span><span class="pair-name">${pair.name}</span><span class="pair-type">${pair.type}</span>`;
                div.addEventListener('click', () => {
                    document.querySelectorAll('.pair-option').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    document.getElementById('pair-search').value = pair.name;
                    loadPair(pair.name);
                    document.getElementById('pairs-container').style.display = 'none';
                });
                container.appendChild(div);
            });
        }

        // Анализ
        function startAnalysis(btn) {
            if (!registered) {
                document.getElementById('access-overlay').classList.add('visible');
                return;
            }
            if (cooldownActive) return;
            cooldownActive = true; btn.classList.add('cooldown');
            const timerOverlay = document.createElement('div'); timerOverlay.className = 'timer-overlay';
            const circle = document.createElement('div'); circle.className = 'timer-circle';
            const number = document.createElement('span'); number.className = 'timer-number'; number.innerText = '5';
            timerOverlay.appendChild(circle); timerOverlay.appendChild(number); btn.appendChild(timerOverlay);
            let timeLeft = 5;
            const interval = setInterval(() => { timeLeft--; number.innerText = timeLeft; if (timeLeft <= 0) clearInterval(interval); }, 1000);
            const res = document.getElementById('result'); const stat = document.getElementById('status');
            res.classList.remove('visible'); stat.style.display = 'flex';
            setTimeout(() => {
                stat.style.display = 'none'; res.classList.add('visible');
                const isUp = Math.random() > 0.5;
                res.style.color = isUp ? '#00ff88' : '#ff4d4d'; res.style.borderColor = isUp ? '#00ff88' : '#ff4d4d';
                res.innerHTML = `${dict[curLang][isUp?'up':'down']} (${Math.floor(Math.random()*15+82)}%)`;
                res.style.animation = 'popIn 0.4s';
                setTimeout(() => res.style.animation = '', 400);
            }, 1500);
            setTimeout(() => { clearInterval(interval); cooldownActive = false; btn.classList.remove('cooldown'); const ov = btn.querySelector('.timer-overlay'); if(ov) ov.remove(); }, 5000);
        }

        // Активация по кодам
        const validCodes = ['10341638','20451927','30561836','40771345','50881454','60991563','70101672','80211781','90321890','10431909','11542018','12652127','13762236','14872345','15982454','16092563','17102672','18212781','19322890','20432909','21543018','22653127','23763236','24873345','25983454','26093563','27103672','28213781','29323890','30433909','31544018','32654127','33764236','34874345','35984454','36094563','37104672','38214781','39324890','40434909','41545018','42655127','43765236','44875345','45985454','46095563','47105672','48215781','49325890','50435909'];
        let usedCodes = JSON.parse(localStorage.getItem('usedCodes')) || {};
        function isCodeValid(code) { return validCodes.includes(code) && !usedCodes[code]; }
        function markCodeAsUsed(code) { usedCodes[code] = true; localStorage.setItem('usedCodes', JSON.stringify(usedCodes)); }

        // ------------------- ЗАПУСК ПРИЛОЖЕНИЯ -------------------
        const welcomeOverlay = document.getElementById('welcome-overlay');
        const startBtn = document.getElementById('start-btn');
        const langItems = document.querySelectorAll('.language-item');
        langItems.forEach(item => {
            item.addEventListener('click', () => {
                langItems.forEach(i => i.classList.remove('selected'));
                item.classList.add('selected'); curLang = item.dataset.lang;
                startBtn.classList.add('visible');
                document.querySelector('.welcome-title').innerText = dict[curLang].welcome || 'Welcome';
                document.querySelector('.welcome-subtitle').innerText = dict[curLang].chooseLang || 'Choose your language';
            });
        });
        startBtn.addEventListener('click', () => {
            welcomeOverlay.classList.remove('visible');
            document.getElementById('main-app').style.display = 'flex';
            currentPair = allPairs[0].name;
            document.getElementById('pair-search').value = currentPair;
            renderPairs('');
            loadPair(currentPair);
            setupSnow();
            updateUILang();

            // Обработчики UI
            document.getElementById('themeBtn').onclick = toggleTheme;
            document.getElementById('snowToggle').onclick = toggleSnow;
            document.getElementById('langBtn').onclick = () => {
                const langs = ['en','ru','es','fr','de'];
                let idx = langs.indexOf(curLang); idx = (idx+1)%langs.length; curLang = langs[idx];
                document.getElementById('langBtn').innerHTML = `${dict[curLang].flag || '🌐'} ${curLang.toUpperCase()}`;
                updateUILang();
            };
            document.getElementById('zoomInBtn').onclick = () => { if(!isOTC && chart) chart.timeScale().zoomIn(); };
            document.getElementById('zoomOutBtn').onclick = () => { if(!isOTC && chart) chart.timeScale().zoomOut(); };
            document.getElementById('smaBtn').onclick = () => {
                if(isOTC) return;
                showSMA = !showSMA;
                document.getElementById('smaBtn').classList.toggle('active', showSMA);
                if (!isOTC && chart) {
                    if (showSMA && !smaSeries) {
                        smaSeries = chart.addLineSeries({ color: '#ffaa00', lineWidth: 2, title: 'SMA 7' });
                        let period = 7;
                        let smaVals = [];
                        for (let i = period-1; i < candlesData.length; i++) {
                            let sum = 0;
                            for (let j = i-period+1; j <= i; j++) sum += candlesData[j].close;
                            smaVals.push({ time: candlesData[i].time, value: sum/period });
                        }
                        smaSeries.setData(smaVals);
                    } else if (!showSMA && smaSeries) {
                        chart.removeSeries(smaSeries);
                        smaSeries = null;
                    }
                }
            };
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    // Можно изменить интервал обновления свечей, но для демо оставим
                });
            });
            document.getElementById('anBtn').onclick = () => startAnalysis(document.getElementById('anBtn'));
            document.getElementById('pair-search').addEventListener('input', (e) => renderPairs(e.target.value));
            document.getElementById('pair-search').addEventListener('focus', () => document.getElementById('pairs-container').style.display = 'block');
            document.addEventListener('click', (e) => { if(!document.getElementById('pair-search').contains(e.target) && !document.getElementById('pairs-container').contains(e.target)) document.getElementById('pairs-container').style.display = 'none'; });
            
            // Активация
            document.getElementById('activate-btn').onclick = () => {
                const code = document.getElementById('code-input').value.trim();
                const msgDiv = document.getElementById('access-message');
                if (isCodeValid(code)) {
                    markCodeAsUsed(code);
                    registered = true;
                    localStorage.setItem('optibotx_registered', 'true');
                    msgDiv.innerText = dict[curLang].success;
                    msgDiv.className = 'register-message success';
                    setTimeout(() => document.getElementById('access-overlay').classList.remove('visible'), 1500);
                } else {
                    msgDiv.innerText = dict[curLang].wrongCode;
                    msgDiv.className = 'register-message error';
                }
            };
            document.getElementById('get-code-btn').onclick = () => {
                document.getElementById('access-overlay').classList.remove('visible');
                alert('Contact @ZentixTrade to get your code');
            };
            
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.setHeaderColor('bg_color');
            }
        });
    })();
</script>
