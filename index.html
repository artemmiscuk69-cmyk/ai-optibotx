<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OptiBotX PRO</title>
    <style>
        :root {
            --bg-color: #050510;
            --app-bg: #0b0b1a;
            --border-color: #1a1a2e;
            --text-color: white;
            --secondary-bg: #161625;
            --hover-color: #2a2a3f;
            --accent: #5b4dff;
            --accent-glow: rgba(91, 77, 255, 0.3);
            --glass-bg: rgba(20, 30, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        body.light-theme {
            --bg-color: #f0f2f5;
            --app-bg: #ffffff;
            --border-color: #ddd;
            --text-color: #222;
            --secondary-bg: #f5f5f5;
            --hover-color: #e0e0e0;
            --accent: #3f51b5;
            --accent-glow: rgba(63, 81, 181, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        body {
            margin: 0;
            padding: 0; 
            background: var(--bg-color); 
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif; 
            height: 100dvh; /* Используем dvh для идеального отображения на мобильных */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* --- OVERLAYS --- */
        .welcome-overlay, .register-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .welcome-overlay {
            background: var(--bg-color);
            z-index: 10000;
        }
        .register-overlay {
            background: rgba(0,0,0,0.8);
            z-index: 20000;
        }
        .welcome-overlay.visible, .register-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        /* --- GLASS PANELS --- */
        .welcome-glass, .register-glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px 20px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.9);
            animation: glassAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }
        @keyframes glassAppear {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* --- TYPOGRAPHY --- */
        .welcome-title, .register-glass h3 {
            font-weight: 800;
            margin: 0 0 10px;
            background: linear-gradient(135deg, #fff, #aaccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-title {
            font-size: 2.2rem;
            text-shadow: 0 0 30px rgba(91,77,255,0.5);
        }
        .register-glass h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .welcome-subtitle { font-size: 1rem; color: #aaa; margin-bottom: 25px; }
        .register-glass p { font-size: 0.95rem; margin-bottom: 15px; line-height: 1.4; color: #ccc; }

        /* --- CLOSE BUTTON --- */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: #8899ac;
            cursor: pointer;
            transition: 0.3s;
            line-height: 1;
        }
        .close-btn:hover {
            color: #ff4d4d;
            transform: scale(1.1) rotate(90deg);
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
        }

        /* --- LANGUAGE SELECTOR --- */
        .language-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            max-height: 40vh;
            overflow-y: auto;
            padding: 5px;
        }
        .language-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .language-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .language-item.selected {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* --- BUTTONS & INPUTS --- */
        .start-btn, .register-btn {
            background: var(--accent);
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .start-btn {
            font-size: 1.3rem;
            padding: 16px;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        .start-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .register-btn {
            font-size: 1.1rem;
            padding: 14px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .start-btn:hover, .register-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        
        .register-input {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: var(--text-color);
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .register-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            background: rgba(0,0,0,0.6);
        }

        /* --- TG LINK BUTTON --- */
        .tg-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #0088cc, #00aaff);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4);
            transition: 0.3s;
            font-size: 1rem;
        }
        .tg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.6);
        }

        .register-message {
            font-size: 0.95rem;
            min-height: 20px;
            margin-top: 10px;
            font-weight: bold;
        }
        .register-message.error { color: #ff4d4d; text-shadow: 0 0 10px rgba(255,77,77,0.4); }
        .register-message.success { color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.4); }

        /* --- MAIN APP --- */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100dvh;
            background: var(--app-bg);
            display: none;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            border: 1px solid var(--border-color);
            animation: fadeInScale 0.5s ease-out;
            transition: background 0.3s, border-color 0.3s;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        @media (max-height: 700px) {
            .app-container { padding: 10px; }
            .chart-container { height: 35vh; min-height: 180px; }
            .tf-btn { padding: 6px 0; font-size: 11px; }
            .analyze-btn { padding: 12px; margin: 8px 0; }
        }
        @media (min-height: 701px) {
            .chart-container { height: 40vh; min-height: 250px; }
        }

        header { 
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            flex-shrink: 0;
        }
        .logo h1 { 
            font-size: clamp(18px, 5vw, 22px);
            margin: 0; 
            color: var(--text-color); 
            animation: glowPulse 2s infinite; 
        }
        .logo span { 
            color: var(--accent);
            font-weight: 800; 
            text-shadow: 0 0 8px var(--accent); 
        }
        .sub-header { font-size: 11px; color: #8899ac; margin-top: 2px; }
        .header-buttons { display: flex; gap: 6px; }
        .icon-btn { 
            background: var(--secondary-bg);
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
            padding: 6px 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }
        .icon-btn:hover { 
            background: var(--hover-color);
            transform: scale(1.05); 
        }

        .selector-container { position: relative; margin-bottom: 10px; flex-shrink: 0; }
        .search-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #8899ac; font-size: 16px; pointer-events: none; z-index: 2;
        }
        #pair-search {
            width: 100%;
            background: var(--secondary-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px 12px 45px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        #pair-search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .pairs-container {
            max-height: 250px;
            overflow-y: auto;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 5px 0;
            display: none;
            position: absolute;
            width: 100%;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            top: calc(100% + 5px);
        }
        .pair-option {
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .pair-option:hover { background: var(--hover-color); }
        .pair-option.selected { background: var(--accent); color: white; }
        .pair-option .pair-flag { font-size: 1.4rem; min-width: 25px; text-align: center; }
        .pair-option .pair-name { flex: 1; font-weight: 600; }
        .pair-option .pair-type {
            font-size: 11px; color: #8899ac; background: rgba(0,0,0,0.3);
            padding: 3px 8px; border-radius: 6px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .chart-box { 
            width: 100%; height: 100%; 
            background: var(--app-bg); 
            border-radius: 15px; 
            border: 1px solid var(--border-color);
            position: relative; 
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }
        #mainChart { width: 100%; height: 100%; display: block; }
        .watermark {
            position: absolute; bottom: 8px; right: 12px;
            font-size: 12px; color: rgba(255,255,255,0.15);
            pointer-events: none; z-index: 5; font-weight: bold;
        }
        .chart-controls {
            position: absolute; top: 8px; right: 8px; 
            display: flex; gap: 6px; z-index: 10;
        }
        .chart-controls button {
            background: var(--glass-bg);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color); 
            color: var(--text-color);
            width: 32px; height: 32px; 
            border-radius: 16px; 
            cursor: pointer; 
            font-weight: bold;
            transition: all 0.3s;
            font-size: 16px;
        }
        .chart-controls button:hover { background: var(--accent); color: white; border-color: var(--accent);}

        .tf-grid { 
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            margin-bottom: 12px; 
            flex-shrink: 0;
        }
        .tf-btn { 
            background: var(--secondary-bg);
            border: 1px solid var(--border-color); 
            color: #8899ac; 
            padding: 10px 0; 
            border-radius: 10px; 
            font-size: 13px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            font-weight: 700;
        }
        .tf-btn:hover {
            transform: translateY(-2px);
            background: var(--hover-color);
            color: var(--text-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .tf-btn.active { 
            background: var(--accent);
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .analyze-btn { 
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #7b6dff); 
            border: none; 
            padding: 16px; 
            border-radius: 15px; 
            color: white; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: clamp(16px, 4vw, 18px);
            margin-bottom: 10px;
            transition: all 0.3s; 
            position: relative; 
            overflow: hidden;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px var(--accent-glow);
        }
        .analyze-btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 35px rgba(91, 77, 255, 0.5);
        }
        .analyze-btn.cooldown { pointer-events: none; opacity: 0.8; }
        .analyze-btn .btn-text { transition: opacity 0.2s; }
        .analyze-btn.cooldown .btn-text { opacity: 0; }
        
        .timer-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        .timer-circle {
            width: 30px; height: 30px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: white;
            animation: spin 1s linear infinite; position: absolute;
        }
        
        .spinner {
            display: none;
            width: 24px; height: 24px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: white;
            animation: spin 1s linear infinite;
        }

        .status-area { 
            display: flex; justify-content: center; align-items: center; 
            gap: 8px; height: 24px; font-size: 14px; flex-shrink: 0; color: #8899ac;
        }
        .dot { 
            width: 10px; height: 10px; background: #2575fc; border-radius: 50%; 
            box-shadow: 0 0 10px #2575fc; animation: pulseDot 1.2s infinite;
        }
        
        .result-display { 
            width: 100%; height: 45px; background: var(--secondary-bg);
            border: 2px solid var(--border-color); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px; margin-top: 10px;
            opacity: 0; visibility: hidden; transition: all 0.3s;
            flex-shrink: 0; text-transform: uppercase;
        }
        .result-display.visible { opacity: 1; visibility: visible; }

        #snow-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        
        @keyframes fadeInScale { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.6; } }
        @keyframes glowPulse { 0%, 100% { text-shadow: 0 0 5px var(--accent); } 50% { text-shadow: 0 0 20px var(--accent); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>

<div id="welcome-overlay" class="welcome-overlay visible">
    <div class="welcome-glass">
        <h1 class="welcome-title">Welcome</h1>
        <p class="welcome-subtitle">Choose your language</p>
        <div class="language-list">
            <div class="language-item" data-lang="en"><span class="flag">🇬🇧</span> English</div>
            <div class="language-item" data-lang="es"><span class="flag">🇪🇸</span> Español</div>
            <div class="language-item" data-lang="ru"><span class="flag">🇷🇺</span> Русский</div>
            <div class="language-item" data-lang="pl"><span class="flag">🇵🇱</span> Polski</div>
            <div class="language-item" data-lang="de"><span class="flag">🇩🇪</span> Deutsch</div>
            <div class="language-item" data-lang="fr"><span class="flag">🇫🇷</span> Français</div>
        </div>
        <button id="start-btn" class="start-btn">Start</button>
    </div>
</div>

<div id="register-overlay" class="register-overlay">
    <div class="register-glass">
        <span class="close-btn" id="close-register">&times;</span>
        <h3 id="register-title">🔐 Авторизация</h3>
        <p id="register-text">Для доступа к сигналам укажите ваш ID для проверки регистрации.</p>
  
        <input type="text" id="code-input" class="register-input" placeholder="Введите ваш ID">
        
        <button id="activate-btn" class="register-btn">
            <span id="btn-text-act">Проверить ID</span>
            <div class="spinner" id="act-spinner"></div>
        </button>
        
        <a class="tg-btn" href="https://t.me/ZentixTrade" target="_blank">
            💬 Поддержка @ZentixTrade
        </a>
        
        <div id="register-message" class="register-message"></div>
    </div>
</div>

<div class="app-container" id="main-app">
    <canvas id="snow-layer"></canvas>

    <header>
        <div class="logo">
            <h1>AI OptiBotX <span>PRO</span></h1>
            <div id="sub-header" class="sub-header">Select currency pair</div>
        </div>
        <div class="header-buttons">
            <button id="themeBtn" class="icon-btn" onclick="toggleTheme()">🌓</button>
            <button id="snowToggle" class="icon-btn" onclick="toggleSnow()">☃️</button>
            <button id="langBtn" class="icon-btn">🇬🇧 EN</button>
        </div>
    </header>

    <div class="selector-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="pair-search" placeholder="🔍 Search pair (EUR, USD, OTC...)" autocomplete="off">
        <div class="pairs-container" id="pairs-container"></div>
    </div>
    <select id="pair" onchange="changePair()" style="display: none;"></select>

    <div class="chart-container">
        <div class="chart-box">
            <canvas id="mainChart"></canvas>
            <div id="watermark" class="watermark">OptiBotX PRO</div>
        </div>
        <div class="chart-controls">
            <button onclick="zoomOut()">−</button>
            <button onclick="zoomIn()">+</button>
        </div>
    </div>

    <div class="tf-grid">
        <button class="tf-btn" onclick="selectTf(this)">5s</button>
        <button class="tf-btn" onclick="selectTf(this)">10s</button>
        <button class="tf-btn" onclick="selectTf(this)">15s</button>
        <button class="tf-btn" onclick="selectTf(this)">30s</button>
        <button class="tf-btn active" onclick="selectTf(this)">1m</button>
        <button class="tf-btn" onclick="selectTf(this)">2m</button>
        <button class="tf-btn" onclick="selectTf(this)">5m</button>
        <button class="tf-btn" onclick="selectTf(this)">15m</button>
    </div>

    <button id="anBtn" class="analyze-btn" onclick="startAnalysis(this)">
        <span class="btn-text">Analyze</span>
    </button>

    <div id="status" class="status-area">
        <div class="dot"></div> <span id="wait-msg">Waiting...</span>
    </div>

    <div id="result" class="result-display"></div>
</div>

<script>
    const canvas = document.getElementById('mainChart');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    let candles = [];
    let candleCount = 14;
    let snowEnabled = false;
    let curLang = 'en';

            registerTitle: "🔐 Acceso", registerText: "Para acceder a las señales, ingrese su ID para verificar.",

        },
        ru: { 
            sub: "Выбери валютную пару", an: "Анализировать", wait: "Ожидание...", up: "ВВЕРХ ", down: "ВНИЗ ",
            welcome: "Добро пожаловать", chooseLang: "Выберите язык", flag: "🇷🇺",
            registerTitle: "🔐 Доступ", registerText: "Для доступа к сигналам укажите ваш ID для проверки.",
            codePlaceholder: "Введите ваш ID", submit: "Проверить ID",
            wrongCode: "❌ ID не найден или неверен", success: "✅ Доступ открыт!"
        },
        pl: {
            sub: "Wybierz parę walutową", an: "Analizuj", wait: "Oczekiwanie...", up: "W GÓRĘ ", down: "W DÓŁ ",
            welcome: "Witaj", chooseLang: "Wybierz język", flag: "🇵🇱",
            registerTitle: "🔐 Dostęp", registerText: "Wprowadź swój identyfikator, aby zweryfikować rejestrację.",
            codePlaceholder: "Wprowadź swoje ID", submit: "Sprawdź ID",
            wrongCode: "❌ Nieprawidłowy identyfikator", success: "✅ Dostęp przyznany!"
        },
        de: {
            sub: "Währungspaar auswählen", an: "Analysieren", wait: "Warten...", up: "KAUFEN ", down: "VERKAUFEN ",
            welcome: "Willkommen", chooseLang: "Sprache wählen", flag: "🇩🇪",
            registerTitle: "🔐 Zugang", registerText: "Geben Sie Ihre ID ein, um die Registrierung zu überprüfen.",
            codePlaceholder: "Geben Sie Ihre ID ein", submit: "ID überprüfen",
            wrongCode: "❌ Ungültige ID", success: "✅ Zugang gewährt!"
        },
        fr: {
            sub: "Choisissez une paire", an: "Analyser", wait: "Attente...", up: "ACHAT ", down: "VENTE ",
            welcome: "Bienvenue", chooseLang: "Choisissez la langue", flag: "🇫🇷",
            registerTitle: "🔐 Accès", registerText: "Entrez votre identifiant pour vérifier l'inscription.",
            codePlaceholder: "Entrez votre identifiant", submit: "Vérifier l'ID",
            wrongCode: "❌ Identifiant invalide", success: "✅ Accès accordé!"
        }
    };

    const welcomeOverlay = document.getElementById('welcome-overlay');
    const startBtn = document.getElementById('start-btn');
    const langItems = document.querySelectorAll('.language-item');
    const pairsContainer = document.getElementById('pairs-container');
    const searchInput = document.getElementById('pair-search');
    const hiddenSelect = document.getElementById('pair');
    const anBtn = document.getElementById('anBtn');
    const waitMsg = document.getElementById('wait-msg');
    const snowToggle = document.getElementById('snowToggle');
    const langBtn = document.getElementById('langBtn');
    const themeBtn = document.getElementById('themeBtn');
    const registerOverlay = document.getElementById('register-overlay');
    const codeInput = document.getElementById('code-input');
    const activateBtn = document.getElementById('activate-btn');
    const registerMessage = document.getElementById('register-message');
    const closeRegister = document.getElementById('close-register');

    const allPairs = [
        { name: "EUR/USD", flag: "🇪🇺🇺🇸", type: "Major" }, { name: "GBP/USD", flag: "🇬🇧🇺🇸", type: "Major" },
        { name: "USD/JPY", flag: "🇺🇸🇯🇵", type: "Major" }, { name: "AUD/USD", flag: "🇦🇺🇺🇸", type: "Major" },
        { name: "EUR/USD OTC", flag: "🇪🇺🇺🇸", type: "OTC" }, { name: "GBP/USD OTC", flag: "🇬🇧🇺🇸", type: "OTC" }
    ];

    langItems.forEach(item => {
        item.addEventListener('click', () => {
            langItems.forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            curLang = item.dataset.lang;
            startBtn.classList.add('visible');
            document.querySelector('.welcome-title').innerText = dict[curLang].welcome;
            document.querySelector('.welcome-subtitle').innerText = dict[curLang].chooseLang;
        });
    });

    startBtn.addEventListener('click', () => {
        welcomeOverlay.classList.remove('visible');
        document.getElementById('main-app').style.display = 'flex';
        allPairs.forEach(p => {
            const option = document.createElement('option');
            option.value = p.name;
            option.text = p.name;
            hiddenSelect.appendChild(option);
        });
        if (allPairs.length > 0) {
            hiddenSelect.value = allPairs[0].name;
            searchInput.value = allPairs[0].name;
        }
        renderPairs();
        initChart();
        setupSnow();
        updateUILang();
    });

    function updateUILang() {
        document.getElementById('sub-header').innerText = dict[curLang].sub;
        anBtn.querySelector('.btn-text').innerText = dict[curLang].an;
        waitMsg.innerText = dict[curLang].wait;
        searchInput.placeholder = dict[curLang].sub;
        document.getElementById('register-title').innerText = dict[curLang].registerTitle;
        document.getElementById('register-text').innerText = dict[curLang].registerText;
        codeInput.placeholder = dict[curLang].codePlaceholder;
        document.getElementById('btn-text-act').innerText = dict[curLang].submit;
    }

    langBtn.onclick = function() {
        const langs = ['en', 'es', 'ru', 'pl', 'de', 'fr'];
        curLang = langs[(langs.indexOf(curLang) + 1) % langs.length];
        this.innerHTML = `${dict[curLang].flag} ${curLang.toUpperCase()}`;
        updateUILang();
    };

    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    
    // Snow logic
    const sCanvas = document.getElementById('snow-layer');
    const sCtx = sCanvas.getContext('2d');
    let flakes = [], snowAnimation;
    function setupSnow() {
        sCanvas.width = sCanvas.parentElement.clientWidth;
        sCanvas.height = sCanvas.parentElement.clientHeight;
        flakes = Array.from({length:60},()=>({ x:Math.random()*sCanvas.width, y:Math.random()*sCanvas.height, r:Math.random()*3+1, d:Math.random()*1+0.5, angle:Math.random()*360 }));
        if(snowAnimation) cancelAnimationFrame(snowAnimation);
        drawSnow();
    }
    function drawSnow() {
        if(!snowEnabled) { sCtx.clearRect(0,0,sCanvas.width,sCanvas.height); snowAnimation=requestAnimationFrame(drawSnow); return; }
        sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
        sCtx.fillStyle="rgba(255,255,255,0.6)";
        flakes.forEach(f=>{
            sCtx.save(); sCtx.translate(f.x,f.y); sCtx.rotate(f.angle*Math.PI/180);
            sCtx.beginPath(); sCtx.arc(0,0,f.r,0,Math.PI*2); sCtx.fill(); sCtx.restore();
            f.y+=f.d; f.x+=Math.sin(f.angle)*0.2;
            if(f.y>sCanvas.height) { f.y=-5; f.x=Math.random()*sCanvas.width; }
            if(f.x>sCanvas.width) f.x=0; if(f.x<0) f.x=sCanvas.width;
        });
        snowAnimation=requestAnimationFrame(drawSnow);
    }
    function toggleSnow() { snowEnabled = !snowEnabled; snowToggle.innerText = snowEnabled ? '❄️' : '☃️'; }

    // Pairs
    function renderPairs(filter = '') {
        const filterLower = filter.toLowerCase();
        const filtered = allPairs.filter(p => p.name.toLowerCase().includes(filterLower) || p.type.toLowerCase().includes(filterLower));
        pairsContainer.innerHTML = '';
        filtered.forEach(pair => {
            const div = document.createElement('div');
            div.className = 'pair-option' + (pair.name === hiddenSelect.value ? ' selected' : '');
            div.innerHTML = `<span class="pair-flag">${pair.flag}</span><span class="pair-name">${pair.name}</span><span class="pair-type">${pair.type}</span>`;
            div.addEventListener('click', () => {
                document.querySelectorAll('.pair-option').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected'); hiddenSelect.value = pair.name; searchInput.value = pair.name;
                changePair(); pairsContainer.style.display = 'none';
            });
            pairsContainer.appendChild(div);
        });
    }
    searchInput.addEventListener('focus', () => pairsContainer.style.display = 'block');
    document.addEventListener('click', (e) => { if (!searchInput.contains(e.target) && !pairsContainer.contains(e.target)) pairsContainer.style.display = 'none'; });
    searchInput.addEventListener('input', (e) => { renderPairs(e.target.value); pairsContainer.style.display = 'block'; });

    // Chart
    function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
    }
    function initChart() {
        setupCanvas(); candles = []; let price = 100;
        for(let i=0; i<candleCount; i++) { 
            let open = price; let close = price + (Math.random() - 0.5) * 15;
            candles.push({ open, close, high: Math.max(open, close) + Math.random()*5 + 3, low: Math.min(open, close) - Math.random()*5 - 3, progress: 1 });
            price = close;
        }
        render();
    }
    function render() {
        const w = canvas.width / dpr, h = canvas.height / dpr;
        ctx.clearRect(0,0, w, h);
        const allPrices = candles.flatMap(c => [c.high, c.low]);
        const minP = Math.min(...allPrices), maxP = Math.max(...allPrices), range = (maxP - minP) || 10;
        const getY = (p) => h - ((p - minP) / range) * (h * 0.7) - (h * 0.15);
        const candleWidth = w / candles.length;
        candles.forEach((c, i) => {
            const x = i * candleWidth + (candleWidth * 0.15), isUp = c.close >= c.open, color = isUp ? '#00ff88' : '#ff4d4d';
            ctx.strokeStyle = color; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(x + (candleWidth * 0.35), getY(c.high)); ctx.lineTo(x + (candleWidth * 0.35), getY(c.low)); ctx.stroke();
            let openY = getY(c.open), closeY = getY(c.close), bodyY, bodyH;
            if (isUp) { let currentCloseY = openY - (openY - closeY) * c.progress; bodyY = currentCloseY; bodyH = openY - currentCloseY; } 
            else { let currentCloseY = openY + (closeY - openY) * c.progress; bodyY = openY; bodyH = currentCloseY - openY; }
            if (c.progress > 0 && bodyH > 0.5) {
                ctx.fillStyle = color; ctx.beginPath();
                let rectX = x, rectY = bodyY, rectW = candleWidth * 0.7, rectH = bodyH, radius = 2;
                ctx.moveTo(rectX + radius, rectY); ctx.lineTo(rectX + rectW - radius, rectY);
                ctx.quadraticCurveTo(rectX + rectW, rectY, rectX + rectW, rectY + radius);
                ctx.lineTo(rectX + rectW, rectY + rectH - radius);
                ctx.quadraticCurveTo(rectX + rectW, rectY + rectH, rectX + rectW - radius, rectY + rectH);
                ctx.lineTo(rectX + radius, rectY + rectH);
                ctx.quadraticCurveTo(rectX, rectY + rectH, rectX, rectY + rectH - radius);
                ctx.lineTo(rectX, rectY + radius);
                ctx.quadraticCurveTo(rectX, rectY, rectX + radius, rectY);
                ctx.closePath(); ctx.fill();
            }
        });
    }
    setInterval(() => {
        if(candles.length === 0) return;
        candles.shift(); let last = candles[candles.length-1], nO = last.close, nC = nO + (Math.random() - 0.5) * 8;
        let newCandle = { open: nO, close: nC, high: Math.max(nO, nC) + Math.random()*4 + 2, low: Math.min(nO, nC) - Math.random()*4 - 2, progress: 0 };
        candles.push(newCandle);
        let progress = 0;
        function animateNew() { progress += 0.05; newCandle.progress = Math.min(progress, 1); render(); if (progress < 1) requestAnimationFrame(animateNew); }
        animateNew();
    }, 3000);

    function zoomIn() { if (candleCount > 5) candleCount -= 2; initChart(); }
    function zoomOut() { if (candleCount < 30) candleCount += 2; initChart(); }
    window.zoomIn = zoomIn; window.zoomOut = zoomOut;

    function changePair() {
        canvas.style.opacity = '0.3';
        setTimeout(() => {
            initChart(); canvas.style.opacity = '1';
            document.querySelectorAll('.pair-option').forEach(el => {
                if (el.querySelector('.pair-name')?.innerText === hiddenSelect.value) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }, 500);
    }
    window.changePair = changePair;

    // --- АНАЛИЗ ---
    function startAnalysis(btn) {
        if (!registered) {
            registerOverlay.classList.add('visible');
            return;
        }
        if (cooldownActive) return;

        cooldownActive = true;
        btn.classList.add('cooldown');

        const timerOverlay = document.createElement('div');
        timerOverlay.className = 'timer-overlay';
        const circle = document.createElement('div');
        circle.className = 'timer-circle';
        timerOverlay.appendChild(circle);
        btn.appendChild(timerOverlay);

        const res = document.getElementById('result');
        const stat = document.getElementById('status');
        res.classList.remove('visible');
        stat.style.display = 'flex';
        
        setTimeout(() => {
            stat.style.display = 'none'; 
            res.classList.add('visible');
            const isUp = Math.random() > 0.5;
            res.style.color = isUp ? '#00ff88' : '#ff4d4d';
            res.style.borderColor = isUp ? '#00ff88' : '#ff4d4d';
            res.innerHTML = `${dict[curLang][isUp?'up':'down']} (${Math.floor(Math.random()*15+82)}%)`;
            res.style.animation = 'popIn 0.4s';
            setTimeout(() => res.style.animation = '', 400);
        }, 1500);
        
        setTimeout(() => {
            cooldownActive = false;
            btn.classList.remove('cooldown');
            const overlay = btn.querySelector('.timer-overlay');
            if (overlay) overlay.remove();
        }, 3000);
    }
    window.startAnalysis = startAnalysis;

    // --- ПРОВЕРКА ID (Имитация постбэка) ---
    activateBtn.addEventListener('click', () => {
        const code = codeInput.value.trim();
        if (!code) return;

        // Прячем текст, показываем лоадер
        document.getElementById('btn-text-act').style.display = 'none';
        document.getElementById('act-spinner').style.display = 'block';
        activateBtn.disabled = true;
        activateBtn.style.opacity = '0.8';

        // Имитация запроса к серверу на 2 секунды
        setTimeout(() => {
            document.getElementById('btn-text-act').style.display = 'inline';
            document.getElementById('act-spinner').style.display = 'none';
            activateBtn.disabled = false;
            activateBtn.style.opacity = '1';

            // Логика проверки: если введено больше 4 символов - успех
            if (code.length >= 5) {
                registered = true;
                localStorage.setItem('optibotx_registered', 'true');
                registerMessage.innerText = dict[curLang].success;
                registerMessage.className = 'register-message success';
                
                setTimeout(() => {
                    registerOverlay.classList.remove('visible');
                    registerMessage.innerText = '';
                }, 1500);
            } else {
                // Если ID не подходит
                registerMessage.innerText = dict[curLang].wrongCode;
                registerMessage.className = 'register-message error';
            }
        }, 2000);
    });

    // Закрытие по крестику
    closeRegister.addEventListener('click', () => {
        registerOverlay.classList.remove('visible');
    });

    // --- ВЫБОР ТАЙМФРЕЙМА ---
    function selectTf(btn) {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    window.selectTf = selectTf;
</script>
</body>
