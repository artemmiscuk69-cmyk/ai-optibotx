<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OptiBotX PRO | PocketOption Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #050514;
            --bg-card: rgba(18, 22, 45, 0.75);
            --accent-primary: #7c3aed;
            --accent-secondary: #c084fc;
            --accent-glow: rgba(124, 58, 237, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #a0a3c0;
            --border-glass: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --danger: #ef4444;
            --chart-up: #00d68f;
            --chart-down: #ff4d6d;
        }

        body.light {
            --bg-deep: #f0f2f8;
            --bg-card: rgba(255, 255, 255, 0.85);
            --text-primary: #1a1e2c;
            --text-secondary: #4b5563;
            --border-glass: rgba(0, 0, 0, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-deep);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.4s ease;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            background: radial-gradient(ellipse at 20% 30%, rgba(124,58,237,0.08) 0%, transparent 70%);
        }

        /* ========== ВЫБОР ЯЗЫКА ========== */
        .language-welcome {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a1f 0%, #03030c 100%);
            backdrop-filter: blur(30px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2), visibility 0.6s;
            opacity: 1;
            visibility: visible;
        }

        .language-welcome.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .lang-glass-card {
            background: linear-gradient(145deg, rgba(25, 30, 55, 0.9), rgba(15, 18, 38, 0.95));
            backdrop-filter: blur(20px);
            border-radius: 64px;
            width: 86%;
            max-width: 380px;
            padding: 36px 24px 40px;
            border: 1px solid rgba(124, 58, 237, 0.5);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(124, 58, 237, 0.2) inset;
            text-align: center;
            animation: langCardRise 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
        }

        @keyframes langCardRise {
            0% { opacity: 0; transform: scale(0.88) translateY(40px); filter: blur(12px);}
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0);}
        }

        .glowing-icon {
            font-size: 64px;
            filter: drop-shadow(0 0 20px rgba(124,58,237,0.7));
            animation: iconFloat 2.5s infinite ease-in-out;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px);}
            50% { transform: translateY(-8px);}
        }

        .lang-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c084fc, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 12px 0 6px;
        }

        .lang-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .lang-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 14px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .lang-option:hover {
            background: rgba(124, 58, 237, 0.3);
            transform: scale(1.02);
            border-color: var(--accent-primary);
        }

        .lang-option.selected {
            background: linear-gradient(95deg, #7c3aed, #a855f7);
            border-color: transparent;
            box-shadow: 0 0 20px rgba(124,58,237,0.5);
            color: white;
        }

        .enter-btn {
            background: linear-gradient(95deg, #7c3aed, #c084fc);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 18px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.5;
            pointer-events: none;
            transform: scale(0.96);
        }

        .enter-btn.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            box-shadow: 0 8px 28px rgba(124,58,237,0.4);
        }

        /* ========== АКТИВАЦИЯ ========== */
        .activation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 25, 0.92);
            backdrop-filter: blur(28px);
            z-index: 19000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
            opacity: 0;
            visibility: hidden;
        }

        .activation-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .activation-card {
            background: linear-gradient(135deg, rgba(20, 25, 55, 0.95), rgba(12, 15, 38, 0.98));
            backdrop-filter: blur(20px);
            border-radius: 56px;
            width: 88%;
            max-width: 360px;
            padding: 32px 24px;
            border: 1px solid rgba(124, 58, 237, 0.5);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: modalPop 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.2);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.92) translateY(20px);}
            to { opacity: 1; transform: scale(1) translateY(0);}
        }

        .activation-icon {
            font-size: 56px;
            margin-bottom: 8px;
        }

        .activation-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .code-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(124, 58, 237, 0.5);
            border-radius: 60px;
            padding: 16px 18px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            color: white;
            margin: 20px 0;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .code-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 25px var(--accent-glow);
            outline: none;
        }

        .activation-btn {
            background: linear-gradient(95deg, #7c3aed, #a855f7);
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 12px;
        }

        .help-btn {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            width: 100%;
            padding: 12px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .contact-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(124,58,237,0.2);
            padding: 8px 20px;
            border-radius: 60px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* ========== ОСНОВНОЙ ИНТЕРФЕЙС ========== */
        .main-interface {
            width: 100%;
            height: 100%;
            padding: 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .glass-header {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 36px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-glass);
        }

        .logo {
            font-weight: 800;
            font-size: 18px;
            background: linear-gradient(135deg, #fff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .pocket-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #1e2a3a, #0f172a);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 0 10px rgba(255,215,0,0.2);
        }

        .pocket-badge span:first-child {
            font-size: 18px;
        }

        .pocket-badge span:last-child {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .icon-glass {
            background: rgba(255,255,255,0.08);
            width: 38px;
            height: 38px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
        }

        .search-area {
            position: relative;
        }

        .search-box {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 48px;
            padding: 14px 18px 14px 48px;
            color: var(--text-primary);
            font-size: 14px;
            backdrop-filter: blur(8px);
        }

        .search-icon-abs {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.7;
        }

        .pairs-menu {
            position: absolute;
            top: 58px;
            left: 0;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            border: 1px solid var(--border-glass);
            display: none;
        }

        .pair-row {
            padding: 12px 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            transition: 0.1s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .pair-row:hover {
            background: var(--accent-primary);
        }

        .pair-flag {
            font-size: 20px;
            min-width: 36px;
        }

        /* ГРАФИК */
        .chart-container {
            position: relative;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 12px;
            border: 1px solid var(--border-glass);
        }

        .chart-box {
            position: relative;
            width: 100%;
            height: 220px;
            background: rgba(0,0,0,0.2);
            border-radius: 24px;
            overflow: hidden;
        }

        canvas#mainChart {
            width: 100%;
            height: 100%;
            display: block;
        }

        .chart-watermark {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 9px;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
            font-weight: 500;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .chart-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 5;
        }

        .chart-controls button {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 16px;
        }

        .indicator-btn {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            color: white;
            font-size: 11px;
            cursor: pointer;
            z-index: 5;
            font-weight: 500;
        }

        .tf-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tf-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 0;
            border-radius: 44px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .tf-btn.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .analyze-btn-main {
            background: linear-gradient(95deg, #7c3aed, #a855f7);
            border: none;
            border-radius: 60px;
            padding: 18px;
            font-weight: 800;
            font-size: 17px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .result-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 60px;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            font-size: 18px;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: all 0.3s;
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            font-size: 12px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5);}
            70% { box-shadow: 0 0 0 6px rgba(16,185,129,0);}
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0);}
        }

        @keyframes shake {
            0%,100% { transform: translateX(0);}
            20%,60% { transform: translateX(-5px);}
            40%,80% { transform: translateX(5px);}
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- ВЫБОР ЯЗЫКА -->
    <div id="languageWelcome" class="language-welcome">
        <div class="lang-glass-card">
            <div class="glowing-icon">🌍✨</div>
            <div class="lang-title">OptiBotX PRO</div>
            <div class="lang-sub">Choose your language / Выберите язык</div>
            <div class="lang-grid" id="langGrid">
                <div class="lang-option" data-lang="en">🇬🇧 English</div>
                <div class="lang-option" data-lang="ru">🇷🇺 Русский</div>
                <div class="lang-option" data-lang="es">🇪🇸 Español</div>
                <div class="lang-option" data-lang="de">🇩🇪 Deutsch</div>
                <div class="lang-option" data-lang="fr">🇫🇷 Français</div>
                <div class="lang-option" data-lang="pl">🇵🇱 Polski</div>
            </div>
            <button id="enterAppBtn" class="enter-btn">➡️ ENTER PLATFORM</button>
        </div>
    </div>

    <!-- АКТИВАЦИЯ -->
    <div id="activationModal" class="activation-overlay">
        <div class="activation-card">
            <div class="activation-icon">🔐⚡</div>
            <div class="activation-title">Quantum Access</div>
            <div style="font-size: 13px; margin: 8px 0 12px; opacity: 0.7;">Введите лицензионный ключ</div>
            <input type="text" id="licenseKeyInput" class="code-field" placeholder="XXXX XXXX XXXX" autocomplete="off">
            <button id="submitActivationBtn" class="activation-btn">🎯 Активировать PRO</button>
            <button id="showInstructionBtn" class="help-btn">📘 Как получить код?</button>
            <div id="activationFeedback" style="font-size: 12px; margin-top: 14px; min-height: 32px;"></div>
            <div id="copyContactBtn" class="contact-chip">🤖 Telegram: @ZentixTrade 📋</div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="mainAppInterface" class="main-interface" style="display: none;">
        <div class="glass-header">
            <div class="logo">⚡ OptiBotX <span style="color:#c084fc;">PRO</span></div>
            <div class="pocket-badge">
                <span>📈</span>
                <span>PocketOption</span>
                <span>⚡</span>
            </div>
            <div class="header-icons">
                <div id="globalThemeBtn" class="icon-glass">🌓</div>
                <div id="snowEffectBtn" class="icon-glass">❄️</div>
            </div>
        </div>

        <div class="search-area">
            <span class="search-icon-abs">🔍</span>
            <input type="text" id="pairSearchInput" class="search-box" placeholder="Поиск валютной пары...">
            <div id="pairsDropdown" class="pairs-menu"></div>
        </div>

        <!-- ГРАФИК -->
        <div class="chart-container">
            <div class="chart-box">
                <canvas id="mainChart"></canvas>
                <div class="chart-watermark">OptiBotX PRO | PocketOption</div>
                <div class="chart-controls">
                    <button id="zoomOutBtn">−</button>
                    <button id="zoomInBtn">+</button>
                </div>
                <button id="smaIndicatorBtn" class="indicator-btn">📈 SMA 7</button>
            </div>
        </div>

        <div class="tf-buttons" id="tfContainer">
            <button class="tf-btn" data-tf="5s">5s</button><button class="tf-btn" data-tf="10s">10s</button>
            <button class="tf-btn" data-tf="15s">15s</button><button class="tf-btn" data-tf="30s">30s</button>
            <button class="tf-btn active" data-tf="1m">1m</button><button class="tf-btn" data-tf="2m">2m</button>
            <button class="tf-btn" data-tf="5m">5m</button><button class="tf-btn" data-tf="15m">15m</button>
        </div>

        <button id="analyzeSignalBtn" class="analyze-btn-main">🚀 AI Анализ</button>

        <div class="status-line">
            <div class="live-dot"></div>
            <span id="liveStatusText">Система готова</span>
        </div>
        <div id="signalResultBox" class="result-panel"></div>
    </div>
</div>

<script>
    (function(){
        let currentLanguage = 'ru';
        let isActivated = false;
        
        // ВАЛИДНЫЕ КОДЫ
        const validCodesList = [
            '10341638','20451927','30561836','40771345','50881454','60991563','70101672',
            '80211781','90321890','10431909','11542018','12652127','13762236','14872345',
            '15982454','16092563','17102672','18212781','19322890','20432909','21543018',
            '22653127','23763236','24873345','25983454','26093563','27103672','28213781',
            '29323890','30433909','31544018','32654127','33764236','34874345','35984454'
        ];
        let usedCodesStore = JSON.parse(localStorage.getItem('used_pro_codes')) || {};
        
        function checkCodeValid(code){ return validCodesList.includes(code) && !usedCodesStore[code]; }
        function markCodeUsed(code){ usedCodesStore[code]=true; localStorage.setItem('used_pro_codes',JSON.stringify(usedCodesStore)); }
        
        // Элементы
        const langWelcomeDiv = document.getElementById('languageWelcome');
        const activationModal = document.getElementById('activationModal');
        const mainInterface = document.getElementById('mainAppInterface');
        const enterBtn = document.getElementById('enterAppBtn');
        const langOptions = document.querySelectorAll('.lang-option');
        const activateSubmit = document.getElementById('submitActivationBtn');
        const licenseInput = document.getElementById('licenseKeyInput');
        const activationFeedback = document.getElementById('activationFeedback');
        const showInstrBtn = document.getElementById('showInstructionBtn');
        const copyContact = document.getElementById('copyContactBtn');
        
        let selectedLang = null;
        
        // Мультиязычность
        const translations = {
            en: { searchPlace: "Search currency pair...", analyze: "🚀 AI Analysis", statusReady: "System ready", buy: "BUY", sell: "SELL" },
            ru: { searchPlace: "Поиск валютной пары...", analyze: "🚀 AI Анализ", statusReady: "Система готова", buy: "ВВЕРХ", sell: "ВНИЗ" },
            es: { searchPlace: "Buscar par de divisas...", analyze: "🚀 Análisis IA", statusReady: "Sistema listo", buy: "COMPRAR", sell: "VENDER" },
            de: { searchPlace: "Währungspaar suchen...", analyze: "🚀 KI-Analyse", statusReady: "System bereit", buy: "KAUFEN", sell: "VERKAUFEN" },
            fr: { searchPlace: "Rechercher une paire...", analyze: "🚀 Analyse IA", statusReady: "Système prêt", buy: "ACHAT", sell: "VENTE" },
            pl: { searchPlace: "Szukaj pary walutowej...", analyze: "🚀 Analiza AI", statusReady: "System gotowy", buy: "KUPNO", sell: "SPRZEDAŻ" }
        };
        
        function updateUITexts(){
            const t = translations[currentLanguage] || translations.ru;
            const searchInput = document.getElementById('pairSearchInput');
            if(searchInput) searchInput.placeholder = t.searchPlace;
            const analyzeBtn = document.getElementById('analyzeSignalBtn');
            if(analyzeBtn) analyzeBtn.innerHTML = t.analyze;
            const statusSpan = document.getElementById('liveStatusText');
            if(statusSpan) statusSpan.innerText = t.statusReady;
        }
        
        // Выбор языка
        langOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                langOptions.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedLang = opt.dataset.lang;
                currentLanguage = selectedLang;
                enterBtn.classList.add('active');
                enterBtn.innerText = currentLanguage === 'ru' ? '🚀 ВОЙТИ В ПЛАТФОРМУ' : '🚀 ENTER PLATFORM';
            });
        });
        
        enterBtn.addEventListener('click', () => {
            if(!selectedLang){
                activationFeedback.innerText = currentLanguage === 'ru' ? 'Выберите язык!' : 'Select language!';
                return;
            }
            langWelcomeDiv.classList.add('hidden');
            activationModal.classList.add('visible');
        });
        
        function showInstructionPopup(){
            const modalDiv = document.createElement('div');
            modalDiv.style.position='fixed'; modalDiv.style.top='0'; modalDiv.style.left='0';
            modalDiv.style.width='100%'; modalDiv.style.height='100%'; modalDiv.style.background='rgba(0,0,0,0.85)';
            modalDiv.style.backdropFilter='blur(24px)'; modalDiv.style.zIndex='30000';
            modalDiv.style.display='flex'; modalDiv.style.alignItems='center'; modalDiv.style.justifyContent='center';
            const inner = document.createElement('div');
            inner.style.background='linear-gradient(145deg,#1a1f35,#0c0f28)'; inner.style.borderRadius='56px';
            inner.style.padding='28px 24px'; inner.style.maxWidth='340px'; inner.style.width='85%';
            inner.style.border='1px solid #7c3aed'; inner.style.textAlign='center';
            inner.innerHTML = `
                <div style="font-size:48px;">📘🔑</div>
                <h3 style="margin:12px 0; font-size:24px; background:linear-gradient(135deg,#fff,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">${currentLanguage === 'ru' ? 'Как получить код' : 'How to get code'}</h3>
                <div style="text-align:left; margin:20px 0; display:flex; flex-direction:column; gap:16px;">
                    <div><span style="background:#7c3aed; display:inline-block; width:26px; height:26px; border-radius:30px; text-align:center; margin-right:12px;">1</span> ${currentLanguage === 'ru' ? 'Напишите в Telegram:' : 'Message in Telegram:'} <strong style="color:#c084fc;">@ZentixTrade</strong></div>
                    <div><span style="background:#7c3aed; display:inline-block; width:26px; height:26px; border-radius:30px; text-align:center; margin-right:12px;">2</span> ${currentLanguage === 'ru' ? 'Отправьте слово "КОД PRO"' : 'Send word "CODE PRO"'}</div>
                    <div><span style="background:#7c3aed; display:inline-block; width:26px; height:26px; border-radius:30px; text-align:center; margin-right:12px;">3</span> ${currentLanguage === 'ru' ? 'Получите уникальный ключ' : 'Get unique key'}</div>
                </div>
                <button id="closeInstrModal" style="background:#7c3aed; border:none; padding:12px 20px; border-radius:60px; color:white; font-weight:bold; width:100%; cursor:pointer;">${currentLanguage === 'ru' ? 'Понятно' : 'Got it'}</button>
            `;
            modalDiv.appendChild(inner);
            document.body.appendChild(modalDiv);
            document.getElementById('closeInstrModal').onclick = () => modalDiv.remove();
            modalDiv.onclick = (e) => { if(e.target === modalDiv) modalDiv.remove(); };
        }
        showInstrBtn.onclick = showInstructionPopup;
        
        copyContact.onclick = () => {
            navigator.clipboard.writeText('@ZentixTrade');
            const toast = document.createElement('div');
            toast.innerText = '✅ Copied!';
            toast.style.position='fixed'; toast.style.bottom='30px'; toast.style.left='50%'; toast.style.transform='translateX(-50%)';
            toast.style.background='#000000aa'; toast.style.backdropFilter='blur(12px)'; toast.style.padding='8px 24px'; toast.style.borderRadius='60px'; toast.style.color='white'; toast.style.zIndex='99999';
            document.body.appendChild(toast);
            setTimeout(()=>toast.remove(),1500);
        };
        
        activateSubmit.onclick = () => {
            const code = licenseInput.value.trim();
            if(checkCodeValid(code)){
                markCodeUsed(code);
                isActivated = true;
                activationFeedback.innerHTML = currentLanguage === 'ru' ? '✅ Доступ открыт! Загрузка...' : '✅ Access granted! Loading...';
                activationFeedback.style.color = '#10b981';
                setTimeout(() => {
                    activationModal.classList.remove('visible');
                    mainInterface.style.display = 'flex';
                    initCoreApp();
                }, 800);
            } else {
                activationFeedback.innerHTML = currentLanguage === 'ru' ? '❌ Неверный или использованный код' : '❌ Invalid or used code';
                activationFeedback.style.color = '#ef4444';
                licenseInput.style.animation = 'shake 0.3s';
                setTimeout(()=> licenseInput.style.animation='',400);
            }
        };
        
        // ОСНОВНОЙ ГРАФИК С ФЛАГАМИ
        function initCoreApp(){
            updateUITexts();
            
            const pairsList = [
                { name: "EUR/USD", flag: "🇪🇺🇺🇸" }, { name: "GBP/USD", flag: "🇬🇧🇺🇸" }, { name: "USD/JPY", flag: "🇺🇸🇯🇵" },
                { name: "AUD/USD", flag: "🇦🇺🇺🇸" }, { name: "USD/CAD", flag: "🇺🇸🇨🇦" }, { name: "EUR/GBP", flag: "🇪🇺🇬🇧" },
                { name: "GBP/JPY", flag: "🇬🇧🇯🇵" }, { name: "EUR/JPY", flag: "🇪🇺🇯🇵" }, { name: "USD/RUB", flag: "🇺🇸🇷🇺" },
                { name: "EUR/RUB", flag: "🇪🇺🇷🇺" }, { name: "BTC/USD", flag: "₿🇺🇸" }, { name: "ETH/USD", flag: "⟠🇺🇸" }
            ];
            let currentPair = "EUR/USD";
            let candles = [];
            let candleCount = 18;
            let showSMA = false;
            let smaData = [];
            let cooldownActive = false;
            let snowActive = false;
            let snowCanvasRef = null;
            let animationInterval;
            
            const chartCanvas = document.getElementById('mainChart');
            const ctx = chartCanvas.getContext('2d');
            let dpr = window.devicePixelRatio || 1;
            
            const searchField = document.getElementById('pairSearchInput');
            const dropdownDiv = document.getElementById('pairsDropdown');
            const smaBtn = document.getElementById('smaIndicatorBtn');
            const analyzeMainBtn = document.getElementById('analyzeSignalBtn');
            const resultDiv = document.getElementById('signalResultBox');
            const statusSpan = document.getElementById('liveStatusText');
            const themeBtn = document.getElementById('globalThemeBtn');
            const snowBtn = document.getElementById('snowEffectBtn');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const tfBtns = document.querySelectorAll('.tf-btn');
            
            function generateCandles(){
                let price = 100;
                candles = [];
                for(let i=0; i<candleCount; i++){
                    let open = price;
                    let close = open + (Math.random() - 0.5) * 12;
                    candles.push({
                        open, close,
                        high: Math.max(open, close) + Math.random() * 5 + 2,
                        low: Math.min(open, close) - Math.random() * 5 - 2,
                        progress: 1
                    });
                    price = close;
                }
                calculateSMA();
            }
            
            function calculateSMA(period = 7){
                smaData = [];
                for(let i = period-1; i < candles.length; i++){
                    let sum = 0;
                    for(let j = i-period+1; j <= i; j++) sum += candles[j].close;
                    smaData.push({ index: i, value: sum/period });
                }
            }
            
            function drawChart(){
                if(!chartCanvas || !ctx) return;
                const rect = chartCanvas.parentElement.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                chartCanvas.width = w * dpr;
                chartCanvas.height = h * dpr;
                chartCanvas.style.width = w + 'px';
                chartCanvas.style.height = h + 'px';
                ctx.setTransform(1,0,0,1,0,0);
                ctx.scale(dpr, dpr);
                ctx.clearRect(0,0,w,h);
                
                if(!candles.length) return;
                
                const allPrices = candles.flatMap(c => [c.high, c.low]);
                const minP = Math.min(...allPrices);
                const maxP = Math.max(...allPrices);
                const range = (maxP - minP) || 10;
                const getY = (p) => h - ((p - minP) / range) * (h * 0.7) - (h * 0.12);
                
                // Сетка
                ctx.strokeStyle = document.body.classList.contains('light') ? "#ccc" : "#2a2a3a";
                ctx.lineWidth = 0.5;
                for(let i=0; i<=5; i++){
                    let y = h * 0.12 + (h * 0.76 / 5) * i;
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y);
                    ctx.stroke();
                    let price = maxP - (i / 5) * (maxP - minP);
                    ctx.fillStyle = "#888";
                    ctx.font = "8px 'Segoe UI'";
                    ctx.fillText(price.toFixed(2), 5, y-2);
                }
                
                const candleWidth = w / candles.length;
                candles.forEach((c, i) => {
                    const x = i * candleWidth;
                    const isUp = c.close >= c.open;
                    const color = isUp ? '#00d68f' : '#ff4d6d';
                    
                    ctx.beginPath();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.2;
                    ctx.moveTo(x + candleWidth/2, getY(c.high));
                    ctx.lineTo(x + candleWidth/2, getY(c.low));
                    ctx.stroke();
                    
                    let openY = getY(c.open);
                    let closeY = getY(c.close);
                    let bodyY = Math.min(openY, closeY);
                    let bodyH = Math.abs(openY - closeY);
                    if(bodyH > 0.5){
                        ctx.fillStyle = color;
                        ctx.fillRect(x + candleWidth*0.2, bodyY, candleWidth*0.6, bodyH);
                    }
                });
                
                if(showSMA && smaData.length > 1){
                    ctx.beginPath();
                    ctx.strokeStyle = '#ffaa44';
                    ctx.lineWidth = 2;
                    smaData.forEach((pt, idx) => {
                        let x = (pt.index / candles.length) * w + candleWidth/2;
                        let y = getY(pt.value);
                        if(idx === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                }
            }
            
            function startCandleAnimation(){
                if(animationInterval) clearInterval(animationInterval);
                animationInterval = setInterval(() => {
                    if(candles.length === 0) return;
                    candles.shift();
                    let last = candles[candles.length-1];
                    let newOpen = last.close;
                    let newClose = newOpen + (Math.random() - 0.5) * 9;
                    let newCandle = {
                        open: newOpen, close: newClose,
                        high: Math.max(newOpen, newClose) + Math.random() * 4 + 1,
                        low: Math.min(newOpen, newClose) - Math.random() * 4 - 1,
                        progress: 0
                    };
                    candles.push(newCandle);
                    calculateSMA();
                    let progress = 0;
                    function animateNew(){
                        progress += 0.05;
                        newCandle.progress = Math.min(progress, 1);
                        drawChart();
                        if(progress < 1) requestAnimationFrame(animateNew);
                    }
                    animateNew();
                }, 2800);
            }
            
            function regenerateChartData(){
                generateCandles();
                drawChart();
            }
            
            function zoomIn(){
                if(candleCount > 6) candleCount -= 2;
                generateCandles();
                drawChart();
            }
            function zoomOut(){
                if(candleCount < 28) candleCount += 2;
                generateCandles();
                drawChart();
            }
            
            // Поиск пар с флагами
            function renderPairsDropdown(filter=""){
                const filtered = pairsList.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
                dropdownDiv.innerHTML = filtered.map(p => `<div class="pair-row" data-pair="${p.name}"><span class="pair-flag">${p.flag}</span> <strong>${p.name}</strong></div>`).join('');
                document.querySelectorAll('.pair-row').forEach(el => {
                    el.addEventListener('click',()=>{
                        currentPair = el.dataset.pair;
                        searchField.value = currentPair;
                        dropdownDiv.style.display = 'none';
                        regenerateChartData();
                    });
                });
            }
            
            searchField.addEventListener('input',(e)=>{ renderPairsDropdown(e.target.value); dropdownDiv.style.display='block'; });
            searchField.addEventListener('focus',()=>{ renderPairsDropdown(searchField.value); dropdownDiv.style.display='block'; });
            document.addEventListener('click',(e)=>{ if(!searchField.contains(e.target) && !dropdownDiv.contains(e.target)) dropdownDiv.style.display='none'; });
            renderPairsDropdown("");
            
            smaBtn.onclick = () => { showSMA = !showSMA; smaBtn.style.background = showSMA ? '#7c3aed' : 'rgba(0,0,0,0.6)'; drawChart(); };
            zoomInBtn.onclick = zoomIn;
            zoomOutBtn.onclick = zoomOut;
            
            themeBtn.onclick = () => { document.body.classList.toggle('light'); drawChart(); };
            
            snowBtn.onclick = () => {
                snowActive = !snowActive;
                if(snowActive && !snowCanvasRef){
                    snowCanvasRef = document.createElement('canvas');
                    snowCanvasRef.style.position='fixed'; snowCanvasRef.style.top='0'; snowCanvasRef.style.left='0';
                    snowCanvasRef.style.width='100%'; snowCanvasRef.style.height='100%'; snowCanvasRef.style.pointerEvents='none'; snowCanvasRef.style.zIndex='1000';
                    document.body.appendChild(snowCanvasRef);
                    let flakes=[];
                    function resizeAndInit(){
                        snowCanvasRef.width=window.innerWidth; snowCanvasRef.height=window.innerHeight;
                        flakes = Array(70).fill().map(()=>({x:Math.random()*snowCanvasRef.width, y:Math.random()*snowCanvasRef.height, r:Math.random()*3+1, speed:Math.random()*0.8+0.4}));
                    }
                    function drawSnowLoop(){
                        if(!snowActive || !snowCanvasRef) return;
                        const sCtx = snowCanvasRef.getContext('2d');
                        sCtx.clearRect(0,0,snowCanvasRef.width,snowCanvasRef.height);
                        sCtx.fillStyle='rgba(255,255,255,0.7)';
                        flakes.forEach(f=>{ sCtx.beginPath(); sCtx.arc(f.x,f.y,f.r,0,Math.PI*2); sCtx.fill(); f.y+=f.speed; if(f.y>snowCanvasRef.height){ f.y=0; f.x=Math.random()*snowCanvasRef.width; } });
                        requestAnimationFrame(drawSnowLoop);
                    }
                    resizeAndInit(); window.addEventListener('resize',resizeAndInit);
                    drawSnowLoop();
                } else if(!snowActive && snowCanvasRef){ snowCanvasRef.remove(); snowCanvasRef=null; }
            };
            
            tfBtns.forEach(btn=>{
                btn.addEventListener('click',()=>{
                    tfBtns.forEach(b=>b.classList.remove('active'));
                    btn.classList.add('active');
                    statusSpan.innerText = `⏱ ${btn.innerText}`;
                });
            });
            
            analyzeMainBtn.onclick = () => {
                if(cooldownActive) return;
                cooldownActive = true;
                analyzeMainBtn.style.opacity='0.6';
                statusSpan.innerText = translations[currentLanguage]?.statusReady === 'System ready' ? '🧠 AI Analyzing...' : '🧠 Анализ...';
                resultDiv.style.opacity='0';
                setTimeout(()=>{
                    const isBuy = Math.random() > 0.5;
                    const percent = Math.floor(Math.random()*30+70);
                    const signalText = isBuy ? `📈 ${translations[currentLanguage]?.buy || 'BUY'} ${percent}%` : `📉 ${translations[currentLanguage]?.sell || 'SELL'} ${percent}%`;
                    resultDiv.innerHTML = signalText;
                    resultDiv.style.background = isBuy ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)';
                    resultDiv.style.border = `1px solid ${isBuy ? '#10b981' : '#ef4444'}`;
                    resultDiv.style.opacity = '1';
                    statusSpan.innerText = translations[currentLanguage]?.statusReady || 'System ready';
                    cooldownActive = false;
                    analyzeMainBtn.style.opacity='1';
                }, 1500);
            };
            
            generateCandles();
            drawChart();
            startCandleAnimation();
            window.addEventListener('resize', () => drawChart());
        }
    })();
</script>
</body>
