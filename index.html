<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OptiBotX PRO | Premium Trading Terminal</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-color: #050510;
            --app-bg: #0b0b1a;
            --border-color: #1a1a2e;
            --text-color: white;
            --secondary-bg: #161625;
            --hover-color: #2a2a3f;
            --accent: #5b4dff;
            --accent-glow: rgba(91, 77, 255, 0.3);
            --glass-bg: rgba(20, 30, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); overflow: hidden; }

        /* Оверлеи для меню */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            transition: opacity 0.3s ease;
        }
        .hidden { display: none !important; }

        /* Окна модалок */
        .modal-box {
            background: var(--secondary-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 25px; width: 90%; max-width: 380px;
            text-align: center; box-shadow: 0 10px 30px var(--accent-glow);
        }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Кнопки выбора (язык, главное меню) */
        .select-item {
            background: var(--app-bg); border: 1px solid var(--border-color);
            padding: 15px; margin-bottom: 10px; border-radius: 12px;
            cursor: pointer; transition: 0.3s; font-size: 16px; font-weight: 500;
        }
        .select-item.selected, .select-item:hover {
            border-color: var(--accent); background: rgba(91, 77, 255, 0.1);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Главные кнопки (Старт, Проверить) */
        .btn-primary {
            background: var(--accent); color: white; width: 100%;
            padding: 15px; border: none; border-radius: 12px; margin-top: 15px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 20px var(--accent-glow); transition: 0.3s;
        }
        .btn-primary:active { transform: scale(0.97); }

        /* Инпуты (для ID) */
        .reg-input {
            width: 100%; padding: 15px; margin: 15px 0; background: var(--app-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
            color: white; font-size: 16px; text-align: center; outline: none;
        }
        .reg-input:focus { border-color: var(--accent); }
        .reg-desc { font-size: 13px; color: #aaa; margin-bottom: 10px; line-height: 1.4; }

        /* --- ИНТЕРФЕЙС ПРИЛОЖЕНИЯ --- */
        #mainApp {
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }
        
        /* Исправление под экраны телефонов */
        .chart-wrapper {
            flex: 0 0 40vh; /* График занимает только 40% высоты, чтобы кнопки влезли */
            width: 100%; background: #000; border-bottom: 2px solid var(--border-color);
        }
        .controls-wrapper {
            flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
        }

        /* Выбор пары и таймфрейма */
        .control-group { background: var(--secondary-bg); padding: 15px; border-radius: 15px; border: 1px solid var(--border-color); }
        .control-title { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; }
        select.pair-select {
            width: 100%; padding: 12px; background: var(--app-bg); color: white;
            border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; outline: none;
        }

        /* Сетка таймфреймов */
        .tf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .tf-btn {
            background: var(--app-bg); border: 1px solid var(--border-color);
            padding: 10px 5px; text-align: center; border-radius: 8px; font-size: 14px;
            cursor: pointer; transition: 0.2s;
        }
        .tf-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Кнопка Анализ (Большая) */
        .btn-analyze {
            background: linear-gradient(135deg, #5b4dff, #3a2ebf); color: white;
            width: 100%; padding: 20px; font-size: 20px; font-weight: bold;
            border: none; border-radius: 15px; margin-top: auto; cursor: pointer;
            box-shadow: 0 10px 30px var(--accent-glow); text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="welcomeOverlay" class="overlay">
        <div class="modal-box">
            <div class="modal-title">Выберите язык</div>
            <div class="select-item lang-item selected" data-lang="ru">🇷🇺 Русский</div>
            <div class="select-item lang-item" data-lang="en">🇬🇧 English</div>
            <button class="btn-primary" id="btnNextToMenu">Продолжить</button>
        </div>
    </div>

    <div id="mainMenuOverlay" class="overlay hidden">
        <div class="modal-box">
            <div class="modal-title">Главное меню</div>
            <div class="select-item menu-item">Отзывы приложения</div>
            <div class="select-item menu-item">Обучение</div>
            <div class="select-item menu-item selected">Начать работать</div>
            
            <button class="btn-primary" id="btnStartApp">Старт</button>
        </div>
    </div>

    <div id="regModal" class="overlay hidden">
        <div class="modal-box">
            <div class="modal-title">Уведомление</div>
            <p class="reg-desc">Для использования бота необходимо привязать свой аккаунт. Введите ваш Telegram ID ниже.</p>
            <input type="number" id="tgIdInput" class="reg-input" placeholder="ID ВАШЕГО АККАУНТА">
            <button class="btn-primary" id="btnCheckAccess">Проверить</button>
            <button class="btn-primary" id="btnCloseReg" style="background: transparent; border: 1px solid #5b4dff; margin-top: 10px;">Отмена</button>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        
        <div class="chart-wrapper" id="tv_chart_container">
            </div>

        <div class="controls-wrapper">
            
            <div class="control-group">
                <div class="control-title">Валютная пара</div>
                <select id="pairSelect" class="pair-select">
                    </select>
            </div>

            <div class="control-group">
                <div class="control-title">Время экспирации (Таймфрейм)</div>
                <div class="tf-grid" id="timeframeContainer">
                    </div>
            </div>

            <button class="btn-analyze" id="btnAnalyze">Анализ</button>
        </div>
    </div>

    <script>
        // === БАЗОВЫЕ НАСТРОЙКИ И ДАННЫЕ ===
        let curLang = 'ru';
        
        // Список всех валютных пар (Обычные + OTC)
        const allPairs = [
            "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CHF", "NZD/USD",
            "EUR/USD OTC", "GBP/USD OTC", "USD/JPY OTC", "AUD/USD OTC", "USD/CHF OTC"
        ];

        // Логика таймфреймов
        const tfsNormal = ['1m', '2m', '3m', '5m', '10m', '15m', '30m', '1h'];
        const tfsOTC = ['5s', '10s', '15s', '30s', '1m', '3m', '5m', '15m'];

        // === ЭЛЕМЕНТЫ DOM ===
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const mainMenuOverlay = document.getElementById('mainMenuOverlay');
        const regModal = document.getElementById('regModal');
        const mainApp = document.getElementById('mainApp');
        
        const btnNextToMenu = document.getElementById('btnNextToMenu');
        const btnStartApp = document.getElementById('btnStartApp');
        const btnAnalyze = document.getElementById('btnAnalyze');
        const btnCloseReg = document.getElementById('btnCloseReg');
        const pairSelect = document.getElementById('pairSelect');
        const timeframeContainer = document.getElementById('timeframeContainer');

        // === 1. ЛОГИКА ВЫБОРА ЯЗЫКА ===
        document.querySelectorAll('.lang-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.lang-item').forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');
                curLang = item.dataset.lang;
            });
        });

        btnNextToMenu.addEventListener('click', () => {
            welcomeOverlay.classList.add('hidden');
            mainMenuOverlay.classList.remove('hidden');
        });

        // === 2. ЛОГИКА ГЛАВНОГО МЕНЮ ===
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');
            });
        });

        btnStartApp.addEventListener('click', () => {
            mainMenuOverlay.classList.add('hidden');
            mainApp.classList.remove('hidden');
            
            // Инициализация интерфейса приложения
            initPairs();
            updateTimeframes(allPairs[0]); 
            initChart(); // Твоя функция TradingView
            if(typeof setupSnow === 'function') setupSnow(); // Если есть снег
        });

        // === 3. ЛОГИКА ПРИЛОЖЕНИЯ (ПАРЫ И ТАЙМФРЕЙМЫ) ===
        function initPairs() {
            pairSelect.innerHTML = '';
            allPairs.forEach(pair => {
                const opt = document.createElement('option');
                opt.value = pair;
                opt.text = pair;
                pairSelect.appendChild(opt);
            });
        }

        function updateTimeframes(selectedPair) {
            timeframeContainer.innerHTML = '';
            const isOTC = selectedPair.includes('OTC');
            const currentTfs = isOTC ? tfsOTC : tfsNormal;

            currentTfs.forEach((tf, index) => {
                const btn = document.createElement('div');
                btn.className = 'tf-btn';
                if (index === 0) btn.classList.add('active'); // Выделяем первый по умолчанию
                btn.innerText = tf;
                
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
                
                timeframeContainer.appendChild(btn);
            });
        }

        // Обновляем таймфреймы при смене валютной пары!
        pairSelect.addEventListener('change', (e) => {
            updateTimeframes(e.target.value);
            // Тут можно добавить логику смены пары на графике TradingView
        });

        // === 4. ЛОГИКА КНОПКИ АНАЛИЗ (Окно регистрации) ===
        btnAnalyze.addEventListener('click', () => {
            // Окно регистрации выскакивает ТОЛЬКО здесь
            regModal.classList.remove('hidden');
        });

        btnCloseReg.addEventListener('click', () => {
            regModal.classList.add('hidden');
        });

        // Заглушка для твоей функции графика, чтобы код не ломался, если её еще нет
        function initChart() {
            console.log("График запущен");
            // Сюда вставь свой new TradingView.widget({ ... });
        }

    </script>
</body>
</html>
