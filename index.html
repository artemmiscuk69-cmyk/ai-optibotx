<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OptiBotX PRO | Premium Trading Terminal</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-color: #050510;
            --app-bg: #0b0b1a;
            --border-color: #1a1a2e;
            --text-color: white;
            --secondary-bg: #161625;
            --hover-color: #2a2a3f;
            --accent: #5b4dff;
            --accent-glow: rgba(91, 77, 255, 0.3);
            --glass-bg: rgba(20, 30, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        body.light-theme {
            --bg-color: #f0f2f5;
            --app-bg: #ffffff;
            --border-color: #ddd;
            --text-color: #222;
            --secondary-bg: #f5f5f5;
            --hover-color: #e0e0e0;
            --accent: #3f51b5;
            --accent-glow: rgba(63, 81, 181, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', sans-serif; height: 100vh; 
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Оверлеи и меню (Твоя структура без изменений) */
        .welcome-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s; backdrop-filter: blur(10px); }
        .welcome-overlay.visible { opacity: 1; visibility: visible; }
        .welcome-glass { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 40px; padding: 30px 20px; width: 80%; max-width: 320px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.9); animation: glassAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes glassAppear { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .welcome-title { font-size: 2.2rem; font-weight: 800; margin: 0 0 10px; background: linear-gradient(135deg, #fff, #aaccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .language-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .language-item { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 30px; padding: 14px 20px; font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s; }
        .language-item.selected { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow); }
        .start-btn { background: var(--accent); border: none; color: white; font-size: 1.3rem; font-weight: 700; padding: 16px 30px; border-radius: 40px; cursor: pointer; width: 100%; opacity: 0; transform: translateY(20px); pointer-events: none; transition: 0.3s; }
        .start-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        /* Приложение */
        .app-container { width: 100%; max-width: 400px; height: 100vh; background: var(--app-bg); display: none; flex-direction: column; padding: 12px 15px; box-sizing: border-box; border: 1px solid var(--border-color); position: relative; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .logo h1 { font-size: 18px; margin: 0; color: var(--text-color); }
        .logo span { color: var(--accent); font-weight: 800; }
        .header-buttons { display: flex; gap: 6px; }
        .icon-btn { background: var(--secondary-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 10px; border-radius: 8px; cursor: pointer; }

        /* Поиск и пары */
        .selector-container { position: relative; margin-bottom: 8px; }
        #pair-search { width: 100%; background: var(--secondary-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px 10px 40px; font-size: 14px; outline: none; box-sizing: border-box; }
        .pairs-container { max-height: 200px; overflow-y: auto; background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 10px; display: none; position: absolute; width: 100%; z-index: 100; }
        .pair-option { padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 10px; }

        /* График */
        .chart-container { position: relative; width: 100%; height: 260px; margin-bottom: 10px; }
        .chart-box { width: 100%; height: 100%; background: #000; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        
        /* Кнопки ТФ */
        .tf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
        .tf-btn { background: var(--secondary-bg); border: 1px solid var(--border-color); color: #888; padding: 8px 0; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: 600; }
        .tf-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Кнопка анализа */
        .analyze-btn { width: 100%; background: var(--accent); border: none; padding: 16px; border-radius: 14px; color: white; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; position: relative; }
        .analyze-btn:active { transform: scale(0.98); }

        /* ОБНОВЛЕННЫЙ БЛОК РЕЗУЛЬТАТА */
        .result-display { 
            width: 100%; 
            height: 55px; /* Увеличили высоту */
            background: var(--secondary-bg); 
            border: 2px solid var(--border-color); 
            border-radius: 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800; 
            margin-top: 10px;
            opacity: 0; 
            visibility: hidden; 
            font-size: 20px; /* Увеличили шрифт */
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-display.visible { 
            opacity: 1; 
            visibility: visible; 
            animation: signalAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, pulseSignal 2s infinite 0.5s;
        }

        @keyframes signalAppear {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulseSignal {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
            50% { box-shadow: 0 0 20px var(--signal-color-shadow); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .status-area { display: flex; justify-content: center; align-items: center; gap: 8px; height: 30px; margin-top: 5px; }
        .dot { width: 8px; height: 8px; background: #5b4dff; border-radius: 50%; animation: pulseDot 1.2s infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }

        /* Модалка регистрации */
        .register-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 20000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .register-overlay.visible { opacity: 1; visibility: visible; }
        .register-glass { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 35px; padding: 25px; width: 85%; max-width: 340px; text-align: center; }
        .register-input { width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 15px; color: white; text-align: center; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        .register-btn { width: 100%; background: var(--accent); border: none; padding: 15px; border-radius: 15px; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div id="welcome-overlay" class="welcome-overlay visible">
    <div class="welcome-glass">
        <h1 class="welcome-title">OptiBotX</h1>
        <div class="language-list">
            <div class="language-item" data-lang="en">🇬🇧 English</div>
            <div class="language-item" data-lang="ru">🇷🇺 Русский</div>
            <div class="language-item" data-lang="es">🇪🇸 Español</div>
        </div>
        <button id="start-btn" class="start-btn">START</button>
    </div>
</div>

<div id="register-overlay" class="register-overlay">
    <div class="register-glass">
        <h3>🔐 Activation</h3>
        <input type="text" id="code-input" class="register-input" placeholder="Enter Code">
        <button id="activate-btn" class="register-btn">Activate</button>
        <p style="font-size: 12px; margin-top: 15px; opacity: 0.7;">Contact @ZentixTrade for key</p>
    </div>
</div>

<div class="app-container" id="main-app">
    <header>
        <div class="logo"><h1>OptiBotX <span>PRO</span></h1></div>
        <div class="header-buttons">
            <button id="themeBtn" class="icon-btn">🌓</button>
            <button id="langBtn" class="icon-btn">EN</button>
        </div>
    </header>

    <div class="selector-container">
        <input type="text" id="pair-search" placeholder="Search Pair...">
        <div class="pairs-container" id="pairs-container"></div>
    </div>
    
    <div class="tf-grid">
        <button class="tf-btn" onclick="selectTf(this)">1m</button>
        <button class="tf-btn active" onclick="selectTf(this)">2m</button>
        <button class="tf-btn" onclick="selectTf(this)">5m</button>
        <button class="tf-btn" onclick="selectTf(this)">15m</button>
    </div>

    <div class="chart-container">
        <div class="chart-box" id="tv_chart_container"></div>
    </div>
    
    <button id="anBtn" class="analyze-btn" onclick="startAnalysis(this)">ANALYZE</button>
    
    <div id="status" class="status-area" style="display: none;"><div class="dot"></div> <span id="wait-msg">Analyzing...</span></div>
    
    <div id="result" class="result-display"></div>
</div>

<script>
    const ONE_TIME_CODES = ["A8X2M9K", "B4P7Y3T", "C1R5H6L", "D9V2N4F", "E3W8Z7Q"]; // Твои коды
    let curLang = 'en';
    let isActivated = localStorage.getItem('optibotx_activated') === 'true';

    function initChart() {
        let pairName = document.getElementById('pair-search').value || "EURUSD";
        let tvSymbol = "FX:" + pairName.replace("/", "").replace(" OTC", "");
        new TradingView.widget({
            "autosize": true, "symbol": tvSymbol, "interval": "1", "theme": document.body.classList.contains('light-theme') ? "light" : "dark",
            "style": "1", "locale": curLang, "container_id": "tv_chart_container", "hide_top_toolbar": true, "hide_legend": true
        });
    }

    function startAnalysis(btn) {
        if(!isActivated) { document.getElementById('register-overlay').classList.add('visible'); return; }
        
        btn.disabled = true;
        btn.style.opacity = '0.5';
        const res = document.getElementById('result');
        const stat = document.getElementById('status');
        
        res.classList.remove('visible');
        stat.style.display = 'flex';

        setTimeout(() => {
            stat.style.display = 'none';
            const isUp = Math.random() > 0.5;
            const color = isUp ? '#00ff88' : '#ff4d4d';
            
            // Настройка анимации и цвета
            res.style.setProperty('--signal-color-shadow', color + '66');
            res.style.color = color;
            res.style.borderColor = color;
            
            // Текст BUY / SELL
            const signalText = isUp ? "BUY" : "SELL";
            const accuracy = Math.floor(Math.random() * 12 + 84);
            res.innerHTML = `${signalText} • ${accuracy}%`;
            
            res.classList.add('visible');
            btn.disabled = false;
            btn.style.opacity = '1';
        }, 2000);
    }

    // Логика кнопок ТФ
    function selectTf(btn) {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Логика кодов
    document.getElementById('activate-btn').onclick = () => {
        const val = document.getElementById('code-input').value;
        if(ONE_TIME_CODES.includes(val)) {
            isActivated = true;
            localStorage.setItem('optibotx_activated', 'true');
            document.getElementById('register-overlay').classList.remove('visible');
            initChart();
        } else {
            alert("Invalid Code");
        }
    };

    // Переключение темы
    document.getElementById('themeBtn').onclick = () => {
        document.body.classList.toggle('light-theme');
        initChart();
    };

    // Старт
    document.querySelectorAll('.language-item').forEach(item => {
        item.onclick = () => {
            document.querySelectorAll('.language-item').forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            curLang = item.dataset.lang;
            document.getElementById('start-btn').classList.add('visible');
        };
    });

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('welcome-overlay').classList.remove('visible');
        document.getElementById('main-app').style.display = 'flex';
        initChart();
    };
</script>

</body>
</html>
