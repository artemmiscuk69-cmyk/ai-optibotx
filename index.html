<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Copy AL | Pro Trading</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            background: #000; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #root { width: 100%; display: flex; justify-content: center; }
        ::-webkit-scrollbar { display: none; }
        
        /* Анимации */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes showBtn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .anim-fade { animation: fadeIn 0.4s ease-out forwards; }
        .anim-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .anim-pop { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

        .progress-bar { transition: width 1s linear; }

        .otc-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 123, 107, 0.9);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            z-index: 10;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .cursor-blink::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: white;
        }

        .delay-btn { opacity: 0; animation: showBtn 0.5s ease-out 3.5s forwards; }

        .chart-canvas {
            width: 100%;
            height: 200px;
            display: block;
            background: #121214;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ЛОКАЛИЗАЦИЯ ---
        const TRANSLATIONS = {
            ru: {
                welcomeTitle: "Добро пожаловать в будущее трейдинга.",
                welcomeSubtitle: "Искусственный интеллект проанализирует рынок за вас. Выбирайте актив, устанавливайте время экспирации и получайте точные сигналы.",
                btnStart: "Начать работу",
                selectLang: "Выберите язык",
                home: "ГЛАВНАЯ",
                chat: "AI ЧАТ",
                analysisComplete: "Анализ завершен. Приоритетный сигнал —",
                confidence: "Уверенность",
                marketStructure: "Структура рынка",
                confirmation: "Подтверждение",
                getNewSignal: "Новый сигнал",
                waitSignal: "Ожидание сигнала",
                analyzing: "Сканирование графика",
                until: "до",
                left: "осталось",
                // Для главной страницы
                dashboard: "Дашборд",
                balance: "Баланс счета",
                todayProfit: "Прибыль за сегодня",
                recentSignals: "Последние сигналы",
                marketNews: "Новости рынка",
                active: "Активен",
                win: "Профит",
                loss: "Убыток"
            },
            en: {
                welcomeTitle: "Welcome to the future of trading.",
                welcomeSubtitle: "AI will analyze the market for you. Choose an asset, set expiration time, and get accurate signals.",
                btnStart: "Get Started",
                selectLang: "Select Language",
                home: "HOME",
                chat: "AI CHAT",
                analysisComplete: "Analysis complete. Priority signal —",
                confidence: "Confidence",
                marketStructure: "Market structure",
                confirmation: "Confirmation",
                getNewSignal: "New signal",
                waitSignal: "Wait for the signal",
                analyzing: "Scanning chart",
                until: "until",
                left: "left",
                // Home Page
                dashboard: "Dashboard",
                balance: "Account Balance",
                todayProfit: "Today's Profit",
                recentSignals: "Recent Signals",
                marketNews: "Market News",
                active: "Active",
                win: "Win",
                loss: "Loss"
            }
        };

        // --- ИКОНКИ ---
        const Icon = ({ path, size = 20, stroke = 2, fill = "none" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{path}</svg>
        );
        const Icons = {
            Globe: () => <Icon path={<><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>} size={18} />,
            Chat: () => <Icon path={<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>} size={18} />,
            Home: () => <Icon path={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
            Send: () => <Icon path={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} />,
            Refresh: () => <Icon path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>} size={18} />,
            TrendUp: () => <Icon path={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} size={24} />,
            TrendDown: () => <Icon path={<><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></>} size={24} />,
            Lock: () => <Icon path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} size={14} />,
            Chevron: () => <Icon path={<polyline points="6 9 12 15 18 9"/>} size={14} />,
            Check: () => <Icon path={<polyline points="20 6 9 17 4 12"/>} size={14} />,
            Sparkles: () => <Icon path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></>} size={32} />,
            Wallet: () => <Icon path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} size={20} />,
            Activity: () => <Icon path={<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>} size={20} />
        };

        // --- ДАННЫЕ ---
        const AI_MODELS = [
            { id: 'claude', name: 'Claude Sonnet 5', hex: '#FF7B6B', icon: '✳️' },
            { id: 'gpt', name: 'GPT-5 mini', hex: '#10a37f', icon: '🤖' },
            { id: 'gemini', name: 'Gemini Pro', hex: '#4285F4', icon: '✨' }
        ];

        const FOREX_PAIRS = ['EUR/USD', 'GBP/USD', 'USD/JPY', 'AUD/USD', 'USD/CAD', 'USD/CHF', 'NZD/USD', 'EUR/GBP', 'EUR/JPY', 'GBP/JPY', 'AUD/JPY', 'EUR/AUD', 'EUR/CAD', 'GBP/AUD', 'USD/MXN', 'USD/ZAR', 'USD/TRY', 'USD/SEK', 'USD/NOK', 'USD/DKK'];
        const OTC_PAIRS = FOREX_PAIRS.map(p => `${p} OTC`);
        const CRYPTO_PAIRS = ['BTC/USD', 'ETH/USD', 'SOL/USD', 'XRP/USD'];
        const ALL_ASSETS = [...FOREX_PAIRS, ...CRYPTO_PAIRS, ...OTC_PAIRS];
        const TIMEFRAMES = ['5s', '15s', '30s', '1m', '5m'];

        const getSeconds = (tf) => tf.includes('m') ? parseInt(tf) * 60 : parseInt(tf);

        // --- КОМПОНЕНТЫ ---

        const Typewriter = ({ text, delay = 40 }) => {
            const [currentText, setCurrentText] = useState('');
            const [isDone, setIsDone] = useState(false);

            useEffect(() => {
                let i = 0;
                setCurrentText('');
                setIsDone(false);
                const timer = setInterval(() => {
                    setCurrentText(text.substring(0, i));
                    i++;
                    if (i > text.length) {
                        clearInterval(timer);
                        setIsDone(true);
                    }
                }, delay);
                return () => clearInterval(timer);
            }, [text, delay]);

            return <span className={!isDone ? 'cursor-blink' : ''}>{currentText}</span>;
        };

        const CanvasChart = ({ symbol, isOtc }) => {
            const canvasRef = useRef(null);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                const width = canvas.width = canvas.offsetWidth * 2; 
                const height = canvas.height = canvas.offsetHeight * 2;
                ctx.scale(2, 2);
                
                const w = width / 2;
                const h = height / 2;
                
                let seed = 0;
                for (let i = 0; i < symbol.length; i++) seed += symbol.charCodeAt(i);
                
                const random = () => {
                    const x = Math.sin(seed++) * 10000;
                    return x - Math.floor(x);
                };
                
                const candles = [];
                let price = 1.0 + random() * 0.5;
                const numCandles = 40;
                const candleWidth = w / numCandles - 2;
                
                for (let i = 0; i < numCandles; i++) {
                    const open = price;
                    const volatility = 0.01 + random() * 0.03;
                    const close = open + (random() - 0.5) * volatility * 2;
                    const high = Math.max(open, close) + random() * volatility;
                    const low = Math.min(open, close) - random() * volatility;
                    price = close;
                    candles.push({ open, close, high, low });
                }
                
                const allHighs = candles.map(c => c.high);
                const allLows = candles.map(c => c.low);
                const maxPrice = Math.max(...allHighs);
                const minPrice = Math.min(...allLows);
                const range = maxPrice - minPrice || 1;
                const padding = 20;
                
                const scaleY = (val) => h - padding - ((val - minPrice) / range) * (h - padding * 2);
                
                ctx.clearRect(0, 0, w, h);
                
                ctx.strokeStyle = '#27272a';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < 5; i++) {
                    const y = padding + (i / 4) * (h - padding * 2);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();
                }
                
                candles.forEach((c, i) => {
                    const x = i * (candleWidth + 2) + 2;
                    const yHigh = scaleY(c.high);
                    const yLow = scaleY(c.low);
                    const yOpen = scaleY(c.open);
                    const yClose = scaleY(c.close);
                    
                    const isGreen = c.close > c.open;
                    ctx.fillStyle = isGreen ? '#10a37f' : '#ef4444';
                    ctx.strokeStyle = isGreen ? '#10a37f' : '#ef4444';
                    
                    ctx.beginPath();
                    ctx.moveTo(x + candleWidth / 2, yHigh);
                    ctx.lineTo(x + candleWidth / 2, yLow);
                    ctx.stroke();
                    
                    const bodyHeight = Math.max(1, Math.abs(yClose - yOpen));
                    const bodyY = Math.min(yOpen, yClose);
                    ctx.fillRect(x, bodyY, candleWidth, bodyHeight);
                });
                
                const lastCandle = candles[candles.length - 1];
                const lastY = scaleY(lastCandle.close);
                ctx.strokeStyle = '#FF7B6B';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, lastY);
                ctx.lineTo(w, lastY);
                ctx.stroke();
                ctx.setLineDash([]);
                
            }, [symbol, isOtc]);

            return (
                <div className="relative w-full rounded-[20px] overflow-hidden border border-[#27272a] bg-[#121214] anim-slide-up" style={{ animationDelay: '0.1s' }}>
                    {isOtc && <div className="otc-badge">OTC</div>}
                    <canvas ref={canvasRef} className="chart-canvas" />
                </div>
            );
        };

        const CustomSelect = ({ value, options, onChange, icon, align = 'left', openUp = false }) => {
            const [isOpen, setIsOpen] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const handleClickOutside = (e) => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="relative flex-1" ref={ref}>
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className={`w-full flex items-center justify-between bg-[#121214] hover:bg-[#1c1c1f] border border-[#27272a] rounded-2xl py-2.5 px-3 text-xs font-medium text-gray-200 transition-all duration-200 ${isOpen ? 'ring-1 ring-[#27272a]' : ''}`}
                    >
                        <div className="flex items-center gap-1.5 truncate">
                            {icon && <span className="shrink-0">{icon}</span>}
                            <span className="truncate">{value}</span>
                        </div>
                        <div className={`text-gray-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}>
                            <Icons.Chevron />
                        </div>
                    </button>

                    {isOpen && (
                        <div className={`absolute z-[100] w-full bg-[#121214] border border-[#27272a] rounded-2xl shadow-2xl overflow-hidden anim-fade ${openUp ? 'bottom-full mb-2' : 'top-full mt-2'} ${align === 'right' ? 'right-0' : 'left-0'}`}>
                            <div className="max-h-48 overflow-y-auto custom-scroll p-1">
                                {options.map(opt => (
                                    <button
                                        key={opt}
                                        onClick={() => { onChange(opt); setIsOpen(false); }}
                                        className={`w-full text-left px-3 py-2 text-xs rounded-xl flex items-center justify-between hover:bg-[#1c1c1f] transition-colors ${value === opt ? 'text-white font-semibold bg-[#1c1c1f]' : 'text-gray-400'}`}
                                    >
                                        {opt}
                                        {value === opt && <span className="text-white"><Icons.Check /></span>}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- ОСНОВНОЕ ПРИЛОЖЕНИЕ ---
        function App() {
            const [appState, setAppState] = useState('language'); 
            const [lang, setLang] = useState('ru');
            const t = TRANSLATIONS[lang];

            // Навигация
            const [activeTab, setActiveTab] = useState('chat'); // 'home' или 'chat'
            
            // Состояния чата (генератора)
            const [chatScreen, setChatScreen] = useState('generator'); // 'generator' или 'result'
            const [aiModel, setAiModel] = useState(AI_MODELS[0]);
            const [asset, setAsset] = useState('EUR/USD OTC');
            const [market, setMarket] = useState('OTC');
            const [timeframe, setTimeframe] = useState('5s');
            
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analysisProgress, setAnalysisProgress] = useState(0);
            const [cooldown, setCooldown] = useState(0);
            const [signal, setSignal] = useState(null);
            const [timeLeft, setTimeLeft] = useState(0);
            const [maxTime, setMaxTime] = useState(5);

            const isOtcSelected = asset.includes('OTC');

            // Логика кулдауна
            useEffect(() => {
                let timer;
                if (cooldown > 0) {
                    timer = setInterval(() => setCooldown(prev => prev - 1), 1000);
                }
                return () => clearInterval(timer);
            }, [cooldown]);

            // Генерация сигнала
            const generateSignal = () => {
                if (isAnalyzing || cooldown > 0) return;
                
                setIsAnalyzing(true);
                setAnalysisProgress(0);
                
                const duration = 2800; 
                const intervalTime = 50;
                const steps = duration / intervalTime;
                let currentStep = 0;

                const progressInterval = setInterval(() => {
                    currentStep++;
                    setAnalysisProgress(Math.min((currentStep / steps) * 100, 100));
                    
                    if (currentStep >= steps) {
                        clearInterval(progressInterval);
                        setIsAnalyzing(false);
                        setCooldown(20); 
                        
                        const isBuy = Math.random() > 0.45;
                        const seconds = getSeconds(timeframe);
                        setSignal({
                            direction: isBuy ? 'BUY' : 'SELL',
                            confidence: Math.floor(Math.random() * 12) + 87,
                            structure: isBuy ? 'Higher lows forming, bullish momentum building.' : 'Lower highs capping the move, bearish pressure.',
                            confirmation: isBuy ? 'Buyers absorb the pullback at local support.' : 'Rejection from local resistance confirmed.'
                        });
                        
                        setMaxTime(seconds);
                        setTimeLeft(seconds);
                        setChatScreen('result');
                    }
                }, intervalTime);
            };

            // Таймер сигнала
            useEffect(() => {
                let timer;
                if (chatScreen === 'result' && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                }
                return () => clearInterval(timer);
            }, [chatScreen, timeLeft > 0]);

            const resetToGenerator = () => {
                setChatScreen('generator');
                setSignal(null);
                setTimeLeft(0);
            };

            useEffect(() => {
                setMarket(asset.includes('OTC') ? 'OTC' : 'Real');
            }, [asset]);

            return (
                <div className="w-full flex justify-center items-center p-4">
                    <div className="w-full max-w-[390px] h-[844px] bg-[#09090b] rounded-[48px] overflow-hidden relative shadow-[0_0_50px_rgba(255,255,255,0.05)] border-[6px] border-[#1a1a1a] flex flex-col">
                        
                        {/* ЭКРАН ВЫБОРА ЯЗЫКА */}
                        {appState === 'language' && (
                            <div className="absolute inset-0 bg-[#09090b] z-[200] flex flex-col items-center justify-center p-8 anim-fade">
                                <Icons.Sparkles />
                                <h1 className="text-white text-2xl font-bold mt-6 mb-12" style={{ fontFamily: "'Playfair Display', serif" }}>Copy AL</h1>
                                <p className="text-gray-400 text-sm mb-8">{t.selectLang}</p>
                                <div className="flex flex-col gap-4 w-full max-w-[200px]">
                                    <button onClick={() => { setLang('ru'); setAppState('welcome'); }} className="py-4 rounded-2xl bg-[#121214] border border-[#27272a] text-white font-medium hover:bg-[#1c1c1f] transition-all hover:scale-105 active:scale-95">🇷🇺 Русский</button>
                                    <button onClick={() => { setLang('en'); setAppState('welcome'); }} className="py-4 rounded-2xl bg-[#121214] border border-[#27272a] text-white font-medium hover:bg-[#1c1c1f] transition-all hover:scale-105 active:scale-95">🇬🇧 English</button>
                                </div>
                            </div>
                        )}

                        {/* ЭКРАН ПРИВЕТСТВИЯ */}
                        {appState === 'welcome' && (
                            <div className="absolute inset-0 bg-[#09090b] z-[200] flex flex-col justify-center p-8 anim-fade">
                                <div className="mb-8">
                                    <div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-8 bg-gradient-to-br from-[#FF7B6B] to-[#FF9D90] shadow-lg shadow-[#FF7B6B]/20">
                                        <Icons.Sparkles />
                                    </div>
                                    <h1 className="text-white text-3xl font-bold leading-tight mb-6" style={{ fontFamily: "'Playfair Display', serif" }}>
                                        <Typewriter text={t.welcomeTitle} delay={60} />
                                    </h1>
                                    <p className="text-gray-400 text-sm leading-relaxed">
                                        <Typewriter text={t.welcomeSubtitle} delay={25} />
                                    </p>
                                </div>
                                
                                <div className="mt-auto">
                                    <button onClick={() => setAppState('main')} className="delay-btn w-full py-4 rounded-2xl bg-white text-black font-bold text-sm hover:bg-gray-200 transition-all active:scale-[0.98] shadow-lg shadow-white/10">
                                        {t.btnStart}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ОСНОВНОЙ ИНТЕРФЕЙС */}
                        {appState === 'main' && (
                            <div className="flex flex-col h-full anim-fade">
                                {/* ХЕДЕР */}
                                <div className="flex justify-between items-center px-6 pt-6 pb-2 z-30 shrink-0">
                                    <div className="flex items-center gap-1.5">
                                        <span className="font-bold text-xl tracking-tight text-white">Copy AL</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button className="p-2 bg-[#121214] rounded-full text-gray-300 hover:text-white transition-colors"><Icons.Globe /></button>
                                        <button className="p-2 bg-[#121214] rounded-full text-gray-300 hover:text-white transition-colors"><Icons.Chat /></button>
                                    </div>
                                </div>

                                {/* КОНТЕНТ ВКЛАДОК */}
                                <div className="flex-1 overflow-y-auto px-5 py-2 pb-24 relative z-10 custom-scroll">
                                    
                                    {/* --- ВКЛАДКА ГЛАВНАЯ --- */}
                                    {activeTab === 'home' && (
                                        <div className="flex flex-col gap-5 anim-fade">
                                            <div className="flex items-center gap-2 text-gray-400 text-sm mb-2 mt-2">
                                                <Icons.Activity /> {t.dashboard}
                                            </div>

                                            {/* Карточка баланса */}
                                            <div className="w-full bg-gradient-to-br from-[#1c1c1f] to-[#121214] border border-[#27272a] rounded-[28px] p-6 anim-slide-up relative overflow-hidden">
                                                <div className="absolute top-0 right-0 w-32 h-32 bg-[#10a37f]/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                                                <div className="flex items-center gap-2 text-gray-400 text-xs mb-2 font-medium">
                                                    <Icons.Wallet /> {t.balance}
                                                </div>
                                                <div className="text-4xl font-bold text-white mb-4 tracking-tight">$ 12,450.00</div>
                                                <div className="flex gap-3">
                                                    <div className="bg-[#10a37f]/10 border border-[#10a37f]/20 rounded-xl px-3 py-1.5 flex items-center gap-1.5 text-[#10a37f] text-xs font-semibold">
                                                        <Icons.TrendUp /> +$ 340.50 (2.8%)
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Последние сигналы */}
                                            <div className="anim-slide-up" style={{animationDelay: '0.1s'}}>
                                                <div className="text-sm font-semibold text-white mb-3 flex justify-between items-center">
                                                    {t.recentSignals}
                                                    <span className="text-[10px] text-gray-500 font-normal border border-[#27272a] px-2 py-0.5 rounded-full">All time</span>
                                                </div>
                                                <div className="space-y-2">
                                                    {/* Заглушка 1 */}
                                                    <div className="bg-[#121214] border border-[#27272a] p-3 rounded-2xl flex justify-between items-center">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-8 h-8 rounded-full bg-[#10a37f]/10 flex items-center justify-center text-[#10a37f]"><Icons.TrendUp size={16}/></div>
                                                            <div>
                                                                <div className="text-white text-sm font-bold">GBP/USD</div>
                                                                <div className="text-[10px] text-gray-500">BUY · 15s</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-[#10a37f] font-bold text-sm">+$ 120.00</div>
                                                    </div>
                                                    {/* Заглушка 2 */}
                                                    <div className="bg-[#121214] border border-[#27272a] p-3 rounded-2xl flex justify-between items-center">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-8 h-8 rounded-full bg-red-500/10 flex items-center justify-center text-red-400"><Icons.TrendDown size={16}/></div>
                                                            <div>
                                                                <div className="text-white text-sm font-bold">BTC/USD</div>
                                                                <div className="text-[10px] text-gray-500">SELL · 1m</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-[#10a37f] font-bold text-sm">+$ 450.00</div>
                                                    </div>
                                                    {/* Заглушка 3 */}
                                                    <div className="bg-[#121214] border border-[#27272a] p-3 rounded-2xl flex justify-between items-center">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-8 h-8 rounded-full bg-red-500/10 flex items-center justify-center text-red-400"><Icons.TrendDown size={16}/></div>
                                                            <div>
                                                                <div className="text-white text-sm font-bold">EUR/JPY OTC</div>
                                                                <div className="text-[10px] text-gray-500">SELL · 5s</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-red-400 font-bold text-sm">-$ 45.00</div>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <button onClick={() => setActiveTab('chat')} className="w-full py-4 bg-white text-black rounded-2xl font-bold text-sm mt-2 flex items-center justify-center gap-2 hover:bg-gray-200 transition-all active:scale-[0.98] anim-slide-up" style={{animationDelay: '0.2s'}}>
                                                <Icons.Sparkles size={16} /> Перейти к AI сигналам
                                            </button>
                                        </div>
                                    )}

                                    {/* --- ВКЛАДКА AI ЧАТ --- */}
                                    {activeTab === 'chat' && (
                                        <>
                                            {chatScreen === 'generator' && (
                                                <div className="flex flex-col gap-4 anim-fade">
                                                    <CanvasChart symbol={asset} isOtc={isOtcSelected} />

                                                    <div className="flex flex-col items-center text-center gap-2 anim-slide-up" style={{ animationDelay: '0.2s' }}>
                                                        <div className="w-[72px] h-[72px] rounded-[22px] flex items-center justify-center text-3xl border transition-colors duration-500 shadow-lg" style={{ backgroundColor: `${aiModel.hex}15`, borderColor: `${aiModel.hex}40` }}>
                                                            {aiModel.icon}
                                                        </div>
                                                        <div>
                                                            <h1 className="text-[22px] mb-1 text-white tracking-wide" style={{ fontFamily: "'Playfair Display', serif" }}>{aiModel.name}</h1>
                                                            <p className="text-[11px] text-gray-400 max-w-[260px] leading-relaxed mx-auto">
                                                                Set the instrument, market and expiration — then tap send to get a signal.
                                                            </p>
                                                        </div>
                                                    </div>

                                                    <div className="w-full flex flex-col gap-3 anim-slide-up" style={{ animationDelay: '0.3s' }}>
                                                        <div className="flex gap-2">
                                                            <CustomSelect value={asset} options={ALL_ASSETS} onChange={setAsset} icon={<span className="text-base">🇪🇺</span>} openUp={false} />
                                                            <div className="w-[85px]"><CustomSelect value={market} options={['OTC', 'Real']} onChange={setMarket} openUp={false} /></div>
                                                            <div className="w-[70px]"><CustomSelect value={timeframe} options={TIMEFRAMES} onChange={setTimeframe} align="right" openUp={false} /></div>
                                                        </div>

                                                        <div className="bg-[#121214] border border-[#27272a] rounded-[24px] p-4 text-[13px] text-gray-300 relative min-h-[90px] shadow-inner group focus-within:ring-1 focus-within:ring-white/10 transition-all">
                                                            <span className="opacity-90">{asset} {market}, expiration time {timeframe} — analyze the chart.</span>
                                                            
                                                            <button 
                                                                onClick={generateSignal} 
                                                                disabled={isAnalyzing || cooldown > 0} 
                                                                className={`absolute bottom-3 right-3 w-11 h-11 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg ${
                                                                    cooldown > 0 ? 'bg-[#27272a] text-gray-500 cursor-not-allowed' : 
                                                                    isAnalyzing ? 'cursor-not-allowed opacity-50' : 
                                                                    'hover:scale-105 active:scale-95 cursor-pointer'
                                                                }`} 
                                                                style={{ 
                                                                    backgroundColor: cooldown > 0 ? '' : `${aiModel.hex}20`, 
                                                                    color: cooldown > 0 ? '' : aiModel.hex 
                                                                }}
                                                            >
                                                                {isAnalyzing ? (
                                                                    <div className="w-5 h-5 border-2 border-current border-t-transparent rounded-full animate-spin" />
                                                                ) : cooldown > 0 ? (
                                                                    <span className="text-[11px] font-bold">{cooldown}s</span>
                                                                ) : (
                                                                    <Icons.Send />
                                                                )}
                                                            </button>
                                                        </div>

                                                        <div className="w-full">
                                                            <CustomSelect 
                                                                value={aiModel.name} 
                                                                options={AI_MODELS.map(m => m.name)} 
                                                                onChange={(val) => setAiModel(AI_MODELS.find(m => m.name === val))} 
                                                                icon={<div className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] text-black font-bold" style={{ backgroundColor: aiModel.hex }}>{aiModel.name[0]}</div>} 
                                                                openUp={true} 
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {chatScreen === 'result' && signal && (
                                                <div className="flex flex-col h-full anim-fade">
                                                    <div className="flex items-center gap-2 mb-4 text-[13px] text-gray-300 anim-slide-down">
                                                        <div className="w-2 h-2 bg-emerald-500 rounded-full animate-[pulseGlow_2s_infinite]" />
                                                        {t.analysisComplete} {signal.direction}.
                                                    </div>

                                                    <div className={`w-full rounded-[28px] p-5 border-2 relative overflow-hidden anim-pop ${signal.direction === 'SELL' ? 'border-red-500/30 bg-gradient-to-b from-red-500/10 to-[#09090b]' : 'border-emerald-500/30 bg-gradient-to-b from-emerald-500/10 to-[#09090b]'}`}>
                                                        <div className="flex justify-between items-center mb-5">
                                                            <div className={`text-[22px] font-bold flex items-center gap-2 ${signal.direction === 'SELL' ? 'text-red-400' : 'text-emerald-400'}`}>
                                                                {signal.direction === 'SELL' ? <Icons.TrendDown /> : <Icons.TrendUp />} {signal.direction}
                                                            </div>
                                                            <div className="flex flex-col items-end">
                                                                <div className="flex items-center gap-1.5">
                                                                    <span className="text-[11px] text-gray-400 uppercase tracking-wider font-semibold">{t.confidence}</span>
                                                                    <div className={`text-xl font-bold ${signal.direction === 'SELL' ? 'text-red-400' : 'text-emerald-400'}`}>{signal.confidence}%</div>
                                                                </div>
                                                                <div className="w-24 h-1.5 bg-black/40 rounded-full mt-1.5 overflow-hidden">
                                                                    <div className={`h-full ${signal.direction === 'SELL' ? 'bg-red-400' : 'bg-emerald-400'}`} style={{width: `${signal.confidence}%`}}></div>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div className="flex gap-2 mb-5">
                                                            <span className="bg-black/30 px-3 py-1.5 rounded-xl text-[11px] font-medium flex items-center gap-1.5 border border-white/5"><span className="text-sm">🇪🇺</span> {asset}</span>
                                                            <span className="bg-black/30 px-3 py-1.5 rounded-xl text-[11px] font-medium border border-white/5">{timeframe}</span>
                                                        </div>

                                                        <div className="space-y-2.5 mb-6">
                                                            <div className="bg-black/20 p-3.5 rounded-2xl border border-white/5 backdrop-blur-sm">
                                                                <p className="text-[10px] text-gray-400 uppercase tracking-wider mb-1 font-semibold">{t.marketStructure}</p>
                                                                <p className="text-[13px] text-gray-200 leading-snug">{signal.structure}</p>
                                                            </div>
                                                            <div className="bg-black/20 p-3.5 rounded-2xl border border-white/5 backdrop-blur-sm">
                                                                <p className="text-[10px] text-gray-400 uppercase tracking-wider mb-1 font-semibold">{t.confirmation}</p>
                                                                <p className="text-[13px] text-gray-200 leading-snug">{signal.confirmation}</p>
                                                            </div>
                                                        </div>

                                                        <div className="w-full bg-black/50 rounded-full h-1 mb-2 overflow-hidden">
                                                            <div className={`h-full ${signal.direction === 'SELL' ? 'bg-red-500' : 'bg-emerald-500'} progress-bar`} style={{ width: `${(timeLeft / maxTime) * 100}%` }} />
                                                        </div>
                                                        <div className="flex justify-between text-[11px] text-gray-500 font-medium mb-5">
                                                            <span>{t.until} 13:15</span>
                                                            <span>{timeLeft}s {t.left}</span>
                                                        </div>

                                                        <button onClick={resetToGenerator} className="w-full py-3.5 rounded-2xl border border-white/10 text-[13px] font-semibold text-gray-200 hover:bg-white/5 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group cursor-pointer">
                                                            <span className="group-hover:rotate-180 transition-transform duration-500"><Icons.Refresh /></span> {t.getNewSignal}
                                                        </button>
                                                    </div>

                                                    <div className="mt-5 flex items-center gap-2 text-[11px] text-gray-500 font-medium">
                                                        <div className="w-4 h-4 rounded-full flex items-center justify-center text-[8px] text-black font-bold" style={{ backgroundColor: aiModel.hex }}>{aiModel.name[0]}</div> 
                                                        {aiModel.name}
                                                    </div>

                                                    <div className="mt-auto pt-4 anim-slide-up" style={{ animationDelay: '0.3s' }}>
                                                        <div className="bg-[#121214] border border-[#27272a] rounded-2xl p-4 flex justify-between items-center text-[12px] text-gray-400">
                                                            {t.waitSignal} · 00:{timeLeft < 10 ? `0${timeLeft}` : timeLeft}
                                                            <span className="opacity-50"><Icons.Lock /></span>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>

                                {/* НИЖНЕЕ МЕНЮ */}
                                <div className="absolute bottom-0 w-full bg-[#09090b]/90 backdrop-blur-xl border-t border-[#27272a] px-6 py-4 flex justify-around items-center z-40 rounded-b-[42px]">
                                    <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1.5 transition-all duration-300 cursor-pointer ${activeTab === 'home' ? 'text-white' : 'text-gray-500 hover:text-gray-300'}`}>
                                        <Icons.Home />
                                        <span className="text-[10px] font-bold tracking-widest">{t.home}</span>
                                    </button>
                                    <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center gap-1.5 transition-all duration-300 cursor-pointer ${activeTab === 'chat' ? 'text-white' : 'text-gray-500 hover:text-gray-300'}`}>
                                        <Icons.Chat />
                                        <span className="text-[10px] font-bold tracking-widest">{t.chat}</span>
                                    </button>
                                </div>

                                {/* ЛОАДЕР (Поверх всего) */}
                                {isAnalyzing && (
                                    <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-[150] flex flex-col items-center justify-center anim-fade">
                                        <div className="relative w-20 h-20 mb-6">
                                            <div className="absolute inset-0 border-2 border-white/10 rounded-full"></div>
                                            <div className="absolute inset-0 border-2 border-transparent rounded-full animate-spin" style={{ borderTopColor: aiModel.hex, borderRightColor: aiModel.hex }}></div>
                                            <div className="absolute inset-0 flex items-center justify-center text-3xl animate-pulse">{aiModel.icon}</div>
                                        </div>
                                        
                                        <div className="w-48 h-1.5 bg-[#27272a] rounded-full mt-4 overflow-hidden">
                                            <div className="h-full transition-all duration-75 ease-linear" style={{ width: `${analysisProgress}%`, backgroundColor: aiModel.hex }}></div>
                                        </div>
                                        <p className="text-xs font-medium text-gray-400 tracking-wide mt-3">
                                            {t.analyzing} {asset}... {Math.round(analysisProgress)}%
                                        </p>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
