<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Wallet Mockup</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .wallet-container {
            width: 375px; /* Typical mobile width */
            height: 812px; /* Typical mobile height */
            background-color: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #282828;
        }
        .header .settings-icon {
            font-size: 24px;
            cursor: pointer;
        }
        .header .search-bar {
            flex-grow: 1;
            margin: 0 15px;
            background-color: #333;
            border-radius: 25px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
        }
        .header .search-bar input {
            background: none;
            border: none;
            color: #e0e0e0;
            outline: none;
            margin-left: 5px;
            font-size: 14px;
        }
        .header .wallet-icon {
            font-size: 20px;
            cursor: pointer;
        }
        .main-balance {
            text-align: center;
            padding: 30px 0;
            background-color: #1e1e1e;
        }
        .main-balance .amount {
            font-size: 48px;
            font-weight: bold;
        }
        .main-balance .details {
            font-size: 14px;
            color: #aaa;
        }
        .actions {
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
            background-color: #282828;
        }
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }
        .action-item:hover {
            background-color: #333;
        }
        .action-item i {
            font-size: 24px;
            margin-bottom: 8px;
            color: #00c853; /* Green accent */
        }
        .action-item span {
            font-size: 12px;
            color: #ccc;
        }
        .crypto-list-header {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: #282828;
            border-bottom: 1px solid #333;
        }
        .crypto-list-header span {
            font-weight: bold;
            font-size: 16px;
        }
        .crypto-list-header .tabs {
            display: flex;
            gap: 15px;
        }
        .crypto-list-header .tab {
            cursor: pointer;
            padding: 5px 10px;
            border-bottom: 2px solid transparent;
            transition: border-bottom-color 0.2s ease;
        }
        .crypto-list-header .tab.active {
            border-bottom-color: #00c853; /* Green accent */
        }
        .crypto-list {
            flex-grow: 1;
            overflow-y: auto;
        }
        .crypto-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .crypto-item:hover {
            background-color: #282828


;
        }
        .crypto-item .icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }
        .crypto-item.sol .icon { background-color: #f7931a; color: #000; } /* Example colors */
        .crypto-item.eth .icon { background-color: #627eea; color: #fff; }
        .crypto-item.btc .icon { background-color: #f7931a; color: #fff; }
        .crypto-item.bnb .icon { background-color: #f0b90b; color: #000; }

        .crypto-item .details {
            flex-grow: 1;
        }
        .crypto-item .name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 3px;
        }
        .crypto-item .balance {
            font-size: 12px;
            color: #aaa;
        }
        .crypto-item .price {
            text-align: right;
        }
        .crypto-item .current-price {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 3px;
        }
        .crypto-item .change {
            font-size: 12px;
            text-align: right;
        }
        .crypto-item .change.positive {
            color: #00c853; /* Green */
        }
        .crypto-item .change.negative {
            color: #ff1744; /* Red */
        }
        .view-tokens {
            text-align: center;
            padding: 15px 0;
            background-color: #1e1e1e;
            cursor: pointer;
            color: #00c853; /* Green accent */
            font-size: 14px;
            transition: background-color 0.2s ease;
        }
        .view-tokens:hover {
            background-color: #282828;
        }
        .footer-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px 0;
            background-color: #282828;
            border-top: 1px solid #333;
            margin-top: auto; /* Pushes footer to the bottom */
        }
        .footer-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #aaa;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        .footer-nav .nav-item.active {
            background-color: #00c853;
            color: #fff;
        }
        .footer-nav .nav-item i {
            font-size: 22px;
            margin-bottom: 5px;
        }
    </style>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="wallet-container">
        <div class="header">
            <i class="fas fa-cog settings-icon"></i>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Поиск">
            </div>
            <i class="fas fa-wallet wallet-icon"></i>
        </div>

        <div class="main-balance">
            <div class="amount">0,00 $</div>
            <div class="details">0,00 $ (0.00%)</div>
        </div>

        <div class="actions">
            <div class="action-item">
                <i class="fas fa-arrow-up-right-from-square"></i>
                <span>Отпр...</span>
            </div>
            <div class="action-item">
                <i class="fas fa-arrow-down"></i>
                <span>Полу...</span>
            </div>
            <div class="action-item">
                <i class="fas fa-exchange-alt"></i>
                <span>Обмен</span>
            </div>
            <div class="action-item">
                <i class="fas fa-plus"></i>
                <span>Поку...</span>
            </div>
        </div>

        <div class="crypto-list-header">


<span class="crypto-label">Криптовалюта</span>
            <div class="tabs">
                <span class="tab active">Избранное</span>
                <span class="tab">NFT</span>
                <span class="tab"><i class="fas fa-clock"></i></span>
                <span class="tab"><i class="fas fa-filter"></i></span>
            </div>
        </div>

        <div class="crypto-list">
            <div class="crypto-item sol">
                <div class="icon">SOL</div>
                <div class="details">
                    <div class="name">SOL</div>
                    <div class="balance">2,74 $B</div>
                </div>
                <div class="price">
                    <div class="current-price">86,45 $</div>
                    <div class="change negative">-0.12%</div>
                </div>
            </div>
            <div class="crypto-item eth">
                <div class="icon">ETH</div>
                <div class="details">
                    <div class="name">ETH</div>
                    <div class="balance">7,92 $B</div>
                </div>
                <div class="price">
                    <div class="current-price">2 346,91 $</div>
                    <div class="change positive">+1.29%</div>
                </div>
            </div>
            <div class="crypto-item btc">
                <div class="icon">BTC</div>
                <div class="details">
                    <div class="name">BTC</div>
                    <div class="balance">17,24 $B</div>
                </div>
                <div class="price">
                    <div class="current-price">78 101,78 $</div>
                    <div class="change positive">+0.55%</div>
                </div>
            </div>
            <div class="crypto-item bnb">
                <div class="icon">BNB</div>
                <div class="details">
                    <div class="name">BNB</div>
                    <div class="balance">753,22 $M</div>
                </div>
                <div class="price">
                    <div class="current-price">631,99 $</div>
                    <div class="change positive">+0.23%</div>
                </div>
            </div>
        </div>

        <div class="view-tokens">
            Просмотреть токены
        </div>

        <div class="footer-nav">
            <div class="nav-item active">
                <i class="fas fa-home"></i>
                <span>Главная</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Популярные</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-exchange-alt"></i>
                <span>Торговать</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-gift"></i>
                <span>Награды</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-ellipsis-h"></i>
                <span>Подробнее</span>
            </div>
        </div>
    </div>

    <script>
        // Basic JavaScript for interactivity (e.g., tab switching)
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                // In a real app, you would update the crypto list based on the selected tab
            });
        });

        document.querySelectorAll('.footer-nav .nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.footer-nav .nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                // In a real app, you would navigate to different sections
            });
        });
    </script>
</body>
</html>
