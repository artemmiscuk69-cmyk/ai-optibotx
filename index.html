<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OptiBotX PRO | Premium Trading Terminal</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-color: #050510;
            --app-bg: #0b0b1a;
            --border-color: #1a1a2e;
            --text-color: white;
            --secondary-bg: #161625;
            --hover-color: #2a2a3f;
            --accent: #5b4dff;
            --accent-glow: rgba(91, 77, 255, 0.3);
            --glass-bg: rgba(20, 30, 50, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --buy-color: #00ff88;
            --sell-color: #ff3366;
        }

        body.light-theme {
            --bg-color: #f0f2f5;
            --app-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
            --secondary-bg: #f8fafc;
            --hover-color: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- Welcome Screen --- */
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .welcome-content {
            text-align: center; max-width: 90%; width: 400px;
        }
        .logo-container {
            width: 120px; height: 120px; margin: 0 auto 30px;
            background: linear-gradient(135deg, var(--accent), #ff3366);
            border-radius: 30px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px var(--accent-glow);
            animation: float 3s ease-in-out infinite;
        }
        .logo-container i { font-size: 60px; color: white; }
        .welcome-title { font-size: 32px; font-weight: 800; margin-bottom: 10px; background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .language-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 40px; }
        .language-item {
            background: var(--secondary-bg); border: 2px solid var(--border-color); padding: 15px;
            border-radius: 15px; cursor: pointer; transition: all 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .language-item.selected { border-color: var(--accent); background: var(--accent-glow); transform: translateY(-3px); }
        .language-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .language-item span { font-weight: 600; font-size: 14px; }
        .start-btn {
            margin-top: 30px; width: 100%; padding: 18px; border: none;
            background: var(--accent); color: white; border-radius: 15px;
            font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 20px var(--accent-glow); transition: all 0.3s;
            opacity: 0; pointer-events: none; transform: translateY(20px);
        }
        .start-btn.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
        .start-btn:active { transform: scale(0.95); }

        /* --- Main App Layout --- */
        .app-container {
            display: none; /* flex set via JS */
            flex-direction: column; height: 100vh; background: var(--app-bg);
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color); z-index: 100;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #ff3366); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: white; }
        .user-details { display: flex; flex-direction: column; }
        .user-name { font-weight: 700; font-size: 16px; }
        .user-id { font-size: 12px; color: #888; }
        .controls { display: flex; gap: 15px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 12px; border: none;
            background: var(--bg-color); color: var(--text-color);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; border: 1px solid var(--border-color);
        }
        .icon-btn:hover { background: var(--hover-color); }

        /* Chart Area */
        #tv_chart_container { flex: 1; width: 100%; min-height: 40vh; }

        /* --- Beautiful Analysis Widget --- */
        .analysis-widget {
            display: none; /* Shown via JS */
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            padding: 25px 20px;
            text-align: center;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
            z-index: 50;
            position: relative;
        }
        .analysis-widget.active { display: block; }
        
        .aw-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
        }
        .aw-pair-info { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
        .aw-pair-info i { color: var(--accent); }
        .aw-timeframe { background: var(--secondary-bg); padding: 5px 12px; border-radius: 8px; font-size: 14px; color: #aaa;}

        .aw-result-container {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            margin: 20px 0;
        }
        .aw-label { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #888; }
        
        /* The magical BUY / SELL Text */
        .aw-signal {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 5px 0;
        }
        .signal-buy {
            color: var(--buy-color);
            animation: pulse-buy 2s infinite;
        }
        .signal-sell {
            color: var(--sell-color);
            animation: pulse-sell 2s infinite;
        }

        .aw-confidence {
            font-size: 16px; color: #bbb;
        }
        .aw-confidence span { font-weight: 700; color: white; }

        /* Action Buttons */
        .aw-actions {
            display: flex; gap: 15px; margin-top: 20px;
        }
        .aw-btn {
            flex: 1; padding: 15px; border: none; border-radius: 12px;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            color: white;
        }
        .btn-win { background: rgba(0, 255, 136, 0.2); border: 1px solid var(--buy-color); color: var(--buy-color); }
        .btn-loss { background: rgba(255, 51, 102, 0.2); border: 1px solid var(--sell-color); color: var(--sell-color); }
        .btn-close { background: var(--secondary-bg); border: 1px solid var(--border-color); color: var(--text-color); }
        
        .aw-btn:active { transform: scale(0.95); }

        /* Bottom Menu (Main Controls) */
        .bottom-menu {
            padding: 15px 20px 25px; background: var(--secondary-bg);
            border-top: 1px solid var(--border-color); z-index: 40;
        }
        .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .selector {
            background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; position: relative;
        }
        .selector-label { font-size: 12px; color: #888; }
        .selector-value { font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .main-btn {
            width: 100%; padding: 18px; border: none; border-radius: 15px;
            background: linear-gradient(135deg, var(--accent), #ff3366); color: white;
            font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 25px var(--accent-glow); transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .main-btn:active { transform: scale(0.98); }

        /* Pair Dropdown */
        .pairs-dropdown {
            position: absolute; bottom: 100%; left: 0; width: 100%; background: var(--secondary-bg);
            border: 1px solid var(--border-color); border-radius: 12px; max-height: 250px;
            overflow-y: auto; display: none; z-index: 200; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        .search-box { padding: 10px; position: sticky; top: 0; background: var(--secondary-bg); border-bottom: 1px solid var(--border-color); }
        .search-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); outline: none; }
        .pair-item { padding: 12px 15px; display: flex; justify-content: space-between; cursor: pointer; border-bottom: 1px solid var(--border-color); transition: 0.2s; }
        .pair-item:hover { background: var(--hover-color); }

        /* Timeframe Dropdown */
        .time-dropdown {
            position: absolute; bottom: 100%; left: 0; width: 100%; background: var(--secondary-bg);
            border: 1px solid var(--border-color); border-radius: 12px; display: none; z-index: 200;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5); margin-bottom: 10px;
        }
        .time-item { padding: 12px 15px; text-align: center; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .time-item:hover { background: var(--hover-color); }

        /* Analyzing Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--secondary-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 30px; width: 90%; max-width: 350px; text-align: center;
        }
        .loader-ring { width: 80px; height: 80px; border: 4px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        .progress-bar { width: 100%; height: 8px; background: var(--bg-color); border-radius: 4px; margin-top: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-buy { 
            0% { text-shadow: 0 0 10px rgba(0,255,136,0.4); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(0,255,136,0.8), 0 0 60px rgba(0,255,136,0.4); transform: scale(1.05); }
            100% { text-shadow: 0 0 10px rgba(0,255,136,0.4); transform: scale(1); }
        }
        @keyframes pulse-sell { 
            0% { text-shadow: 0 0 10px rgba(255,51,102,0.4); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(255,51,102,0.8), 0 0 60px rgba(255,51,102,0.4); transform: scale(1.05); }
            100% { text-shadow: 0 0 10px rgba(255,51,102,0.4); transform: scale(1); }
        }

        /* Responsive Design */
        @media (min-width: 768px) {
            .app-container { flex-direction: row; }
            #tv_chart_container { height: 100vh; }
            .right-panel { 
                width: 400px; 
                display: flex; 
                flex-direction: column; 
                border-left: 1px solid var(--border-color);
                background: var(--app-bg);
            }
            .bottom-menu { border-top: none; border-bottom: 1px solid var(--border-color); }
            .analysis-widget { 
                flex: 1; 
                border-radius: 0;
                border-top: none; 
                display: flex; 
                flex-direction: column; 
                justify-content: center;
                animation: none; /* No slideup on desktop */
                display: none; /* hidden initially */
            }
            .analysis-widget.active { display: flex; }
        }
        @media (max-width: 767px) {
            .right-panel { display: flex; flex-direction: column; }
        }

    </style>
</head>

                <i class="fas fa-robot"></i>

            <div class="language-grid">

                    <img src="https://flagcdn.com/w80/es.png" alt="ES">

        <div class="modal-content">
            <div class="loader-ring"></div>
            <h3 style="margin-bottom: 10px;" id="analyzing-title" data-i18n="analyzing">Анализ рынка...</h3>
            <p style="color: #888; font-size: 14px;" id="analyzing-desc" data-i18n="analyzingDesc">ИИ сканирует паттерны</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div style="margin-top: 10px; font-weight: bold;" id="progress-text">0%</div>
        </div>
    </div>

    <script>
        // --- Translations ---
        const translations = {
            ru: { start: "Начать работу", asset: "Актив", timeframe: "Время", getSignal: "Получить сигнал", analyzing: "Анализ рынка...", analyzingDesc: "Искусственный интеллект сканирует паттерны", analysisResult: "Результат анализа", confidence: "Точность", search: "Поиск..." },
            en: { start: "Start Trading", asset: "Asset", timeframe: "Timeframe", getSignal: "Get Signal", analyzing: "Analyzing market...", analyzingDesc: "AI is scanning patterns", analysisResult: "Analysis Result", confidence: "Confidence", search: "Search..." },
            es: { start: "Comenzar", asset: "Activo", timeframe: "Marco temporal", getSignal: "Obtener señal", analyzing: "Analizando mercado...", analyzingDesc: "La IA está escaneando", analysisResult: "Resultado del análisis", confidence: "Confianza", search: "Buscar..." },
            pt: { start: "Começar", asset: "Ativo", timeframe: "Período", getSignal: "Obter Sinal", analyzing: "Analisando mercado...", analyzingDesc: "A IA está escaneando", analysisResult: "Resultado da análise", confidence: "Confiança", search: "Procurar..." }
        };

        let currentLang = 'ru';
        let tvWidget = null;

        const pairs = [
            "EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "USDCAD", "USDCHF", "NZDUSD",
            "EURGBP", "EURJPY", "GBPJPY", "AUDJPY", "EURAUD",
            "BTCUSD", "ETHUSD", "SOLUSD", "BNBUSD"
        ];

        // --- Init App ---
        document.querySelectorAll('.language-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.language-item').forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');
                currentLang = item.dataset.lang;
                document.getElementById('start-btn').classList.add('visible');
                document.getElementById('start-btn').innerHTML = translations[currentLang].start + ' <i class="fas fa-arrow-right"></i>';
            });
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('welcome-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = window.innerWidth > 767 ? 'flex' : 'flex';
                updateLanguage();
                initChart("EURUSD");
                renderPairsList();
            }, 500);
        });

        function updateLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
            document.getElementById('pair-search').placeholder = translations[currentLang].search;
        }

        // --- Theme Toggle ---
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            document.getElementById('theme-toggle').innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            if (tvWidget) {
                initChart(document.getElementById('selected-pair').textContent.replace('/',''));
            }
        });

        // --- Chart ---
        function initChart(symbol) {
            const isLight = document.body.classList.contains('light-theme');
            const formattedSymbol = symbol.includes("USD") && !symbol.startsWith("BTC") && !symbol.startsWith("ETH") ? "FX_IDC:" + symbol : "BINANCE:" + symbol;
            
            tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": formattedSymbol,
                "interval": document.getElementById('selected-time').textContent.replace('M',''),
                "timezone": "Etc/UTC",
                "theme": isLight ? "light" : "dark",
                "style": "1",
                "locale": currentLang === 'pt' ? 'br' : currentLang,
                "enable_publishing": false,
                "backgroundColor": isLight ? "#ffffff" : "#0b0b1a",
                "gridColor": isLight ? "#e2e8f0" : "#1a1a2e",
                "hide_top_toolbar": true,
                "hide_legend": false,
                "save_image": false,
                "container_id": "tv_chart_container",
                "toolbar_bg": isLight ? "#f8fafc" : "#161625"
            });
        }

        // --- Selectors Logic ---
        function renderPairsList(filter = '') {
            const list = document.getElementById('pairs-list');
            list.innerHTML = '';
            pairs.filter(p => p.toLowerCase().includes(filter.toLowerCase())).forEach(p => {
                const formatted = p.length === 6 ? p.slice(0,3) + '/' + p.slice(3) : p;
                const div = document.createElement('div');
                div.className = 'pair-item';
                div.innerHTML = `<span>${formatted}</span>`;
                div.onclick = () => {
                    document.getElementById('selected-pair').textContent = formatted;
                    document.getElementById('pairs-dropdown').style.display = 'none';
                    initChart(p);
                };
                list.appendChild(div);
            });
        }

        document.getElementById('pair-selector').onclick = (e) => {
            if(e.target.tagName !== 'INPUT') {
                const dd = document.getElementById('pairs-dropdown');
                dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
                document.getElementById('time-dropdown').style.display = 'none';
            }
        };

        document.getElementById('pair-search').oninput = (e) => renderPairsList(e.target.value);

        document.getElementById('time-selector').onclick = () => {
            const dd = document.getElementById('time-dropdown');
            dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
            document.getElementById('pairs-dropdown').style.display = 'none';
        };

        document.querySelectorAll('.time-item').forEach(item => {
            item.onclick = (e) => {
                e.stopPropagation();
                document.getElementById('selected-time').textContent = item.textContent;
                document.getElementById('time-dropdown').style.display = 'none';
                initChart(document.getElementById('selected-pair').textContent.replace('/',''));
            };
        });

        // Close dropdowns on outside click
        document.addEventListener('click', (e) => {
            if(!e.target.closest('#pair-selector')) document.getElementById('pairs-dropdown').style.display = 'none';
            if(!e.target.closest('#time-selector')) document.getElementById('time-dropdown').style.display = 'none';
        });

        // --- Signal Generation Logic ---
        document.getElementById('get-signal-btn').addEventListener('click', () => {
            // Hide widget and controls temporarily (on mobile)
            document.getElementById('analysis-widget').classList.remove('active');
            if(window.innerWidth < 768) {
                document.getElementById('controls-panel').style.display = 'none';
            }

            const modal = document.getElementById('analyzing-modal');
            const fill = document.getElementById('progress-fill');
            const text = document.getElementById('progress-text');
            
            modal.style.display = 'flex';
            let progress = 0;
            
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 5;
                if(progress > 100) progress = 100;
                fill.style.width = progress + '%';
                text.textContent = progress + '%';

                if(progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        modal.style.display = 'none';
                        fill.style.width = '0%';
                        text.textContent = '0%';
                        showAnalysisResult();
                    }, 500);
                }
            }, 300);
        });

        function showAnalysisResult() {
            const pair = document.getElementById('selected-pair').textContent;
            const time = document.getElementById('selected-time').textContent;
            
            document.getElementById('aw-pair').textContent = pair;
            document.getElementById('aw-time').textContent = time;

            // Generate Signal (Random BUY/SELL)
            const isBuy = Math.random() > 0.5;
            const signalTextEl = document.getElementById('aw-signal-text');
            const percentEl = document.getElementById('aw-percent');
            
            // STRICTLY ENGLISH 'BUY' / 'SELL' with colors
            if(isBuy) {
                signalTextEl.textContent = 'BUY';
                signalTextEl.className = 'aw-signal signal-buy';
            } else {
                signalTextEl.textContent = 'SELL';
                signalTextEl.className = 'aw-signal signal-sell';
            }

            const confidence = Math.floor(Math.random() * (99 - 78 + 1)) + 78;
            percentEl.textContent = confidence + '%';

            // Show Widget
            document.getElementById('analysis-widget').classList.add('active');
        }

        // Close Widget and restore menu
        function closeWidget() {
            document.getElementById('analysis-widget').classList.remove('active');
            if(window.innerWidth < 768) {
                document.getElementById('controls-panel').style.display = 'block';
            }
        }
    </script>
</body>
</html>
