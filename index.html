<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OptiBotX PRO | Premium Trading Terminal</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-color: #050510;
            --app-bg: #0b0b1a;
            --border-color: #1a1a2e;
            --text-color: white;
            --secondary-bg: #161625;
            --hover-color: #2a2a3f;
            --accent: #5b4dff;
            --accent-glow: rgba(91, 77, 255, 0.3);
            --glass-bg: rgba(20, 30, 50, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-color);
            font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden;
        }

        /* --- ПЕРВОНАЧАЛЬНЫЕ ЭКРАНЫ --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 10000; display: flex;
            align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .step-card {
            background: var(--secondary-bg); border: 1px solid var(--border-color);
            border-radius: 30px; padding: 30px; width: 90%; max-width: 360px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .step-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: var(--accent); }
        .list-options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: var(--app-bg); border: 1px solid var(--border-color);
            padding: 16px; border-radius: 15px; color: white; cursor: pointer;
            font-weight: 600; transition: 0.3s; font-size: 16px;
        }
        .option-btn:hover, .option-btn.active { 
            border-color: var(--accent); background: rgba(91, 77, 255, 0.15); 
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .hidden { display: none !important; }

        /* --- ИНТЕРФЕЙС ПРИЛОЖЕНИЯ --- */
        .app-main { display: flex; flex-direction: column; height: 100vh; }
        
        /* Уменьшенный график для телефонов */
        #tv-container { flex: 0 0 40vh; width: 100%; background: #000; border-bottom: 1px solid var(--border-color); }

        .controls-panel {
            flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 12px;
            background: var(--app-bg); overflow-y: auto;
        }

        .input-group { background: var(--secondary-bg); padding: 12px; border-radius: 15px; border: 1px solid var(--border-color); }
        .label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }

        select {
            width: 100%; background: var(--app-bg); color: white; border: 1px solid var(--border-color);
            padding: 12px; border-radius: 10px; font-size: 15px; outline: none;
        }

        .tf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .tf-item {
            background: var(--app-bg); border: 1px solid var(--border-color);
            padding: 10px 5px; text-align: center; border-radius: 8px; font-size: 13px;
            cursor: pointer; transition: 0.2s; font-weight: 600;
        }
        .tf-item.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .btn-analyze {
            background: var(--accent); color: white; border: none; padding: 18px;
            border-radius: 15px; font-size: 18px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; margin-top: auto; letter-spacing: 1px;
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        /* --- ОКНО РЕГИСТРАЦИИ (ПОД СКРИНШОТ) --- */
        .reg-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 20000; display: flex;
            align-items: center; justify-content: center;
        }
        .reg-card {
            background: var(--secondary-bg); border: 1px solid var(--border-color);
            border-radius: 35px; padding: 25px; width: 88%; max-width: 340px; text-align: center;
        }
        .reg-card h2 { font-size: 20px; margin-bottom: 10px; }
        .reg-card p { font-size: 13px; color: #bbb; margin-bottom: 20px; line-height: 1.5; }
        .reg-input {
            width: 100%; padding: 16px; background: #000; border: 1px solid var(--border-color);
            border-radius: 50px; color: white; text-align: center; font-size: 16px; margin-bottom: 15px; outline: none;
        }
        .reg-btn {
            background: var(--accent); color: white; width: 100%; padding: 16px;
            border-radius: 50px; font-weight: 700; border: none; cursor: pointer; margin-bottom: 10px;
        }
        .reg-support {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .support-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 50px; color: white; font-size: 12px; text-decoration: none;
        }

        /* Анимация пульсации для АНАЛИЗА */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .analyzing { animation: pulse 1s infinite; pointer-events: none; background: #333 !important; }

        /* Сигнальный виджет */
        #signal-widget {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--secondary-bg); border: 2px solid var(--accent);
            padding: 30px; border-radius: 30px; z-index: 30000; display: none;
            width: 80%; text-align: center; box-shadow: 0 0 50px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div id="lang-step" class="overlay">
        <div class="step-card">
            <div class="step-title">SELECT LANGUAGE</div>
            <div class="list-options">
                <div class="option-btn" onclick="nextStep('ru')">🇷🇺 РУССКИЙ</div>
                <div class="option-btn" onclick="nextStep('en')">🇺🇸 ENGLISH</div>
            </div>
        </div>
    </div>

    <div id="menu-step" class="overlay hidden">
        <div class="step-card">
            <div class="step-title" id="menu-header">MENU</div>
            <div class="list-options">
                <div class="option-btn" onclick="window.open('https://t.me/ZentixTrade')">ОТЗЫВЫ ПРИЛОЖЕНИЯ</div>
                <div class="option-btn" onclick="alert('Coming soon...')">ОБУЧЕНИЕ</div>
                <div class="option-btn active" onclick="startApp()">НАЧАТЬ РАБОТАТЬ</div>
            </div>
            <button class="reg-btn" style="margin-top: 20px;" onclick="startApp()">СТАРТ</button>
        </div>
    </div>

    <div id="reg-modal" class="reg-modal hidden">
        <div class="reg-card">
            <h2>🔐 АКТИВАЦИЯ</h2>
            <p>Для использования бота необходимо привязать свой аккаунт. Введите ваш ID ниже.</p>
            <input type="number" id="user-id" class="reg-input" placeholder="ID ВАШЕГО АККАУНТА">
            <button class="reg-btn" onclick="checkAccess()">ПРОВЕРИТЬ</button>
            <div class="reg-support">
                <a href="https://t.me/ZentixTrade" class="support-btn">НАПИСАТЬ МНЕ</a>
                <button class="support-btn" onclick="document.getElementById('reg-modal').classList.add('hidden')">ЗАКРЫТЬ</button>
            </div>
        </div>
    </div>

    <div class="app-main hidden" id="app-ui">
        <div id="tv-container"></div>
        
        <div class="controls-panel">
            <div class="input-group">
                <div class="label">ВАЛЮТНАЯ ПАРА</div>
                <select id="pair-select" onchange="updatePair()">
                    <option value="EURUSD">EUR/USD</option>
                    <option value="GBPUSD">GBP/USD</option>
                    <option value="USDJPY">USD/JPY</option>
                    <option value="AUDUSD">AUD/USD</option>
                    <option value="EURUSD_OTC">EUR/USD (OTC)</option>
                    <option value="GBPUSD_OTC">GBP/USD (OTC)</option>
                    <option value="USDJPY_OTC">USD/JPY (OTC)</option>
                    <option value="AUDUSD_OTC">AUD/USD (OTC)</option>
                </select>
            </div>

            <div class="input-group">
                <div class="label">ВРЕМЯ ЭКСПИРАЦИИ</div>
                <div class="tf-grid" id="tf-container">
                    </div>
            </div>

            <button class="btn-analyze" id="btn-main" onclick="handleAnalyze()">АНАЛИЗ</button>
        </div>
    </div>

    <div id="signal-widget">
        <div style="font-size: 14px; color: #888;" id="sig-pair-label">EUR/USD</div>
        <div style="font-size: 48px; font-weight: 900; margin: 15px 0;" id="sig-direction">BUY</div>
        <div style="font-size: 24px; color: var(--accent);" id="sig-percent">92%</div>
        <button class="reg-btn" style="margin-top: 20px; background: transparent; border: 1px solid var(--accent);" onclick="closeSignal()">OK</button>
    </div>

    <script>
        let currentLang = 'ru';
        let isAuthorized = false;
        let selectedPair = 'EURUSD';
        let selectedTime = '1m';

        // Инициализация при выборе языка
        function nextStep(lang) {
            currentLang = lang;
            document.getElementById('lang-step').classList.add('hidden');
            document.getElementById('menu-step').classList.remove('hidden');
            if(lang === 'en') {
                document.getElementById('menu-header').innerText = 'MAIN MENU';
                // Можно добавить перевод остальных кнопок
            }
        }

        // Запуск приложения
        function startApp() {
            document.getElementById('menu-step').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            initChart('FX:EURUSD');
            renderTimeframes(false);
        }

        // Отрисовка таймфреймов
        function renderTimeframes(isOTC) {
            const container = document.getElementById('tf-container');
            container.innerHTML = '';
            const times = isOTC ? ['5s', '10s', '15s', '30s'] : ['1m', '2m', '5m', '15m'];
            selectedTime = times[0];

            times.forEach(t => {
                const div = document.createElement('div');
                div.className = `tf-item ${t === selectedTime ? 'active' : ''}`;
                div.innerText = t;
                div.onclick = () => {
                    document.querySelectorAll('.tf-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    selectedTime = t;
                };
                container.appendChild(div);
            });
        }

        // Смена пары
        function updatePair() {
            const select = document.getElementById('pair-select');
            selectedPair = select.value;
            const isOTC = selectedPair.includes('OTC');
            
            let symbol = "FX:" + selectedPair.replace('_OTC', '');
            initChart(symbol);
            renderTimeframes(isOTC);
        }

        // Трейдинг Вью
        function initChart(symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ru",
                "container_id": "tv-container",
                "hide_top_toolbar": true,
                "hide_legend": true,
                "save_image": false,
                "backgroundColor": "#050510",
                "gridColor": "rgba(42, 46, 57, 0.06)"
            });
        }

        // Логика Анализа
        function handleAnalyze() {
            if (!isAuthorized) {
                document.getElementById('reg-modal').classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('btn-main');
            btn.classList.add('analyzing');
            btn.innerText = currentLang === 'ru' ? 'АНАЛИЗИРУЮ...' : 'ANALYZING...';

            setTimeout(() => {
                btn.classList.remove('analyzing');
                btn.innerText = currentLang === 'ru' ? 'АНАЛИЗ' : 'ANALYZE';
                showSignal();
            }, 3000);
        }

        function checkAccess() {
            const id = document.getElementById('user-id').value;
            if (id.length > 4) {
                isAuthorized = true;
                document.getElementById('reg-modal').classList.add('hidden');
                alert(currentLang === 'ru' ? 'Доступ разрешен!' : 'Access granted!');
            } else {
                alert(currentLang === 'ru' ? 'Неверный ID!' : 'Invalid ID!');
            }
        }

        function showSignal() {
            const isBuy = Math.random() > 0.5;
            const direction = isBuy ? 'BUY' : 'SELL';
            const color = isBuy ? '#00ff88' : '#ff4d4d';
            
            document.getElementById('sig-pair-label').innerText = selectedPair.replace('_', ' ');
            const dirEl = document.getElementById('sig-direction');
            dirEl.innerText = direction;
            dirEl.style.color = color;
            document.getElementById('sig-percent').innerText = Math.floor(Math.random() * (98 - 85) + 85) + '%';
            
            document.getElementById('signal-widget').style.display = 'block';
        }

        function closeSignal() {
            document.getElementById('signal-widget').style.display = 'none';
        }
    </script>
</body>
</html>
