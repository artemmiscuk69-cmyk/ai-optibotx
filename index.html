<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OptiBotX PRO</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-color: #050510;
            --app-bg: #0b0b1a;
            --border-color: #1a1a2e;
            --text-color: #ffffff;
            --secondary-bg: #161625;
            --hover-color: #2a2a3f;
            --accent: #5b4dff;
            --accent-glow: rgba(91, 77, 255, 0.4);
            --glass-bg: rgba(20, 30, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --success: #00ff88;
            --danger: #ff3366;
            --neutral: #5b4dff;
        }
        body.light-theme {
            --bg-color: #f0f2f5;
            --app-bg: #ffffff;
            --border-color: #ddd;
            --text-color: #222;
            --secondary-bg: #f5f5f5;
            --hover-color: #e0e0e0;
            --accent: #4a3aff;
        }
        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-color);
            font-family: 'Inter', system-ui, -apple-system, sans-serif; height: 100vh; 
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        /* --- ПАНЕЛИ ВХОДА (СТАРЫЙ ДИЗАЙН) --- */
        .welcome-overlay, .register-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a3a 0%, #050510 100%);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
            opacity: 0; visibility: hidden; transition: 0.4s;
        }
        .visible { opacity: 1; visibility: visible; }
        
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 30px; width: 85%; max-width: 350px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .language-item {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: 0.2s;
        }
        .language-item:hover { background: var(--accent); }
        .language-item.selected { background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

        .main-btn {
            background: linear-gradient(135deg, var(--accent), #8a4fff);
            border: none; color: white; padding: 14px; border-radius: 12px;
            width: 100%; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s;
        }

        /* --- ОСНОВНОЙ ТЕРМИНАЛ --- */
        .app-container {
            width: 100%; max-width: 420px; height: 100vh; background: var(--app-bg);
            display: none; flex-direction: column; padding: 15px; box-sizing: border-box;
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        /* Кнопки в хедере */
        .header-tools { display: flex; gap: 8px; }
        .tool-btn { 
            background: var(--secondary-bg); border: 1px solid var(--border-color);
            color: white; padding: 8px; border-radius: 10px; cursor: pointer;
        }

        /* Поиск и список пар */
        .search-box { position: relative; margin-bottom: 15px; }
        #pair-search {
            width: 100%; background: var(--secondary-bg); border: 1px solid var(--border-color);
            color: white; padding: 12px 15px; border-radius: 12px; box-sizing: border-box; outline: none;
        }
        .pairs-dropdown {
            position: absolute; top: 110%; left: 0; width: 100%; max-height: 200px;
            background: #161625; border: 1px solid var(--border-color); border-radius: 12px;
            overflow-y: auto; z-index: 100; display: none;
        }
        .pair-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #1f1f35; display: flex; gap: 10px; }
        .pair-item:hover { background: var(--hover-color); }

        /* ТФ и Кнопка */
        .tf-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
        .tf-item {
            background: var(--secondary-bg); border: 1px solid var(--border-color);
            padding: 8px 0; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.8rem;
        }
        .tf-item.active { background: var(--accent); border-color: var(--accent); }

        .analyze-trigger {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none; color: white; padding: 16px; border-radius: 14px;
            font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase;
        }

        /* Логика шариков */
        .status-box { 
            height: 50px; display: flex; align-items: center; justify-content: center; 
            margin-top: 10px; border-radius: 12px; font-weight: bold;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
        .dot-blue { background: #0072ff; box-shadow: 0 0 10px #0072ff; animation: pulse 1s infinite; }
        .dot-green { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot-red { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        /* УМЕНЬШЕННЫЙ ГРАФИК */
        .chart-wrap {
            margin-top: auto; width: 100%; height: 280px; /* Сделали меньше */
            border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color);
            background: #000; position: relative;
        }
        #tv_chart { width: 100%; height: 100%; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

<div id="welcome" class="welcome-overlay visible">
    <div class="glass-card">
        <h2 style="margin-top:0">OptiBotX</h2>
        <div class="language-item" onclick="selLang('en', this)">🇬🇧 English</div>
        <div class="language-item" onclick="selLang('ru', this)">🇷🇺 Русский</div>
        <button class="main-btn" onclick="goToReg()">Continue</button>
    </div>
</div>

<div id="register" class="register-overlay">
    <div class="glass-card">
        <h3>Activation</h3>
        <p style="font-size: 0.8rem; opacity: 0.7;">Enter license code to continue</p>
        <input type="text" id="code-in" placeholder="XXXXXXX" style="width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#000; color:white; text-align:center;">
        <button class="main-btn" onclick="checkCode()">Activate</button>
        <a href="https://t.me/ZentixTrade" style="color:var(--accent); display:block; margin-top:15px; text-decoration:none; font-size:0.8rem;">Get code here</a>
    </div>
</div>

<div id="app" class="app-container">
    <header>
        <div class="logo">OptiBotX <span>PRO</span></div>
        <div class="header-tools">
            <button class="tool-btn" onclick="toggleTheme()">🌓</button>
            <button class="tool-btn">⚙️</button>
        </div>
    </header>

    <div class="search-box">
        <input type="text" id="pair-search" placeholder="Search pair..." onfocus="showPairs()" oninput="filterPairs()">
        <div id="pairs-list" class="pairs-dropdown"></div>
    </div>

    <div class="tf-container">
        <div class="tf-item active" onclick="setTf('1m', this)">1M</div>
        <div class="tf-item" onclick="setTf('5m', this)">5M</div>
        <div class="tf-item" onclick="setTf('15m', this)">15M</div>
        <div class="tf-item" onclick="setTf('30m', this)">30M</div>
    </div>

    <button id="an-btn" class="analyze-trigger" onclick="runAnalysis()">Analyze Market</button>

    <div id="status-display" class="status-box" style="display:none;"></div>

    <div class="chart-wrap">
        <div id="tv_chart"></div>
    </div>
</div>

<script>
    let currentPair = "EURUSD";
    let selectedLang = 'en';

    // Список всех пар
    const pairs = [
        {n: "EUR/USD", s: "FX:EURUSD", f: "🇪🇺"}, {n: "GBP/USD", s: "FX:GBPUSD", f: "🇬🇧"},
        {n: "USD/JPY", s: "FX:USDJPY", f: "🇯🇵"}, {n: "BTC/USD", s: "BINANCE:BTCUSDT", f: "₿"},
        {n: "ETH/USD", s: "BINANCE:ETHUSDT", f: "♦"}, {n: "GOLD", s: "OANDA:XAUUSD", f: "🪙"},
        {n: "AUD/USD", s: "FX:AUDUSD", f: "🇦🇺"}, {n: "USD/CAD", s: "FX:USDCAD", f: "🇨🇦"}
    ];

    function selLang(l, el) {
        selectedLang = l;
        document.querySelectorAll('.language-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
    }

    function goToReg() {
        document.getElementById('welcome').classList.remove('visible');
        document.getElementById('register').classList.add('visible');
    }

    function checkCode() {
        // Упрощенная проверка для демо
        document.getElementById('register').classList.remove('visible');
        document.getElementById('app').style.display = 'flex';
        initChart();
        renderPairs();
    }

    function initChart() {
        new TradingView.widget({
            "autosize": true, "symbol": currentPair, "interval": "1",
            "timezone": "Etc/UTC", "theme": "dark", "style": "1",
            "locale": "ru", "toolbar_bg": "#f1f3f6", "enable_publishing": false,
            "hide_top_toolbar": true, "save_image": false, "container_id": "tv_chart"
        });
    }

    function renderPairs() {
        const list = document.getElementById('pairs-list');
        list.innerHTML = pairs.map(p => `
            <div class="pair-item" onclick="selectPair('${p.s}', '${p.n}')">
                <span>${p.f}</span> <span>${p.n}</span>
            </div>
        `).join('');
    }

    function showPairs() { document.getElementById('pairs-list').style.display = 'block'; }
    function selectPair(s, n) {
        currentPair = s;
        document.getElementById('pair-search').value = n;
        document.getElementById('pairs-list').style.display = 'none';
        initChart();
    }

    function setTf(tf, el) {
        document.querySelectorAll('.tf-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    function runAnalysis() {
        const btn = document.getElementById('an-btn');
        const status = document.getElementById('status-display');
        
        btn.disabled = true;
        btn.style.opacity = '0.5';
        status.style.display = 'flex';
        status.innerHTML = '<div class="dot dot-blue"></div> Analyzing...';

        setTimeout(() => {
            const isUp = Math.random() > 0.5;
            const signal = isUp ? 'UP' : 'DOWN';
            const dotClass = isUp ? 'dot-green' : 'dot-red';
            const color = isUp ? 'var(--success)' : 'var(--danger)';
            
            status.innerHTML = `<div class="dot ${dotClass}"></div> <span style="color:${color}">${signal} (${Math.floor(Math.random()*15+82)}%)</span>`;
            
            setTimeout(() => {
                btn.disabled = false;
                btn.style.opacity = '1';
            }, 3000);
        }, 2000);
    }

    function toggleTheme() {
        document.body.classList.toggle('light-theme');
        initChart();
    }

    // Закрытие списка при клике вне
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-box')) document.getElementById('pairs-list').style.display = 'none';
    });
</script>
</body>
</html>
