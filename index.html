<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Wallet Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #161719; /* Точный цвет фона */
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        ::-webkit-scrollbar { display: none; }
        
        /* Сквирклы для кнопок Отпр, Полу, Обмен, Поку */
        .squircle {
            background-color: #2b2c2f;
            border-radius: 20px; 
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .squircle-green {
            background-color: #50F485;
            color: #000;
        }
        .nav-icon { color: #8E8E93; font-size: 18px; }
        .nav-icon.active { color: #50F485; }
        
        /* Закругление нижней панели */
        .bottom-panel {
            background-color: #1f2023;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        /* Утопленная центральная кнопка "Торговать" */
        .trade-btn-container {
            position: relative;
            top: -24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .trade-btn {
            background-color: #50F485;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 6px solid #161719; /* Обводка цвета фона, чтобы сделать "вырез" */
            color: #000;
            font-size: 20px;
            box-sizing: content-box;
        }
        
        /* Красные точки уведомлений */
        .red-dot {
            position: absolute;
            top: 0;
            right: -2px;
            width: 8px;
            height: 8px;
            background-color: #FF453A;
            border-radius: 50%;
        }
        
        /* Активная вкладка */
        .tab-active {
            color: #fff;
            position: relative;
        }
        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #50F485;
            border-radius: 2px;
        }
    </style>
</head>
<body class="h-screen flex flex-col pb-24">

    <!-- Top Header -->
    <div class="flex items-center justify-between px-4 pt-10 pb-2">
        <div class="relative">
            <i class="fa-solid fa-gear text-xl text-gray-300"></i>
            <div class="red-dot" style="right: -4px; top: -2px;"></div>
        </div>
        
        <div class="bg-[#2b2c2f] rounded-full flex items-center px-4 py-2 w-[70%] relative">
            <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2 text-sm"></i>
            <input type="text" placeholder="Поиск" class="bg-transparent border-none outline-none text-white w-full text-[15px] placeholder-gray-400">
            <!-- Иконка сканера внутри поиска -->
            <i class="fa-solid fa-qrcode text-gray-400 ml-2 text-lg"></i>
        </div>
        
        <div class="relative">
            <i class="fa-regular fa-clone text-xl text-gray-300"></i>
            <div class="red-dot" style="right: -4px; top: -2px;"></div>
        </div>
    </div>

    <!-- Main Balance -->
    <div class="flex flex-col items-center mt-3">
        <div class="flex items-center text-gray-200 text-[14px] font-medium bg-[#2b2c2f] px-3 py-1.5 rounded-full mb-2 cursor-pointer relative">
            Основной кошелек <i class="fa-solid fa-chevron-right text-[10px] ml-2 text-gray-400"></i>
            <i class="fa-regular fa-copy text-gray-400 ml-3 text-sm"></i>
        </div>
        <h1 id="main-balance" class="text-[44px] font-bold tracking-tight mt-1" style="line-height: 1.1;">0,00 $</h1>
        <p class="text-gray-400 text-[14px] mt-1">0,00 $ (0.00%)</p>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-center gap-5 mt-7 px-4">
        <div class="flex flex-col items-center gap-2">
            <div class="squircle"><i class="fa-solid fa-arrow-up-right-from-square text-lg text-gray-200"></i></div>
            <span class="text-[13px] font-medium text-gray-200">Отпр...</span>
        </div>
        <div class="flex flex-col items-center gap-2">
            <div class="squircle"><i class="fa-solid fa-arrow-down text-lg text-gray-200"></i></div>
            <span class="text-[13px] font-medium text-gray-200">Полу...</span>
        </div>
        <div class="flex flex-col items-center gap-2">
            <div class="squircle"><i class="fa-solid fa-rotate text-lg text-gray-200"></i></div>
            <span class="text-[13px] font-medium text-gray-200">Обмен</span>
        </div>
        <div class="flex flex-col items-center gap-2">
            <div class="squircle squircle-green"><i class="fa-solid fa-plus text-2xl text-black"></i></div>
            <span class="text-[13px] font-medium text-gray-200">Поку...</span>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex items-center justify-between px-4 mt-8 border-b border-[#2b2c2f] pb-3">
        <div class="flex gap-6 text-[16px] font-semibold text-gray-500">
            <span>Криптовалюта</span>
            <span class="tab-active">Избранное</span>
            <span>NFT</span>
        </div>
        <div class="flex gap-4 text-gray-400 text-lg">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <i class="fa-solid fa-sliders"></i>
        </div>
    </div>

    <!-- Crypto List -->
    <div class="flex-1 overflow-y-auto mt-2 pb-6">
        <!-- SOL -->
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-3">
                <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="w-10 h-10 rounded-full bg-black border border-gray-800" alt="SOL">
                <div>
                    <h3 class="font-bold text-[17px]">SOL</h3>
                    <p class="text-[13px] text-gray-400">2,74 $B</p>
                </div>
            </div>
            <div class="text-right">
                <h3 class="font-bold text-[17px]" id="price-sol">86,45 $</h3>
                <p class="text-[13px] text-[#FF453A]" id="change-sol">-0.12%</p>
            </div>
        </div>
        <!-- ETH -->
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#627EEA] rounded-full flex items-center justify-center">
                    <i class="fa-brands fa-ethereum text-white text-xl"></i>
                </div>
                <div>
                    <h3 class="font-bold text-[17px]">ETH</h3>
                    <p class="text-[13px] text-gray-400">7,92 $B</p>
                </div>
            </div>
            <div class="text-right">
                <h3 class="font-bold text-[17px]" id="price-eth">2 346,91 $</h3>
                <p class="text-[13px] text-[#50F485]" id="change-eth">+1.29%</p>
            </div>
        </div>
        <!-- BTC -->
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-3">
                <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" class="w-10 h-10 rounded-full" alt="BTC">
                <div>
                    <h3 class="font-bold text-[17px]">BTC</h3>
                    <p class="text-[13px] text-gray-400">17,24 $B</p>
                </div>
            </div>
            <div class="text-right">
                <h3 class="font-bold text-[17px]" id="price-btc">78 101,78 $</h3>
                <p class="text-[13px] text-[#50F485]" id="change-btc">+0.55%</p>
            </div>
        </div>
        <!-- BNB -->
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-3">
                <img src="https://cryptologos.cc/logos/bnb-bnb-logo.png" class="w-10 h-10 rounded-full" alt="BNB">
                <div>
                    <h3 class="font-bold text-[17px]">BNB</h3>
                    <p class="text-[13px] text-gray-400">753,22 $M</p>
                </div>
            </div>
            <div class="text-right">
                <h3 class="font-bold text-[17px]" id="price-bnb">631,99 $</h3>
                <p class="text-[13px] text-[#50F485]" id="change-bnb">+0.23%</p>
            </div>
        </div>

        <div class="text-center mt-3">
            <button class="text-[#50F485] font-semibold text-[14px]">Просмотреть токены</button>
        </div>
        
        <!-- Заработок section -->
        <div class="px-4 mt-8">
            <h2 class="font-bold text-[20px] mb-4">Заработок <i class="fa-solid fa-chevron-right text-sm ml-1 text-gray-400"></i></h2>
            <div class="flex gap-4">
                <div class="bg-[#1f2023] h-32 w-1/2 rounded-2xl border border-[#2b2c2f] relative overflow-hidden flex flex-col justify-between p-3">
                    <div class="w-8 h-8 rounded-full bg-black flex items-center justify-center">
                        <i class="fa-solid fa-star text-yellow-500 text-xs"></i>
                    </div>
                </div>
                <div class="bg-[#1f2023] h-32 w-1/2 rounded-2xl border border-[#2b2c2f] relative overflow-hidden flex flex-col justify-between p-3">
                    <div class="w-8 h-8 rounded-full bg-black flex items-center justify-center text-red-500">
                         <i class="fa-solid fa-chart-pie text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 w-full bottom-panel pt-3 px-6 flex justify-between items-start z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
        <div class="flex flex-col items-center gap-1.5 nav-icon active mt-1 w-[20%]">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-medium">Главная</span>
        </div>
        <div class="flex flex-col items-center gap-1.5 nav-icon mt-1 w-[20%]">
            <i class="fa-solid fa-arrow-trend-up text-xl"></i>
            <span class="text-[10px] font-medium">Популярные</span>
        </div>
        
        <!-- Центральная кнопка обмена -->
        <div class="trade-btn-container w-[20%]">
            <div class="trade-btn shadow-[0_0_15px_rgba(80,244,133,0.2)]">
                <i class="fa-solid fa-arrow-right-arrow-left rotate-90"></i>
            </div>
            <span class="text-[10px] font-medium text-gray-400 mt-1">Торговать</span>
        </div>

        <div class="flex flex-col items-center gap-1.5 nav-icon mt-1 w-[20%]">
            <i class="fa-solid fa-gift text-xl"></i>
            <span class="text-[10px] font-medium">Награды</span>
        </div>
        
        <!-- КНОПКА ПОДРОБНЕЕ (Секретная функция) -->
        <div class="flex flex-col items-center gap-1.5 nav-icon cursor-pointer mt-1 w-[20%]" onclick="setCustomBalance()">
            <i class="fa-regular fa-compass text-xl"></i>
            <span class="text-[10px] font-medium">Подробнее</span>
        </div>
    </div>

    <script>
        // Форматирование чисел под вид (1 000,00 $)
        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            }).format(amount) + ' $';
        }

        // Функция подмены баланса (работает по нажатию на "Подробнее")
        function setCustomBalance() {
            let newBalance = prompt("Введите желаемый баланс (например: 150000.50):");
            if (newBalance !== null && newBalance !== "") {
                let parsedBalance = parseFloat(newBalance.replace(',', '.').replace(/\s/g, ''));
                if (!isNaN(parsedBalance)) {
                    document.getElementById('main-balance').innerText = formatMoney(parsedBalance);
                } else {
                    alert("Введите корректное число.");
                }
            }
        }

        // Автообновление курсов через Binance API
        async function fetchCryptoPrices() {
            const symbols = {
                'sol': 'SOLUSDT',
                'eth': 'ETHUSDT',
                'btc': 'BTCUSDT',
                'bnb': 'BNBUSDT'
            };

            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                const data = await response.json();

                for (const [coin, symbol] of Object.entries(symbols)) {
                    const coinData = data.find(item => item.symbol === symbol);
                    if (coinData) {
                        const price = parseFloat(coinData.lastPrice);
                        const change = parseFloat(coinData.priceChangePercent);
                        
                        document.getElementById(`price-${coin}`).innerText = formatMoney(price);
                        
                        const changeEl = document.getElementById(`change-${coin}`);
                        if (change >= 0) {
                            changeEl.innerText = `+${change.toFixed(2)}%`;
                            changeEl.style.color = '#50F485';
                        } else {
                            changeEl.innerText = `${change.toFixed(2)}%`;
                            changeEl.style.color = '#FF453A';
                        }
                    }
                }
            } catch (error) {
                console.error('Ошибка API Binance. Оставлены начальные данные.', error);
            }
        }

        // Через 5 секунд после загрузки страницы запускаем API.
        // Таким образом при входе у тебя всегда будут сначала точные цифры со скриншота
        setTimeout(() => {
            fetchCryptoPrices();
            setInterval(fetchCryptoPrices, 10000); // далее обновляем каждые 10 сек
        }, 5000);
    </script>
</body>
</html>
