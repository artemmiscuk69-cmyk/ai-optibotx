<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Wallet Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121315; /* Идеальный цвет заднего фона */
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Убираем скроллбар, но оставляем прокрутку */
        ::-webkit-scrollbar { display: none; }
        
        /* Кнопки действий (Отпр, Полу...) */
        .action-box {
            background-color: #212226;
            border-radius: 18px;
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Вырез для центральной кнопки нижнего меню */
        .center-btn-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
        }
        
        .center-btn {
            position: absolute;
            top: -46px; /* Поднята над панелью */
            background-color: #50F485;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Толстая обводка цвета фона создает эффект выреза в панели */
            border: 6px solid #121315; 
            z-index: 10;
            box-sizing: content-box;
        }
        
        /* Точечки уведомлений */
        .notification-dot {
            position: absolute;
            background-color: #FF453A;
            border: 2px solid #121315;
            border-radius: 50%;
        }

        /* Линия под "Избранное" */
        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #50F485;
            border-radius: 2px;
        }
    </style>
</head>
<body class="h-screen flex flex-col pb-24">

    <!-- Верхний бар -->
    <header class="flex items-center justify-between px-5 pt-12 pb-2">
        <div class="relative">
            <i class="fa-solid fa-gear text-[22px] text-gray-300"></i>
            <div class="notification-dot w-2.5 h-2.5 -top-1 -right-1"></div>
        </div>
        
        <div class="flex-1 mx-4">
            <div class="bg-[#212226] rounded-full h-10 flex items-center px-4">
                <i class="fa-solid fa-magnifying-glass text-[#8E8E93] text-sm mr-2.5"></i>
                <input type="text" placeholder="Поиск" class="bg-transparent border-none outline-none text-white w-full text-[15px] placeholder-[#8E8E93]" disabled>
            </div>
        </div>
        
        <div class="relative">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            </svg>
        </div>
    </header>

    <!-- Главный Баланс -->
    <div class="mt-5 flex flex-col items-center">
        <div class="flex items-center">
            <div class="relative bg-[#212226] text-white text-[13px] font-medium px-3.5 py-1.5 rounded-full flex items-center">
                Основной кошелек
                <i class="fa-solid fa-chevron-right text-[10px] ml-2 text-[#8E8E93]"></i>
                <div class="notification-dot w-2.5 h-2.5 -top-1 -right-0.5"></div>
            </div>
            <i class="fa-regular fa-clone text-[#8E8E93] ml-3 text-lg"></i>
        </div>
        <h1 id="main-balance" class="text-[42px] font-bold mt-2 tracking-tight">0,00 $</h1>
        <p id="sub-balance" class="text-[#8E8E93] text-[14px] mt-0.5">0,00 $ (0.00%)</p>
    </div>

    <!-- 4 Кнопки -->
    <div class="flex justify-center gap-[18px] mt-8 px-4">
        <div class="flex flex-col items-center gap-2">
            <div class="action-box"><i class="fa-solid fa-arrow-up-right text-xl text-gray-200"></i></div>
            <span class="text-[13px] font-medium text-gray-200">Отпр...</span>
        </div>
        <div class="flex flex-col items-center gap-2">
            <div class="action-box"><i class="fa-solid fa-arrow-down text-xl text-gray-200"></i></div>
            <span class="text-[13px] font-medium text-gray-200">Полу...</span>
        </div>
        <div class="flex flex-col items-center gap-2">
            <div class="action-box"><i class="fa-solid fa-rotate text-xl text-gray-200"></i></div>
            <span class="text-[13px] font-medium text-gray-200">Обмен</span>
        </div>
        <div class="flex flex-col items-center gap-2">
            <div class="action-box bg-[#50F485]"><i class="fa-solid fa-plus text-[26px] text-black"></i></div>
            <span class="text-[13px] font-medium text-gray-200">Поку...</span>
        </div>
    </div>

    <!-- Вкладки (Tabs) -->
    <div class="flex items-center justify-between px-5 mt-8 border-b border-[#212226] pb-2.5">
        <div class="flex gap-6 text-[15.5px] font-semibold text-[#8E8E93]">
            <span>Криптовалюта</span>
            <span class="text-white tab-active relative">Избранное</span>
            <span>NFT</span>
        </div>
        <div class="flex gap-4 text-[#8E8E93] text-lg">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <i class="fa-solid fa-sliders"></i>
        </div>
    </div>

    <!-- Список Монет -->
    <div class="flex-1 overflow-y-auto mt-1 pb-4">
        <!-- SOL -->
        <div class="flex justify-between items-center px-5 py-3.5">
            <div class="flex items-center gap-3.5">
                <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="w-10 h-10 rounded-full bg-black border border-gray-800" alt="SOL">
                <div class="flex flex-col">
                    <span class="text-[17px] font-bold leading-tight">SOL</span>
                    <span class="text-[13px] text-[#7C7D82] mt-0.5">2,74 $B</span>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[17px] font-bold leading-tight" id="price-sol">86,45 $</span>
                <span class="text-[13px] text-[#FF453A] mt-0.5" id="change-sol">-0.12%</span>
            </div>
        </div>
        <!-- ETH -->
        <div class="flex justify-between items-center px-5 py-3.5">
            <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center border border-gray-800">
                    <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" class="w-6 h-6" alt="ETH">
                </div>
                <div class="flex flex-col">
                    <span class="text-[17px] font-bold leading-tight">ETH</span>
                    <span class="text-[13px] text-[#7C7D82] mt-0.5">7,92 $B</span>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[17px] font-bold leading-tight" id="price-eth">2 346,91 $</span>
                <span class="text-[13px] text-[#50F485] mt-0.5" id="change-eth">+1.29%</span>
            </div>
        </div>
        <!-- BTC -->
        <div class="flex justify-between items-center px-5 py-3.5">
            <div class="flex items-center gap-3.5">
                <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" class="w-10 h-10 rounded-full" alt="BTC">
                <div class="flex flex-col">
                    <span class="text-[17px] font-bold leading-tight">BTC</span>
                    <span class="text-[13px] text-[#7C7D82] mt-0.5">17,24 $B</span>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[17px] font-bold leading-tight" id="price-btc">78 101,78 $</span>
                <span class="text-[13px] text-[#50F485] mt-0.5" id="change-btc">+0.55%</span>
            </div>
        </div>
        <!-- BNB -->
        <div class="flex justify-between items-center px-5 py-3.5">
            <div class="flex items-center gap-3.5">
                <img src="https://cryptologos.cc/logos/bnb-bnb-logo.png" class="w-10 h-10 rounded-full" alt="BNB">
                <div class="flex flex-col">
                    <span class="text-[17px] font-bold leading-tight">BNB</span>
                    <span class="text-[13px] text-[#7C7D82] mt-0.5">753,22 $M</span>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[17px] font-bold leading-tight" id="price-bnb">631,99 $</span>
                <span class="text-[13px] text-[#50F485] mt-0.5" id="change-bnb">+0.23%</span>
            </div>
        </div>

        <div class="text-center mt-3">
            <button class="text-[#50F485] font-semibold text-[14px]">Просмотреть токены</button>
        </div>
        
        <!-- Заработок -->
        <div class="mt-8 mb-6">
            <h2 class="font-bold text-[18px] mb-4 px-5">Заработок <i class="fa-solid fa-chevron-right text-[12px] text-[#8E8E93] ml-1"></i></h2>
            <div class="flex gap-3 px-5">
                <!-- Карточка 1 -->
                <div class="bg-[#1C1D21] w-[160px] h-[110px] rounded-[20px] p-4 flex flex-col justify-between border border-[#2A2B2F]">
                    <div class="w-8 h-8 rounded-full bg-black flex items-center justify-center">
                        <i class="fa-solid fa-star text-yellow-500 text-[12px]"></i>
                    </div>
                    <div>
                        <div class="text-[#8E8E93] text-[12px] font-medium">30.83% APY</div>
                    </div>
                </div>
                <!-- Карточка 2 -->
                <div class="bg-[#1C1D21] w-[160px] h-[110px] rounded-[20px] p-4 flex flex-col justify-between border border-[#2A2B2F]">
                    <div class="w-8 h-8 rounded-full bg-black flex items-center justify-center">
                        <i class="fa-solid fa-gift text-[#FF453A] text-[12px]"></i>
                    </div>
                    <div>
                        <div class="text-[#8E8E93] text-[12px] font-medium">27.04% APY</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="fixed bottom-0 w-full bg-[#1A1C1F] rounded-t-2xl flex justify-between items-end px-4 pb-6 pt-3 shadow-[0_-10px_30px_rgba(0,0,0,0.6)] border-t border-[#2A2B2F] z-50">
        
        <!-- Активная Главная -->
        <div class="flex flex-col items-center justify-center gap-1 bg-[#1A3324] w-[68px] py-1.5 rounded-2xl mb-0.5">
            <i class="fa-solid fa-house text-[#50F485] text-[20px]"></i>
            <span class="text-[#50F485] text-[10px] font-bold">Главная</span>
        </div>

        <div class="flex flex-col items-center gap-1.5 w-[68px] mb-1.5">
            <i class="fa-solid fa-arrow-trend-up text-[#8E8E93] text-[20px]"></i>
            <span class="text-[#8E8E93] text-[10px] font-medium">Популярные</span>
        </div>
        
        <!-- Вырезанная кнопка Торговать -->
        <div class="center-btn-wrapper">
            <div class="center-btn shadow-lg">
                <i class="fa-solid fa-arrow-down text-black text-sm absolute ml-2"></i>
                <i class="fa-solid fa-arrow-up text-black text-sm absolute mr-2"></i>
            </div>
            <span class="text-[#8E8E93] text-[10px] font-medium mb-1.5 mt-4 z-0">Торговать</span>
        </div>

        <div class="flex flex-col items-center gap-1.5 w-[68px] mb-1.5">
            <i class="fa-solid fa-gift text-[#8E8E93] text-[20px]"></i>
            <span class="text-[#8E8E93] text-[10px] font-medium">Награды</span>
        </div>
        
        <!-- КНОПКА ПОДРОБНЕЕ (Для смены баланса) -->
        <div class="flex flex-col items-center gap-1.5 w-[68px] mb-1.5 cursor-pointer" onclick="setCustomBalance()">
            <i class="fa-regular fa-compass text-[#8E8E93] text-[20px]"></i>
            <span class="text-[#8E8E93] text-[10px] font-medium">Подробнее</span>
        </div>
    </div>

    <!-- Логика -->
    <script>
        let currentMainBalance = 0;
        let isFaked = false;

        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            }).format(amount).replace(',', ',') + ' $';
        }

        // 1. Изменение баланса по нажатию "Подробнее"
        function setCustomBalance() {
            let input = prompt("Введите желаемый баланс (например: 24000.50):");
            if (input) {
                let val = parseFloat(input.replace(',', '.').replace(/\s/g, ''));
                if (!isNaN(val)) {
                    currentMainBalance = val;
                    isFaked = true;
                    document.getElementById('main-balance').innerText = formatMoney(val);
                    document.getElementById('sub-balance').innerText = formatMoney(val) + " (+0.00%)";
                }
            }
        }

        // Имитация живых торгов (баланс микро-колеблется, если он задан)
        setInterval(() => {
            if (isFaked && currentMainBalance > 0) {
                let fluctuation = currentMainBalance * (Math.random() * 0.0002 - 0.0001); // +/- 0.01%
                let displayVal = currentMainBalance + fluctuation;
                document.getElementById('main-balance').innerText = formatMoney(displayVal);
            }
        }, 3000);

        // 2. Настоящие курсы с Binance API
        async function fetchCryptoPrices() {
            const symbols = {
                'sol': 'SOLUSDT', 'eth': 'ETHUSDT', 'btc': 'BTCUSDT', 'bnb': 'BNBUSDT'
            };
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                const data = await res.json();

                for (const [coin, sym] of Object.entries(symbols)) {
                    const coinData = data.find(i => i.symbol === sym);
                    if (coinData) {
                        const price = parseFloat(coinData.lastPrice);
                        const change = parseFloat(coinData.priceChangePercent);
                        
                        document.getElementById(`price-${coin}`).innerText = formatMoney(price);
                        
                        const changeEl = document.getElementById(`change-${coin}`);
                        if (change >= 0) {
                            changeEl.innerText = `+${change.toFixed(2)}%`;
                            changeEl.style.color = '#50F485';
                        } else {
                            changeEl.innerText = `${change.toFixed(2)}%`;
                            changeEl.style.color = '#FF453A';
                        }
                    }
                }
            } catch (e) { console.log('API Error'); }
        }

        // Даем 5 секунд полюбоваться стартовыми цифрами со скриншота, затем включаем реальный API
        setTimeout(() => {
            fetchCryptoPrices();
            setInterval(fetchCryptoPrices, 10000);
        }, 5000);
    </script>
</body>
</html>
