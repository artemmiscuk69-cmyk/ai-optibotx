<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crypto Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Системный шрифт как на iOS (SF Pro) для максимального сходства со скрином */
        :root {
            --bg-main: #191B1F;
            --bg-card: #26282E;
            --border-color: #33353C;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            margin: 0;
            overflow: hidden;
        }
        
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .action-box {
            background-color: var(--bg-card);
            border-radius: 18px;
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .notification-dot {
            position: absolute;
            background-color: #FF453A;
            border: 2px solid var(--bg-main);
            border-radius: 50%;
        }

        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #50F485;
            border-radius: 2px;
        }

        .value-update {
            transition: opacity 0.3s ease;
        }

        /* Анимация нажатия */
        .tap-effect:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
    </style>
</head>
<body class="h-screen flex flex-col pb-0">

    <!-- Верхний бар -->
    <header class="flex items-center justify-between px-5 pb-3 z-20 bg-transparent" style="padding-top: calc(env(safe-area-inset-top) + 4px);">
        <div class="relative">
            <i class="fa-solid fa-gear text-[22px] text-gray-300"></i>
            <div class="notification-dot w-3.5 h-3.5 -top-1 -right-1"></div>
        </div>
        
        <div class="flex-1 mx-4">
            <div class="bg-[#26282E] rounded-full h-[38px] flex items-center px-4">
                <i class="fa-solid fa-magnifying-glass text-[#8E8E93] text-[13px] mr-2.5"></i>
                <input type="text" placeholder="Поиск" class="bg-transparent border-none outline-none text-white w-full text-[14px] placeholder-[#8E8E93] font-medium" disabled>
            </div>
        </div>
        
        <div class="relative">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            </svg>
        </div>
    </header>

    <!-- Скроллируемая область -->
    <div id="main-scroll" class="flex-1 overflow-y-auto pb-32 relative">
        
        <!-- Индикатор загрузки -->
        <div id="ptr-indicator" class="flex justify-center items-center h-0 overflow-hidden" style="transition: height 0.2s ease;">
            <svg class="animate-spin text-[#50F485] mt-4 w-7 h-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>

        <!-- Главный Баланс -->
        <div class="mt-0 flex flex-col items-center">
            <div class="flex items-center">
                <div class="relative bg-[#26282E] text-white text-[13px] font-medium px-3.5 py-1.5 rounded-full flex items-center">
                    Основной кошелек
                    <i class="fa-solid fa-chevron-right text-[10px] ml-2 text-[#8E8E93]"></i>
                    <div class="notification-dot w-3.5 h-3.5 -top-1 -right-1"></div>
                </div>
                <i class="fa-regular fa-clone text-[#8E8E93] ml-3 text-lg tap-effect"></i>
            </div>
            <h1 id="main-balance" class="text-[44px] font-bold mt-1.5 tracking-tight value-update">0,00 $</h1>
            <p id="sub-balance" class="text-[#8E8E93] text-[14px] mt-0.5 value-update font-medium">0,00 $ (0.00%)</p>
        </div>

        <!-- 4 Кнопки действий -->
        <div class="flex justify-center gap-[18px] mt-7 px-4">
            <div class="flex flex-col items-center gap-2 tap-effect">
                <div class="action-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </div>
                <span class="text-[13px] font-medium text-gray-200">Отпр...</span>
            </div>
            <div class="flex flex-col items-center gap-2 tap-effect">
                <div class="action-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                </div>
                <span class="text-[13px] font-medium text-gray-200">Полу...</span>
            </div>
            <div class="flex flex-col items-center gap-2 tap-effect">
                <div class="action-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </div>
                <span class="text-[13px] font-medium text-gray-200">Обмен</span>
            </div>
            <div class="flex flex-col items-center gap-2 tap-effect">
                <div class="action-box bg-[#50F485]">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
                <span class="text-[13px] font-medium text-gray-200">Поку...</span>
            </div>
        </div>

        <!-- Вкладки (Крипта / Избранное) -->
        <div class="flex items-center mt-8 border-b border-[var(--border-color)] pb-2.5 relative">
            <div id="tabs-scroll" class="flex gap-6 text-[15.5px] font-semibold text-[#8E8E93] overflow-x-auto hide-scrollbar flex-nowrap flex-1 px-5 scroll-smooth">
                <span class="whitespace-nowrap">Криптовалюта</span>
                <span class="text-white tab-active relative whitespace-nowrap">Избранное</span>
                <span class="whitespace-nowrap pr-24">NFT</span>
            </div>
            <div class="flex gap-4 text-[#8E8E93] text-lg absolute right-0 bg-gradient-to-l from-[var(--bg-main)] via-[var(--bg-main)] to-transparent pl-8 pr-5 py-1">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="14" x2="20" y2="14"></line>
                    <circle cx="8" cy="14" r="2.5"></circle>
                    <line x1="4" y1="8" x2="20" y2="8"></line>
                    <circle cx="16" cy="8" r="2.5"></circle>
                </svg>
            </div>
        </div>

        <!-- Список Монет строго по скриншоту -->
        <div class="mt-1 pb-4">
            <!-- 1. SOL -->
            <div class="flex justify-between items-center px-5 py-3.5 tap-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 bg-[#26282E] rounded-full flex items-center justify-center p-1 border border-[#33353C]">
                        <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="w-full h-full object-contain" alt="SOL">
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[17px] font-bold leading-tight">SOL</span>
                        <span class="text-[13px] text-[#7C7D82] mt-0.5">2,74 $B</span>
                    </div>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-[17px] font-bold leading-tight value-update" id="price-sol">86,45 $</span>
                    <span class="text-[13px] text-[#FF453A] mt-0.5 value-update font-medium" id="change-sol">-0.12%</span>
                </div>
            </div>
            
            <!-- 2. ETH -->
            <div class="flex justify-between items-center px-5 py-3.5 tap-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 bg-[#26282E] rounded-full flex items-center justify-center p-1 border border-[#33353C]">
                        <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" class="w-full h-full object-contain" alt="ETH">
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[17px] font-bold leading-tight">ETH</span>
                        <span class="text-[13px] text-[#7C7D82] mt-0.5">7,92 $B</span>
                    </div>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-[17px] font-bold leading-tight value-update" id="price-eth">2 346,91 $</span>
                    <span class="text-[13px] text-[#50F485] mt-0.5 value-update font-medium" id="change-eth">+1.29%</span>
                </div>
            </div>
            
            <!-- 3. BTC -->
            <div class="flex justify-between items-center px-5 py-3.5 tap-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 bg-[#26282E] rounded-full flex items-center justify-center p-1 border border-[#33353C]">
                        <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" class="w-full h-full object-contain" alt="BTC">
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[17px] font-bold leading-tight">BTC</span>
                        <span class="text-[13px] text-[#7C7D82] mt-0.5">17,24 $B</span>
                    </div>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-[17px] font-bold leading-tight value-update" id="price-btc">78 101,78 $</span>
                    <span class="text-[13px] text-[#50F485] mt-0.5 value-update font-medium" id="change-btc">+0.55%</span>
                </div>
            </div>
            
            <!-- 4. BNB -->
            <div class="flex justify-between items-center px-5 py-3.5 tap-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 bg-[#26282E] rounded-full flex items-center justify-center p-1 border border-[#33353C]">
                        <img src="https://cryptologos.cc/logos/bnb-bnb-logo.png" class="w-full h-full object-contain" alt="BNB">
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[17px] font-bold leading-tight">BNB</span>
                        <span class="text-[13px] text-[#7C7D82] mt-0.5">753,22 $M</span>
                    </div>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-[17px] font-bold leading-tight value-update" id="price-bnb">631,99 $</span>
                    <span class="text-[13px] text-[#50F485] mt-0.5 value-update font-medium" id="change-bnb">+0.23%</span>
                </div>
            </div>

            <div class="text-center mt-3 mb-6">
                <button class="text-[#50F485] font-semibold text-[14px]">Просмотреть токены</button>
            </div>
            
            <!-- Заработок -->
            <div class="mt-4 mb-6">
                <h2 class="font-bold text-[18px] mb-4 px-5">Заработок <i class="fa-solid fa-chevron-right text-[12px] text-[#8E8E93] ml-1"></i></h2>
                <div class="flex gap-3 px-5">
                    <div class="bg-[var(--bg-card)] w-[160px] h-[110px] rounded-[22px] p-4 flex flex-col justify-between border border-[var(--border-color)] tap-effect">
                        <div class="w-8 h-8 rounded-full bg-[#191B1F] flex items-center justify-center">
                            <i class="fa-solid fa-star text-yellow-500 text-[12px]"></i>
                        </div>
                        <div class="text-[#8E8E93] text-[13px] font-medium">30.83% APY</div>
                    </div>
                    <div class="bg-[var(--bg-card)] w-[160px] h-[110px] rounded-[22px] p-4 flex flex-col justify-between border border-[var(--border-color)] tap-effect">
                        <div class="w-8 h-8 rounded-full bg-[#191B1F] flex items-center justify-center">
                            <i class="fa-solid fa-gift text-[#FF453A] text-[12px]"></i>
                        </div>
                        <div class="text-[#8E8E93] text-[13px] font-medium">27.04% APY</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="fixed left-4 right-4 bg-[#23252A] rounded-[40px] flex justify-between items-center px-2 py-3 z-50 border border-[#33353C] shadow-2xl pb-2 pt-3" style="bottom: calc(max(14px, env(safe-area-inset-bottom) + 10px));">
        
        <!-- 1. Главная -->
        <div class="flex flex-col items-center justify-center w-[64px] tap-effect">
            <div class="flex flex-col items-center justify-center bg-[#173021] rounded-2xl w-full py-1.5 gap-0.5">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#50F485" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="text-[#50F485] text-[10px] font-bold tracking-wide mt-1">Главная</span>
            </div>
        </div>

        <!-- 2. Популярные -->
        <div class="flex flex-col items-center justify-center w-[60px] gap-1 mb-1 tap-effect">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
            <span class="text-[#8E8E93] text-[10px] font-medium mt-0.5">Популярные</span>
        </div>
        
        <!-- 3. Торговать -->
        <div class="relative flex flex-col items-center w-[70px] tap-effect">
            <div class="absolute -top-[44px] bg-[#50F485] w-[54px] h-[54px] rounded-full flex items-center justify-center border-[5px] border-[var(--bg-main)] z-10 box-content shadow-lg">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9h15"></path>
                    <path d="M15 5l4 4-4 4"></path>
                    <path d="M20 15H5"></path>
                    <path d="M9 19l-4-4 4-4"></path>
                </svg>
            </div>
            <span class="text-[#8E8E93] text-[10px] font-medium mt-[16px]">Торговать</span>
        </div>

        <!-- 4. Награды -->
        <div class="flex flex-col items-center justify-center w-[60px] gap-1 mb-1 tap-effect">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 12 20 22 4 22 4 12"></polyline>
                <rect x="2" y="7" width="20" height="5"></rect>
                <line x1="12" y1="22" x2="12" y2="7"></line>
                <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
            </svg>
            <span class="text-[#8E8E93] text-[10px] font-medium mt-0.5">Награды</span>
        </div>
        
        <!-- 5. Подробнее -->
        <button onclick="setCustomBalance()" class="flex flex-col items-center justify-center w-[60px] gap-1 mb-1 bg-transparent border-none outline-none tap-effect">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <span class="text-[#8E8E93] text-[10px] font-medium mt-0.5">Подробнее</span>
        </button>
    </div>

    <script>
        let currentMainBalance = 0;
        let isFaked = false;

        window.addEventListener('load', () => {
            const tabs = document.getElementById('tabs-scroll');
            if(tabs) tabs.scrollLeft = 14; 
        });

        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            }).format(amount) + ' $';
        }

        function animateUpdate(elementId, newValue, color) {
            const el = document.getElementById(elementId);
            if (el && el.innerText !== newValue) {
                el.style.opacity = '0.3'; 
                setTimeout(() => {
                    el.innerText = newValue;
                    if (color) el.style.color = color;
                    el.style.opacity = '1'; 
                }, 150);
            }
        }

        function setCustomBalance() {
            let input = prompt("Введите желаемый баланс (например: 24000.50):");
            if (input) {
                let val = parseFloat(input.replace(',', '.').replace(/\s/g, ''));
                if (!isNaN(val)) {
                    currentMainBalance = val;
                    isFaked = true;
                    animateUpdate('main-balance', formatMoney(val));
                    animateUpdate('sub-balance', `${formatMoney(val)} (0.00%)`, '#8E8E93');
                }
            }
        }

        setInterval(() => {
            if (isFaked && currentMainBalance > 0) {
                let fluctuation = currentMainBalance * (Math.random() * 0.0004 - 0.0002); 
                let displayVal = currentMainBalance + fluctuation;
                let percentChange = ((fluctuation / currentMainBalance) * 100).toFixed(2);
                let sign = percentChange >= 0 ? '+' : '';
                
                animateUpdate('main-balance', formatMoney(displayVal));
                
                const subColor = percentChange >= 0 ? '#50F485' : '#FF453A';
                animateUpdate('sub-balance', `${formatMoney(displayVal)} (${sign}${percentChange}%)`, subColor);
            }
        }, 3000);

        async function fetchCryptoPrices() {
            // Добавили SOLUSDT в парсинг
            const symbols = { 'sol': 'SOLUSDT', 'eth': 'ETHUSDT', 'btc': 'BTCUSDT', 'bnb': 'BNBUSDT' };
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                const data = await res.json();

                for (const[coin, sym] of Object.entries(symbols)) {
                    const coinData = data.find(i => i.symbol === sym);
                    if (coinData) {
                        const price = parseFloat(coinData.lastPrice);
                        let change = parseFloat(coinData.priceChangePercent);
                        
                        change = change + (Math.random() * 0.02 - 0.01);
                        
                        animateUpdate(`price-${coin}`, formatMoney(price));
                        
                        const changeStr = change >= 0 ? `+${change.toFixed(2)}%` : `${change.toFixed(2)}%`;
                        const changeColor = change >= 0 ? '#50F485' : '#FF453A';
                        animateUpdate(`change-${coin}`, changeStr, changeColor);
                    }
                }
            } catch (e) { console.log('API Error'); }
        }

        const scrollContainer = document.getElementById('main-scroll');
        const ptrIndicator = document.getElementById('ptr-indicator');
        let startY = 0;
        let isPulling = false;

        scrollContainer.addEventListener('touchstart', (e) => {
            if (scrollContainer.scrollTop === 0) {
                startY = e.touches[0].clientY;
                isPulling = true;
                ptrIndicator.style.transition = 'none';
            }
        }, {passive: true});

        scrollContainer.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            const currentY = e.touches[0].clientY;
            const diff = currentY - startY;

            if (diff > 0 && scrollContainer.scrollTop === 0) {
                if (e.cancelable) e.preventDefault();
                ptrIndicator.style.height = Math.min(diff * 0.4, 70) + 'px';
            }
        }, {passive: false});

        scrollContainer.addEventListener('touchend', async () => {
            if (!isPulling) return;
            isPulling = false;
            ptrIndicator.style.transition = 'height 0.3s ease';

            const height = parseInt(ptrIndicator.style.height || '0');
            if (height >= 50) { 
                ptrIndicator.style.height = '60px'; 
                
                await fetchCryptoPrices(); 
                
                if (isFaked && currentMainBalance > 0) {
                    let fluctuation = currentMainBalance * (Math.random() * 0.0004 - 0.0002); 
                    let displayVal = currentMainBalance + fluctuation;
                    let percentChange = ((fluctuation / currentMainBalance) * 100).toFixed(2);
                    let sign = percentChange >= 0 ? '+' : '';
                    
                    animateUpdate('main-balance', formatMoney(displayVal));
                    const subColor = percentChange >= 0 ? '#50F485' : '#FF453A';
                    animateUpdate('sub-balance', `${formatMoney(displayVal)} (${sign}${percentChange}%)`, subColor);
                }

                setTimeout(() => { ptrIndicator.style.height = '0px'; }, 600); 
            } else {
                ptrIndicator.style.height = '0px'; 
            }
        });

        setTimeout(() => {
            fetchCryptoPrices();
            setInterval(fetchCryptoPrices, 10000);
        }, 5000);
    </script>
</body>
</html>
