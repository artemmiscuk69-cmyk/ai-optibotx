<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Wallet Crypto</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0f0f0f; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .app-container {
            width: 390px;
            height: 844px;
            background-color: #171719;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        /* Скрываем скроллбар */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [balance, setBalance] = useState(0);
            const [isDepositMenu, setIsDepositMenu] = useState(false);
            const [depositAmount, setDepositAmount] = useState('');
            const [prices, setPrices] = useState({
                SOL: { price: 0, change: 0, cap: '0 B' },
                ETH: { price: 0, change: 0, cap: '0 B' },
                BTC: { price: 0, change: 0, cap: '0 B' },
                BNB: { price: 0, change: 0, cap: '0 M' }
            });

            // Функция для получения курсов с Binance API
            const fetchPrices = async () => {
                try {
                    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT"]');
                    const data = await res.json();
                    
                    const newPrices = { ...prices };
                    data.forEach(coin => {
                        const symbol = coin.symbol.replace('USDT', '');
                        // Форматируем капитализацию для красоты (примерно)
                        const volume = parseFloat(coin.quoteVolume);
                        let capStr = volume > 1000000000 ? (volume/1000000000).toFixed(2) + ' $B' : (volume/1000000).toFixed(2) + ' $M';
                        
                        newPrices[symbol] = {
                            price: parseFloat(coin.lastPrice),
                            change: parseFloat(coin.priceChangePercent),
                            cap: capStr
                        };
                    });
                    setPrices(newPrices);
                } catch (error) {
                    console.error("Ошибка обновления курсов:", error);
                }
            };

            // Обновляем курсы при старте и каждые 5 секунд
            useEffect(() => {
                fetchPrices();
                const interval = setInterval(fetchPrices, 5000);
                return () => clearInterval(interval);
            }, []);

            const handleDeposit = () => {
                if (depositAmount && !isNaN(depositAmount)) {
                    setBalance(parseFloat(depositAmount));
                    setDepositAmount('');
                    setIsDepositMenu(false);
                }
            };

            const formatMoney = (val) => {
                return val.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' $';
            };

            // --- Экран пополнения (Подробнее) ---
            if (isDepositMenu) {
                return (
                    <div className="app-container p-6 bg-[#171719] flex flex-col justify-center items-center">
                        <h2 className="text-2xl font-bold mb-6">Пополнение баланса</h2>
                        <input 
                            type="number" 
                            className="bg-[#242426] text-white text-center text-3xl p-4 rounded-2xl w-full mb-6 outline-none border border-transparent focus:border-[#4ade80]"
                            placeholder="0.00"
                            value={depositAmount}
                            onChange={(e) => setDepositAmount(e.target.value)}
                        />
                        <div className="flex gap-4 w-full">
                            <button 
                                onClick={() => setIsDepositMenu(false)}
                                className="flex-1 bg-[#242426] p-4 rounded-xl text-white font-semibold">
                                Отмена
                            </button>
                            <button 
                                onClick={handleDeposit}
                                className="flex-1 bg-[#4ade80] p-4 rounded-xl text-black font-bold">
                                Пополнить
                            </button>
                        </div>
                    </div>
                );
            }

            // --- Главный экран ---
            return (
                <div className="app-container text-white">
                    {/* Top Header */}
                    <div className="flex items-center justify-between px-5 pt-6 pb-4">
                        <i className="fas fa-cog text-gray-400 text-xl cursor-pointer"></i>
                        <div className="flex-1 mx-4 bg-[#242426] rounded-full flex items-center px-4 py-2">
                            <i className="fas fa-search text-gray-500 mr-2 text-sm"></i>
                            <input type="text" placeholder="Поиск" className="bg-transparent text-sm w-full outline-none text-white placeholder-gray-500" />
                            <i className="fas fa-expand text-gray-500 ml-2 text-sm"></i>
                        </div>
                        <i className="fas fa-qrcode text-gray-400 text-xl cursor-pointer"></i>
                    </div>

                    <div className="flex-1 overflow-y-auto no-scrollbar pb-24">
                        {/* Wallet Selector */}
                        <div className="flex justify-center items-center gap-2 mt-2">
                            <div className="bg-[#242426] px-4 py-1.5 rounded-full flex items-center gap-2 text-sm font-medium cursor-pointer">
                                Основной кошелек <i className="fas fa-chevron-right text-xs text-gray-400"></i>
                            </div>
                            <div className="bg-[#242426] w-8 h-8 rounded-full flex items-center justify-center cursor-pointer">
                                <i className="far fa-copy text-gray-400 text-sm"></i>
                            </div>
                        </div>

                        {/* Balance */}
                        <div className="text-center mt-8 mb-8">
                            <h1 className="text-[44px] font-bold leading-tight">{formatMoney(balance)}</h1>
                            <p className="text-gray-400 text-sm">{formatMoney(balance)} (0.00%)</p>
                        </div>

                        {/* Action Buttons */}
                        <div className="flex justify-center gap-4 px-6 mb-8">
                            <div className="flex flex-col items-center gap-2">
                                <button className="w-[60px] h-[60px] bg-[#242426] rounded-2xl flex items-center justify-center hover:bg-[#2c2c2e] transition">
                                    <i className="fas fa-arrow-up text-xl"></i>
                                </button>
                                <span className="text-xs text-gray-300">Отпр...</span>
                            </div>
                            <div className="flex flex-col items-center gap-2">
                                <button className="w-[60px] h-[60px] bg-[#242426] rounded-2xl flex items-center justify-center hover:bg-[#2c2c2e] transition">
                                    <i className="fas fa-arrow-down text-xl"></i>
                                </button>
                                <span className="text-xs text-gray-300">Полу...</span>
                            </div>
                            <div className="flex flex-col items-center gap-2">
                                <button className="w-[60px] h-[60px] bg-[#242426] rounded-2xl flex items-center justify-center hover:bg-[#2c2c2e] transition">
                                    <i className="fas fa-exchange-alt text-xl"></i>
                                </button>
                                <span className="text-xs text-gray-300">Обмен</span>
                            </div>
                            <div className="flex flex-col items-center gap-2">
                                <button className="w-[60px] h-[60px] bg-[#4ade80] rounded-2xl flex items-center justify-center hover:bg-[#3bcf71] transition">
                                    <i className="fas fa-plus text-black text-xl"></i>
                                </button>
                                <span className="text-xs text-gray-300">Поку...</span>
                            </div>
                        </div>

                        {/* Tabs */}
                        <div className="flex items-center px-6 mb-4 border-b border-[#242426]">
                            <div className="text-gray-400 text-sm font-medium mr-6 pb-3 cursor-pointer hover:text-white">Криптовалюта</div>
                            <div className="text-white text-sm font-medium mr-6 pb-3 border-b-2 border-[#4ade80] cursor-pointer">Избранное</div>
                            <div className="text-gray-400 text-sm font-medium mr-auto pb-3 cursor-pointer hover:text-white">NFT</div>
                            <div className="flex gap-4 pb-3">
                                <i className="fas fa-history text-gray-400 cursor-pointer"></i>
                                <i className="fas fa-sliders-h text-gray-400 cursor-pointer"></i>
                            </div>
                        </div>

                        {/* Coin List */}
                        <div className="px-6 flex flex-col gap-5">
                            {/* SOL */}
                            <div className="flex justify-between items-center cursor-pointer">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-green-400 flex items-center justify-center">
                                        <span className="font-bold text-xs">SOL</span>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-base">SOL</h3>
                                        <p className="text-xs text-gray-400">{prices.SOL.cap}</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <h3 className="font-bold text-base">{formatMoney(prices.SOL.price)}</h3>
                                    <p className={`text-xs ${prices.SOL.change >= 0 ? 'text-[#4ade80]' : 'text-red-500'}`}>
                                        {prices.SOL.change > 0 ? '+' : ''}{prices.SOL.change.toFixed(2)}%
                                    </p>
                                </div>
                            </div>

                            {/* ETH */}
                            <div className="flex justify-between items-center cursor-pointer">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-[#627EEA] flex items-center justify-center">
                                        <i className="fab fa-ethereum text-white text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-base">ETH</h3>
                                        <p className="text-xs text-gray-400">{prices.ETH.cap}</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <h3 className="font-bold text-base">{formatMoney(prices.ETH.price)}</h3>
                                    <p className={`text-xs ${prices.ETH.change >= 0 ? 'text-[#4ade80]' : 'text-red-500'}`}>
                                        {prices.ETH.change > 0 ? '+' : ''}{prices.ETH.change.toFixed(2)}%
                                    </p>
                                </div>
                            </div>

                            {/* BTC */}
                            <div className="flex justify-between items-center cursor-pointer">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-[#F7931A] flex items-center justify-center">
                                        <i className="fab fa-bitcoin text-white text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-base">BTC</h3>
                                        <p className="text-xs text-gray-400">{prices.BTC.cap}</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <h3 className="font-bold text-base">{formatMoney(prices.BTC.price)}</h3>
                                    <p className={`text-xs ${prices.BTC.change >= 0 ? 'text-[#4ade80]' : 'text-red-500'}`}>
                                        {prices.BTC.change > 0 ? '+' : ''}{prices.BTC.change.toFixed(2)}%
                                    </p>
                                </div>
                            </div>

                            {/* BNB */}
                            <div className="flex justify-between items-center cursor-pointer">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-[#F3BA2F] flex items-center justify-center">
                                        <span className="font-bold text-xs text-black">BNB</span>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-base">BNB</h3>
                                        <p className="text-xs text-gray-400">{prices.BNB.cap}</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <h3 className="font-bold text-base">{formatMoney(prices.BNB.price)}</h3>
                                    <p className={`text-xs ${prices.BNB.change >= 0 ? 'text-[#4ade80]' : 'text-red-500'}`}>
                                        {prices.BNB.change > 0 ? '+' : ''}{prices.BNB.change.toFixed(2)}%
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="text-center mt-6">
                            <a href="#" className="text-[#4ade80] text-sm font-medium hover:underline">Просмотреть токены</a>
                        </div>
                        
                        <div className="mt-8 px-6">
                            <h2 className="text-lg font-bold mb-4">Заработок <i className="fas fa-chevron-right text-xs ml-1"></i></h2>
                            {/* Placeholder for Earn cards */}
                            <div className="h-24 bg-[#242426] rounded-2xl border border-gray-700"></div>
                        </div>
                    </div>

                    {/* Bottom Navigation */}
                    <div className="absolute bottom-0 w-full bg-[#1C1C1E] border-t border-[#2A2A2D] pb-6 pt-3 px-6 flex justify-between items-center z-10 rounded-b-[30px]">
                        <div className="flex flex-col items-center gap-1 cursor-pointer">
                            <i className="fas fa-home text-[#4ade80] text-xl"></i>
                            <span className="text-[10px] text-[#4ade80]">Главная</span>
                        </div>
                        <div className="flex flex-col items-center gap-1 cursor-pointer">
                            <i className="fas fa-chart-line text-gray-500 text-xl"></i>
                            <span className="text-[10px] text-gray-500">Популярные</span>
                        </div>
                        
                        {/* Center Swap Button */}
                        <div className="relative -top-4">
                            <div className="w-14 h-14 bg-[#4ade80] rounded-full flex items-center justify-center shadow-lg border-4 border-[#1C1C1E] cursor-pointer">
                                <i className="fas fa-exchange-alt text-black text-xl"></i>
                            </div>
                            <span className="absolute -bottom-5 w-full text-center text-[10px] text-gray-500">Торговать</span>
                        </div>

                        <div className="flex flex-col items-center gap-1 cursor-pointer">
                            <i className="fas fa-gift text-gray-500 text-xl"></i>
                            <span className="text-[10px] text-gray-500">Награды</span>
                        </div>
                        <div 
                            className="flex flex-col items-center gap-1 cursor-pointer hover:text-white"
                            onClick={() => setIsDepositMenu(true)}
                        >
                            <i className="fas fa-ellipsis-h text-gray-500 text-xl"></i>
                            <span className="text-[10px] text-gray-500">Подробнее</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
